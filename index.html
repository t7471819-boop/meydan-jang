<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>بازی تیراندازی سه بعدی موبایل</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    font-family: Tahoma, sans-serif; background: #000;
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  canvas { display: block; }

  #hud {
    position: fixed; top: max(15px, env(safe-area-inset-top)); left: 15px;
    color: #fff; font-size: 18px; text-shadow: 2px 2px 4px #000;
    pointer-events: none; z-index: 10; line-height: 1.6;
  }

  #crosshair {
    position: fixed; top: 50%; left: 50%;
    width: 36px; height: 36px; transform: translate(-50%, -50%);
    pointer-events: none; z-index: 5;
  }
  #crosshair::before, #crosshair::after {
    content: ''; position: absolute; background: #0f0;
    box-shadow: 0 0 6px #0f0;
  }
  #crosshair::before { top: 50%; left: 0; width: 100%; height: 2px; transform: translateY(-50%); }
  #crosshair::after { left: 50%; top: 0; height: 100%; width: 2px; transform: translateX(-50%); }

  /* جوی‌استیک چپ */
  #joystick {
    position: fixed;
    left: max(20px, env(safe-area-inset-left));
    bottom: max(20px, env(safe-area-inset-bottom));
    width: 130px; height: 130px;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    border: 2px solid rgba(255,255,255,0.3);
    z-index: 20; touch-action: none;
  }
  #stick {
    position: absolute;
    left: 50%; top: 50%;
    width: 60px; height: 60px;
    margin: -30px 0 0 -30px;
    border-radius: 50%;
    background: rgba(0,255,0,0.4);
    border: 2px solid #0f0;
    box-shadow: 0 0 15px rgba(0,255,0,0.6);
    pointer-events: none;
  }

  /* دکمه شلیک */
  #fireBtn {
    position: fixed;
    right: max(25px, env(safe-area-inset-right));
    bottom: max(30px, env(safe-area-inset-bottom));
    width: 110px; height: 110px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,50,50,0.7), rgba(200,0,0,0.9));
    border: 3px solid #fff;
    color: #fff; font-size: 16px; font-weight: bold;
    font-family: inherit; cursor: pointer;
    box-shadow: 0 0 20px rgba(255,0,0,0.7);
    z-index: 20; touch-action: none;
    display: flex; align-items: center; justify-content: center;
  }
  #fireBtn:active { transform: scale(0.92); background: radial-gradient(circle, #ff0, #f00); }

  /* دکمه پرش */
  #jumpBtn {
    position: fixed;
    right: max(150px, calc(env(safe-area-inset-right) + 150px));
    bottom: max(60px, calc(env(safe-area-inset-bottom) + 40px));
    width: 80px; height: 80px;
    border-radius: 50%;
    background: rgba(0,150,255,0.5);
    border: 2px solid rgba(255,255,255,0.6);
    color: #fff; font-size: 14px; font-weight: bold;
    font-family: inherit;
    z-index: 20; touch-action: none;
    display: flex; align-items: center; justify-content: center;
  }
  #jumpBtn:active { transform: scale(0.92); background: rgba(0,200,255,0.8); }

  /* صفحه شروع */
  #overlay {
    position: fixed; inset: 0;
    background: linear-gradient(135deg, rgba(0,0,0,0.9), rgba(0,30,0,0.95));
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #fff; text-align: center; z-index: 100; padding: 20px;
  }
  #overlay h1 { font-size: 28px; margin-bottom: 15px; color: #0f0; text-shadow: 0 0 20px #0f0; }
  #overlay p {
    font-size: 15px; line-height: 2; max-width: 400px;
    background: rgba(0,0,0,0.4); padding: 15px 20px; border-radius: 12px;
    border: 1px solid rgba(0,255,0,0.3);
  }
  #overlay button {
    padding: 15px 45px; font-size: 20px;
    background: linear-gradient(135deg, #0f0, #0a0);
    color: #000; border: none; border-radius: 50px;
    cursor: pointer; font-family: inherit; font-weight: bold;
    margin-top: 25px;
    box-shadow: 0 0 30px rgba(0,255,0,0.6);
  }
  #overlay button:active { transform: scale(0.95); }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="crosshair"></div>
<div id="hud">
  🎯 امتیاز: <span id="score">0</span><br>
  ❤️ جان: <span id="health">100</span>
</div>

<div id="joystick"><div id="stick"></div></div>
<div id="fireBtn">شلیک</div>
<div id="jumpBtn">پرش</div>

<div id="overlay">
  <h1>🎯 شوتر سه‌بعدی</h1>
  <p>
    🕹️ <b>جوی‌استیک چپ:</b> حرکت<br>
    👆 <b>کشیدن انگشت روی صفحه:</b> چرخش دید<br>
    🔴 <b>دکمه شلیک:</b> تیراندازی<br>
    🔵 <b>دکمه پرش:</b> پرش
  </p>
  <button id="startBtn">شروع بازی</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// ============ تنظیمات ============
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 25, 80);

const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// ============ نور ============
scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const sun = new THREE.DirectionalLight(0xffffff, 1);
sun.position.set(20, 30, 15);
sun.castShadow = true;
sun.shadow.mapSize.width = 1024;
sun.shadow.mapSize.height = 1024;
sun.shadow.camera.left = -40;
sun.shadow.camera.right = 40;
sun.shadow.camera.top = 40;
sun.shadow.camera.bottom = -40;
scene.add(sun);

// ============ زمین ============
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(200, 200),
  new THREE.MeshStandardMaterial({ color: 0x3a7d44 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// چند ساختمون برای عمق بصری
for (let i = 0; i < 25; i++) {
  const h = 2 + Math.random() * 6;
  const box = new THREE.Mesh(
    new THREE.BoxGeometry(2 + Math.random() * 2, h, 2 + Math.random() * 2),
    new THREE.MeshStandardMaterial({
      color: new THREE.Color().setHSL(0.6, 0.1, 0.4 + Math.random() * 0.3)
    })
  );
  const angle = Math.random() * Math.PI * 2;
  const dist = 25 + Math.random() * 40;
  box.position.set(Math.cos(angle) * dist, h / 2, Math.sin(angle) * dist);
  box.castShadow = true;
  box.receiveShadow = true;
  scene.add(box);
}

// ============ بازیکن ============
const player = {
  height: 1.7,
  speed: 0.14,
  velocityY: 0,
  onGround: true,
  position: new THREE.Vector3(0, 1.7, 0),
};
camera.position.copy(player.position);
camera.rotation.order = 'YXZ';

let yaw = 0, pitch = 0;

// ============ جوی‌استیک ============
const joystick = document.getElementById('joystick');
const stick = document.getElementById('stick');
let joyActive = false, joyId = null;
const joyVec = { x: 0, y: 0 };
const joyMaxDist = 45;

function getJoyCenter() {
  const r = joystick.getBoundingClientRect();
  return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
}

joystick.addEventListener('touchstart', (e) => {
  e.preventDefault();
  const t = e.changedTouches[0];
  joyId = t.identifier;
  joyActive = true;
  updateJoy(t);
}, { passive: false });

joystick.addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (!joyActive) return;
  for (const t of e.changedTouches) {
    if (t.identifier === joyId) { updateJoy(t); break; }
  }
}, { passive: false });

joystick.addEventListener('touchend', (e) => {
  for (const t of e.changedTouches) {
    if (t.identifier === joyId) {
      joyActive = false; joyId = null;
      joyVec.x = 0; joyVec.y = 0;
      stick.style.transform = 'translate(0,0)';
    }
  }
});

joystick.addEventListener('touchcancel', () => {
  joyActive = false; joyId = null;
  joyVec.x = 0; joyVec.y = 0;
  stick.style.transform = 'translate(0,0)';
});

function updateJoy(t) {
  const c = getJoyCenter();
  let dx = t.clientX - c.x;
  let dy = t.clientY - c.y;
  const dist = Math.hypot(dx, dy);
  if (dist > joyMaxDist) {
    dx = (dx / dist) * joyMaxDist;
    dy = (dy / dist) * joyMaxDist;
  }
  stick.style.transform = `translate(${dx}px, ${dy}px)`;
  joyVec.x = dx / joyMaxDist;
  joyVec.y = dy / joyMaxDist;
}

// ============ چرخش دید با کشیدن انگشت روی صفحه ============
let lookId = null, lastLookX = 0, lastLookY = 0;
const lookSensitivity = 0.005;

renderer.domElement.addEventListener('touchstart', (e) => {
  if (lookId !== null) return;
  const t = e.changedTouches[0];
  // فقط روی بخش راست صفحه (یا هرجای صفحه به جز دکمه‌ها)
  const screenX = t.clientX;
  if (screenX > innerWidth * 0.35) {
    lookId = t.identifier;
    lastLookX = t.clientX;
    lastLookY = t.clientY;
  }
}, { passive: true });

renderer.domElement.addEventListener('touchmove', (e) => {
  if (lookId === null) return;
  for (const t of e.changedTouches) {
    if (t.identifier === lookId) {
      const dx = t.clientX - lastLookX;
      const dy = t.clientY - lastLookY;
      yaw -= dx * lookSensitivity;
      pitch -= dy * lookSensitivity;
      pitch = Math.max(-Math.PI / 2 + 0.1, Math.min(Math.PI / 2 - 0.1, pitch));
      lastLookX = t.clientX;
      lastLookY = t.clientY;
    }
  }
}, { passive: true });

renderer.domElement.addEventListener('touchend', (e) => {
  for (const t of e.changedTouches) {
    if (t.identifier === lookId) lookId = null;
  }
});

renderer.domElement.addEventListener('touchcancel', () => {
  lookId = null;
});

// ============ شلیک ============
const fireBtn = document.getElementById('fireBtn');
let canShoot = true;
let fireHeld = false;

fireBtn.addEventListener('touchstart', (e) => {
  e.preventDefault();
  fireHeld = true;
  if (gameState === 'playing') shoot();
}, { passive: false });

fireBtn.addEventListener('touchend', (e) => {
  e.preventDefault();
  fireHeld = false;
}, { passive: false });

// شلیک خودکار (نگه‌داشتن)
setInterval(() => {
  if (fireHeld && gameState === 'playing') shoot();
}, 220);

// ============ پرش ============
const jumpBtn = document.getElementById('jumpBtn');
jumpBtn.addEventListener('touchstart', (e) => {
  e.preventDefault();
  if (gameState === 'playing' && player.onGround) {
    player.velocityY = 0.32;
    player.onGround = false;
  }
}, { passive: false });

// ============ سیستم شلیک ============
const raycaster = new THREE.Raycaster();
const muzzleFlash = new THREE.PointLight(0xffaa00, 0, 5);
muzzleFlash.position.set(0, 0, -1);
camera.add(muzzleFlash);

function shoot() {
  if (!canShoot) return;
  canShoot = false;
  setTimeout(() => canShoot = true, 150);

  muzzleFlash.intensity = 3;
  setTimeout(() => muzzleFlash.intensity = 0, 60);

  raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
  const targets = enemies.map(en => en.mesh);
  const hits = raycaster.intersectObjects(targets);

  if (hits.length > 0) {
    const hitMesh = hits[0].object;
    const enemy = enemies.find(en => en.mesh === hitMesh);
    if (enemy) {
      enemy.health -= 50;
      hitMesh.material.emissiveIntensity = 1.5;
      setTimeout(() => {
        if (hitMesh.material) hitMesh.material.emissiveIntensity = 0.2;
      }, 80);
      if (enemy.health <= 0) killEnemy(enemy);
      else score += 10;
      updateHUD();
    }
  } else {
    // افکت رد گلوله
    const start = camera.position.clone();
    const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
    const end = start.clone().add(dir.multiplyScalar(50));
    const geo = new THREE.BufferGeometry().setFromPoints([start, end]);
    const line = new THREE.Line(geo, new THREE.LineBasicMaterial({
      color: 0xffff00, transparent: true, opacity: 1
    }));
    scene.add(line);
    setTimeout(() => scene.remove(line), 60);
  }
}

// ============ دشمن‌ها ============
const enemies = [];
const spawnPoints = [
  new THREE.Vector3(10, 0, -15),
  new THREE.Vector3(-12, 0, -20),
  new THREE.Vector3(15, 0, -25),
  new THREE.Vector3(-8, 0, -10),
  new THREE.Vector3(20, 0, -5),
  new THREE.Vector3(-18, 0, -8),
];

function createEnemy(pos) {
  const color = Math.random() > 0.5 ? 0xff3333 : 0xff8800;
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(1.2, 2, 1.2),
    new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.2 })
  );
  mesh.position.copy(pos);
  mesh.position.y = 1;
  mesh.castShadow = true;
  scene.add(mesh);

  const eyeGeo = new THREE.SphereGeometry(0.12, 6, 6);
  const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
  const e1 = new THREE.Mesh(eyeGeo, eyeMat);
  e1.position.set(-0.3, 0.3, 0.61);
  const e2 = new THREE.Mesh(eyeGeo, eyeMat);
  e2.position.set(0.3, 0.3, 0.61);
  mesh.add(e1, e2);

  enemies.push({
    mesh,
    health: 100,
    baseColor: color,
    speed: 0.015 + Math.random() * 0.015,
    phase: Math.random() * Math.PI * 2,
    cooldown: false,
  });
}

function killEnemy(enemy) {
  score += 50;
  updateHUD();

  // انفجار ذرات
  for (let i = 0; i < 15; i++) {
    const p = new THREE.Mesh(
      new THREE.SphereGeometry(0.12, 4, 4),
      new THREE.MeshBasicMaterial({ color: 0xffaa00, transparent: true })
    );
    p.position.copy(enemy.mesh.position);
    scene.add(p);
    const vel = new THREE.Vector3(
      (Math.random() - 0.5) * 0.35,
      Math.random() * 0.35,
      (Math.random() - 0.5) * 0.35
    );
    const start = performance.now();
    (function anim() {
      const t = (performance.now() - start) / 600;
      if (t > 1) { scene.remove(p); return; }
      p.position.add(vel);
      vel.y -= 0.012;
      p.material.opacity = 1 - t;
      requestAnimationFrame(anim);
    })();
  }

  scene.remove(enemy.mesh);
  const idx = enemies.indexOf(enemy);
  if (idx > -1) enemies.splice(idx, 1);

  setTimeout(() => {
    if (gameState === 'playing') {
      const sp = spawnPoints[Math.floor(Math.random() * spawnPoints.length)];
      const off = new THREE.Vector3((Math.random() - 0.5) * 12, 0, (Math.random() - 0.5) * 12);
      createEnemy(sp.clone().add(off));
    }
  }, 1200);
}

// ============ HUD ============
let score = 0;
let health = 100;
let gameState = 'menu';

function updateHUD() {
  document.getElementById('score').textContent = score;
  document.getElementById('health').textContent = health;
}

// ============ حلقه بازی ============
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);

  if (gameState === 'playing') {
    // حرکت با جوی‌استیک
    const forward = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
    const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
    const moveVec = new THREE.Vector3();

    if (joyVec.y < -0.15) moveVec.add(forward.clone().multiplyScalar(-joyVec.y));
    if (joyVec.y > 0.15) moveVec.add(forward.clone().multiplyScalar(-joyVec.y));
    if (joyVec.x > 0.15) moveVec.add(right.clone().multiplyScalar(joyVec.x));
    if (joyVec.x < -0.15) moveVec.add(right.clone().multiplyScalar(joyVec.x));

    if (moveVec.length() > 0) {
      moveVec.normalize().multiplyScalar(player.speed * 60 * dt);
      player.position.add(moveVec);
    }

    // گرانش
    player.velocityY -= 0.018 * 60 * dt;
    player.position.y += player.velocityY * 60 * dt;
    if (player.position.y <= player.height) {
      player.position.y = player.height;
      player.velocityY = 0;
      player.onGround = true;
    }

    // محدودیت
    const lim = 90;
    player.position.x = Math.max(-lim, Math.min(lim, player.position.x));
    player.position.z = Math.max(-lim, Math.min(lim, player.position.z));

    camera.position.copy(player.position);
    camera.rotation.y = yaw;
    camera.rotation.x = pitch;

    // دشمن‌ها
    const time = performance.now() * 0.001;
    for (const enemy of enemies) {
      const dir = new THREE.Vector3().subVectors(camera.position, enemy.mesh.position);
      dir.y = 0;
      const dist = dir.length();
      if (dist > 0.1) {
        dir.normalize().multiplyScalar(enemy.speed * 60 * dt);
        enemy.mesh.position.add(dir);
      }
      enemy.mesh.lookAt(camera.position.x, enemy.mesh.position.y, camera.position.z);
      enemy.mesh.position.y = 1 + Math.sin(time * 2 + enemy.phase) * 0.2;

      if (dist < 2 && !enemy.cooldown) {
        health = Math.max(0, health - 10);
        updateHUD();
        enemy.cooldown = true;
        setTimeout(() => enemy.cooldown = false, 1000);
        if (health <= 0) gameOver();
      }
    }
  }

  renderer.render(scene, camera);
}

// ============ شروع ============
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');

startBtn.addEventListener('click', () => {
  resetGame();
});

function resetGame() {
  enemies.forEach(e => scene.remove(e.mesh));
  enemies.length = 0;

  player.position.set(0, 1.7, 0);
  player.velocityY = 0;
  yaw = 0; pitch = 0;

  score = 0;
  health = 100;
  updateHUD();

  spawnPoints.forEach(sp => createEnemy(sp.clone()));

  gameState = 'playing';
  overlay.classList.add('hidden');
}

function gameOver() {
  gameState = 'gameover';
  overlay.classList.remove('hidden');
  overlay.querySelector('h1').textContent = '💀 بازی تمام شد!';
  overlay.querySelector('p').innerHTML =
    `امتیاز نهایی: <b style="color:#0f0;font-size:22px;">${score}</b>`;
  startBtn.textContent = 'بازی مجدد';
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

animate();
</script>
</body>
</html>
