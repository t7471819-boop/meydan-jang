<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FPS Game</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; padding:0; overflow:hidden; background:#000; font-family:monospace; touch-action:none; user-select:none; }

  /* پیام چرخش گوشی */
  #rotateOverlay {
    position:fixed; inset:0; background:#0a0a15; color:#0f0;
    display:none; flex-direction:column; align-items:center; justify-content:center;
    z-index:9999; font-size:20px; text-align:center; padding:20px;
  }
  #rotateOverlay .icon { font-size:70px; margin-bottom:20px; animation: rotate 2s infinite; }
  @keyframes rotate {
    0%,40% { transform: rotate(0deg); }
    60%,100% { transform: rotate(-90deg); }
  }
  @media (orientation: portrait) and (max-width: 900px) {
    #rotateOverlay { display:flex; }
    #gameContainer, #crosshair, .hud, #mobileControls { display:none !important; }
  }

  #crosshair { position:fixed; top:50%; left:50%; width:22px; height:22px; transform:translate(-50%,-50%); z-index:10; pointer-events:none;}
  #crosshair::before, #crosshair::after { content:''; position:absolute; background:#0f0; box-shadow:0 0 4px #000;}
  #crosshair::before { left:50%; top:0; width:2px; height:100%; transform:translateX(-50%);}
  #crosshair::after { top:50%; left:0; height:2px; width:100%; transform:translateY(-50%);}

  .hud { position:fixed; color:#0f0; font-size:16px; z-index:10; text-shadow:0 0 5px #000; pointer-events:none;}
  #hud { bottom:15px; left:15px; font-size:20px;}
  #weaponUI { bottom:15px; right:15px; text-align:right; line-height:1.6;}
  #info { top:15px; left:15px; font-size:12px; line-height:1.7; max-width:60%;}

  /* کنترل‌های لمسی */
  #mobileControls { position:fixed; inset:0; z-index:20; pointer-events:none; display:none; }
  #joyLeft, #joyRight {
    position:absolute; bottom:20px; width:130px; height:130px; border-radius:50%;
    background:rgba(0,255,0,0.08); border:2px solid rgba(0,255,0,0.4);
    pointer-events:auto; touch-action:none;
  }
  #joyLeft { left:20px; }
  #joyRight { right:20px; bottom:170px; width:160px; height:160px; background:rgba(255,255,0,0.06); border-color:rgba(255,255,0,0.4); }
  .joyKnob {
    position:absolute; top:50%; left:50%; width:56px; height:56px; border-radius:50%;
    background:rgba(0,255,0,0.35); border:2px solid #0f0;
    transform:translate(-50%,-50%); box-shadow:0 0 12px rgba(0,255,0,0.6);
  }
  #joyRight .joyKnob { background:rgba(255,255,0,0.35); border-color:#ff0; box-shadow:0 0 12px rgba(255,255,0,0.6); }

  #fireBtn, #reloadBtn, #switchBtn {
    position:absolute; bottom:20px; border-radius:50%; pointer-events:auto;
    background:rgba(255,60,60,0.25); border:2px solid #f33; color:#fff;
    font-size:14px; font-weight:bold; display:flex; align-items:center; justify-content:center;
  }
  #fireBtn { right:20px; width:90px; height:90px; font-size:16px; background:rgba(255,40,40,0.35); }
  #reloadBtn { right:120px; bottom:110px; width:60px; height:60px; background:rgba(60,120,255,0.3); border-color:#48f; }
  #switchBtn { right:20px; bottom:180px; width:60px; height:60px; background:rgba(255,200,60,0.3); border-color:#fc0; }

  @media (max-width: 900px) and (orientation: landscape) {
    #mobileControls { display:block; }
    #info { font-size:11px; }
  }
</style>
</head>
<body>

<div id="rotateOverlay">
  <div class="icon">📱</div>
  <div>لطفاً گوشی را <b>افقی</b> بگیرید</div>
  <div style="font-size:14px;opacity:0.7;margin-top:10px;">(Rotate your phone to landscape)</div>
</div>

<div id="crosshair"></div>
<div class="hud" id="hud">HP: <span id="hp">100</span> | Kill: <span id="kills">0</span></div>
<div class="hud" id="weaponUI">
  <div>سلاح: <span id="weaponName">Rifle</span></div>
  <div>خشاب: <span id="ammo">30</span> / <span id="mag">30</span></div>
</div>
<div class="hud" id="info">
  دسکتاپ: کلیک = ورود | WASD حرکت | ماوس نگاه | کلیک شلیک | R خشاب | 1/2 سلاح | Space پرش<br>
  موبایل: جوی‌استیک چپ = حرکت | کشیدن سمت راست = نگاه | دکمه‌ها = شلیک/خشاب/سلاح
</div>

<div id="mobileControls">
  <div id="joyLeft"><div class="joyKnob" id="knobLeft"></div></div>
  <div id="joyRight"><div class="joyKnob" id="knobRight"></div></div>
  <button id="fireBtn">شلیک</button>
  <button id="reloadBtn">R</button>
  <button id="switchBtn">🔫</button>
</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

// ---------- تشخیص موبایل ----------
const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || 
                 ('ontouchstart' in window && innerWidth < 1024);

// ---------- صحنه ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);
scene.fog = new THREE.Fog(0x1a1a2e, 25, 110);

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 500);
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = !isMobile;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
addEventListener('orientationchange', () => {
  setTimeout(() => {
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  }, 300);
});

// ---------- نور ----------
scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const sun = new THREE.DirectionalLight(0xffffff, 1);
sun.position.set(20, 40, 20);
if (!isMobile) {
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -50;
  sun.shadow.camera.right = 50;
  sun.shadow.camera.top = 50;
  sun.shadow.camera.bottom = -50;
}
scene.add(sun);

// ---------- زمین ----------
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(300, 300),
  new THREE.MeshStandardMaterial({ color:0x3a3a3a, roughness:1 })
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

// ---------- دیوارها ----------
for (let i = 0; i < 12; i++) {
  const w = new THREE.Mesh(
    new THREE.BoxGeometry(3, 4, 1),
    new THREE.MeshStandardMaterial({ color:0x555577 })
  );
  const a = i / 12 * Math.PI * 2;
  w.position.set(Math.sin(a)*18, 2, Math.cos(a)*18);
  w.rotation.y = a;
  w.castShadow = !isMobile; w.receiveShadow = true;
  scene.add(w);
}

// ---------- دشمن ----------
const enemies = [];
function createEnemy(pos) {
  const g = new THREE.Group();
  const skinMat = new THREE.MeshStandardMaterial({ color:0xffcc99 });
  const bodyMat = new THREE.MeshStandardMaterial({ color:0x882222 });

  const body = new THREE.Mesh(new THREE.BoxGeometry(0.7, 1.4, 0.4), bodyMat);
  body.position.y = 1.2; body.castShadow = !isMobile; g.add(body);

  const head = new THREE.Mesh(new THREE.SphereGeometry(0.32, 16, 16), skinMat);
  head.position.y = 2.15; head.castShadow = !isMobile; g.add(head);

  const eyeMat = new THREE.MeshStandardMaterial({ color:0x000000, emissive:0x330000 });
  const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 8), eyeMat);
  eyeL.position.set(-0.12, 2.2, 0.3); g.add(eyeL);
  const eyeR = eyeL.clone(); eyeR.position.x = 0.12; g.add(eyeR);

  const earL = new THREE.Mesh(new THREE.SphereGeometry(0.09, 8, 8), skinMat);
  earL.position.set(-0.33, 2.15, 0); g.add(earL);
  const earR = earL.clone(); earR.position.x = 0.33; g.add(earR);

  const legMat = new THREE.MeshStandardMaterial({ color:0x222244 });
  const legL = new THREE.Mesh(new THREE.BoxGeometry(0.25, 1, 0.25), legMat);
  legL.position.set(-0.18, 0.5, 0); legL.castShadow = !isMobile; g.add(legL);
  const legR = legL.clone(); legR.position.x = 0.18; g.add(legR);

  const armL = new THREE.Mesh(new THREE.BoxGeometry(0.2, 1, 0.2), bodyMat);
  armL.position.set(-0.5, 1.4, 0); armL.castShadow = !isMobile; g.add(armL);
  const armR = armL.clone(); armR.position.x = 0.5; g.add(armR);

  g.position.copy(pos);
  g.userData = { hp:100, alive:true, walkPhase: Math.random()*10 };
  scene.add(g);
  enemies.push(g);
}

function spawnRandomEnemy() {
  createEnemy(new THREE.Vector3((Math.random()-0.5)*40, 0, (Math.random()-0.5)*40 - 10));
}
for (let i = 0; i < (isMobile ? 4 : 6); i++) spawnRandomEnemy();

// ---------- صدا ----------
let audioCtx = null;
function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function playSound(freq, dur, type='square', vol=0.15) {
  if (!audioCtx || audioCtx.state !== 'running') return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime + dur);
}
const shotSound    = () => { playSound(180, 0.08, 'square', 0.2); playSound(80, 0.12, 'sawtooth', 0.15); };
const hitSound     = () => playSound(600, 0.1, 'sine', 0.2);
const enemyGroan   = () => playSound(120 + Math.random()*60, 0.4, 'sawtooth', 0.1);
const reloadSound  = () => playSound(300, 0.15, 'sine', 0.1);
const emptySound   = () => playSound(80, 0.05, 'square', 0.1);

// ---------- دوربین ----------
const cameraHolder = new THREE.Object3D();
cameraHolder.add(camera);
scene.add(cameraHolder);

// ---------- ساخت تفنگ ----------
function makeRifle() {
  const g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color:0x333333, metalness:0.7, roughness:0.4 });
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.12, 0.7), mat);
  body.position.z = -0.35; g.add(body);
  const barrel = new THREE.Mesh(
    new THREE.CylinderGeometry(0.03, 0.03, 0.6, 8),
    new THREE.MeshStandardMaterial({ color:0x111111, metalness:0.9 })
  );
  barrel.rotation.x = Math.PI/2; barrel.position.z = -0.9; g.add(barrel);
  const stock = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.15, 0.3), mat);
  stock.position.set(0, -0.05, 0.05); g.add(stock);
  const grip = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.2, 0.1), mat);
  grip.position.set(0, -0.15, 0.1); g.add(grip);
  g.position.set(0.25, -0.25, -0.5);
  return g;
}

function makeSMG() {
  const g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color:0x444444, metalness:0.7, roughness:0.4 });
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.15, 0.5), mat);
  body.position.z = -0.25; g.add(body);
  const barrel = new THREE.Mesh(
    new THREE.CylinderGeometry(0.035, 0.035, 0.35, 8),
    new THREE.MeshStandardMaterial({ color:0x111111 })
  );
  barrel.rotation.x = Math.PI/2; barrel.position.z = -0.65; g.add(barrel);
  const mag = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.25, 0.1), mat);
  mag.position.set(0, -0.2, -0.15); g.add(mag);
  const grip = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.18, 0.1), mat);
  grip.position.set(0, -0.15, 0.05); g.add(grip);
  g.position.set(0.25, -0.25, -0.4);
  return g;
}

// ---------- سیستم سلاح ----------
const weapons = {
  rifle: { name:'Rifle', obj: makeRifle(), damage:34, fireRate:350, auto:false, mag:30, ammo:30, reserve:90, recoil:0.06 },
  smg:   { name:'SMG',   obj: makeSMG(),   damage:12, fireRate:80,  auto:true,  mag:30, ammo:30, reserve:120, recoil:0.03 }
};
let currentWeapon = 'rifle';
camera.add(weapons.rifle.obj);
camera.add(weapons.smg.obj);
weapons.smg.obj.visible = false;
const weaponOrder = ['rifle', 'smg'];

// ---------- کنترل بازیکن ----------
const keys = {};
const player = {
  vel: new THREE.Vector3(),
  pos: new THREE.Vector3(0, 1.7, 0),
  onGround: true,
  hp: 100
};
let yaw = 0, pitch = 0;
let recoilKick = 0;
let kills = 0;
let lastShotTime = 0;
let isFiring = false;
let moveInput = { x:0, y:0 }; // برای جوی‌استیک چپ

// کیبورد
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Digit1') switchWeapon('rifle');
  if (e.code === 'Digit2') switchWeapon('smg');
  if (e.code === 'KeyR') reload();
});
addEventListener('keyup', e => keys[e.code] = false);

// موس (دسکتاپ)
if (!isMobile) {
  document.addEventListener('click', () => {
    initAudio();
    if (document.pointerLockElement !== renderer.domElement) {
      renderer.domElement.requestPointerLock();
    }
  });
  document.addEventListener('mousemove', e => {
    if (document.pointerLockElement === renderer.domElement) {
      yaw   -= e.movementX * 0.002;
      pitch -= e.movementY * 0.002;
      pitch = Math.max(-Math.PI/2+0.01, Math.min(Math.PI/2-0.01, pitch));
    }
  });
  document.addEventListener('mousedown', () => { isFiring = true; tryShoot(); });
  document.addEventListener('mouseup',   () => { isFiring = false; });
}

// ---------- کنترل لمسی ----------
function setupJoystick(elemId, knobId, onChange, onEnd) {
  const el = document.getElementById(elemId);
  const knob = document.getElementById(knobId);
  if (!el) return;
  let active = false, id = null, cx = 0, cy = 0, maxR = 0;

  el.addEventListener('touchstart', e => {
    e.preventDefault();
    const t = e.changedTouches[0];
    id = t.identifier;
    const rect = el.getBoundingClientRect();
    cx = rect.left + rect.width/2;
    cy = rect.top + rect.height/2;
    maxR = rect.width/2;
    active = true;
    update(t.clientX, t.clientY);
  }, { passive:false });

  el.addEventListener('touchmove', e => {
    if (!active) return;
    for (const t of e.changedTouches) {
      if (t.identifier === id) { e.preventDefault(); update(t.clientX, t.clientY); }
    }
  }, { passive:false });

  const end = e => {
    for (const t of e.changedTouches) {
      if (t.identifier === id) {
        active = false; id = null;
        knob.style.transform = 'translate(-50%,-50%)';
        onChange(0, 0);
        if (onEnd) onEnd();
      }
    }
  };
  el.addEventListener('touchend', end);
  el.addEventListener('touchcancel', end);

  function update(x, y) {
    let dx = x - cx, dy = y - cy;
    const d = Math.hypot(dx, dy);
    if (d > maxR) { dx = dx / d * maxR; dy = dy / d * maxR; }
    knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
    onChange(dx / maxR, dy / maxR);
  }
}

if (isMobile) {
  // جوی‌استیک چپ = حرکت
  setupJoystick('joyLeft', 'knobLeft', (x, y) => {
    moveInput.x = x;
    moveInput.y = y;
  });

  // جوی‌استیک راست = نگاه (با حساسیت بالا)
  setupJoystick('joyRight', 'knobRight', (x, y) => {
    yaw   -= x * 0.06;
    pitch -= y * 0.06;
    pitch = Math.max(-Math.PI/2+0.01, Math.min(Math.PI/2-0.01, pitch));
  });

  // دکمه‌ها
  const fireBtn = document.getElementById('fireBtn');
  fireBtn.addEventListener('touchstart', e => {
    e.preventDefault(); initAudio();
    isFiring = true; tryShoot();
  }, { passive:false });
  fireBtn.addEventListener('touchend', e => {
    e.preventDefault();
    isFiring = false;
  }, { passive:false });

  document.getElementById('reloadBtn').addEventListener('touchstart', e => {
    e.preventDefault(); initAudio(); reload();
  });
  document.getElementById('switchBtn').addEventListener('touchstart', e => {
    e.preventDefault(); initAudio();
    const idx = weaponOrder.indexOf(currentWeapon);
    switchWeapon(weaponOrder[(idx + 1) % weaponOrder.length]);
  });

  // اولین لمس برای فعال‌سازی صدا
  document.addEventListener('touchstart', initAudio, { once:true });
}

// ---------- تیرکشی ----------
const tracers = [];
const tracerGeo = new THREE.BufferGeometry();
function spawnTracer(from, to) {
  const geo = new THREE.BufferGeometry().setFromPoints([from, to]);
  const mat = new THREE.LineBasicMaterial({ color:0xffff66, transparent:true, opacity:1 });
  const line = new THREE.Line(geo, mat);
  scene.add(line);
  tracers.push({ line, life: 0.12 });
}

// ---------- شلیک ----------
const raycaster = new THREE.Raycaster();
function tryShoot() {
  const w = weapons[currentWeapon];
  const now = performance.now();
  if (now - lastShotTime < w.fireRate) return;
  if (w.ammo <= 0) {
    emptySound();
    lastShotTime = now;
    return;
  }
  lastShotTime = now;
  w.ammo--;
  updateUI();
  shotSound();
  recoilKick = w.recoil;

  raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
  const hits = raycaster.intersectObjects(enemies, true);

  const from = new THREE.Vector3();
  camera.getWorldPosition(from);
  let to = from.clone().add(raycaster.ray.direction.clone().multiplyScalar(100));

  if (hits.length > 0) {
    const hit = hits[0];
    to = hit.point.clone();
    let obj = hit.object;
    while (obj.parent && !enemies.includes(obj)) obj = obj.parent;
    if (enemies.includes(obj) && obj.userData.alive) {
      obj.userData.hp -= w.damage;
      hitSound();
      if (obj.userData.hp <= 0) {
        obj.userData.alive = false;
        obj.rotation.x = Math.PI/2;
        obj.position.y = 0.3;
        enemyGroan();
        kills++;
        document.getElementById('kills').textContent = kills;
        setTimeout(() => {
          scene.remove(obj);
          const idx = enemies.indexOf(obj);
          if (idx >= 0) enemies.splice(idx, 1);
          spawnRandomEnemy();
        }, 3000);
      }
    }
  }
  spawnTracer(from, to);
}

// ---------- reload ----------
function reload() {
  const w = weapons[currentWeapon];
  if (w.reserve <= 0 || w.ammo === w.mag) return;
  const need = w.mag - w.ammo;
  const give = Math.min(need, w.reserve);
  w.ammo += give; w.reserve -= give;
  reloadSound();
  updateUI();
}

function switchWeapon(name) {
  if (!weapons[name] || name === currentWeapon) return;
  weapons[currentWeapon].obj.visible = false;
  currentWeapon = name;
  weapons[currentWeapon].obj.visible = true;
  updateUI();
}

function updateUI() {
  const w = weapons[currentWeapon];
  document.getElementById('weaponName').textContent = w.name;
  document.getElementById('ammo').textContent = w.ammo;
  document.getElementById('mag').textContent = w.mag;
  document.getElementById('hp').textContent = player.hp;
}
updateUI();

// ---------- حرکت بازیکن ----------
function updateMovement(dt) {
  const speed = 6;

  let forwardInput = 0, rightInput = 0;
  if (keys['KeyW']) forwardInput += 1;
  if (keys['KeyS']) forwardInput -= 1;
  if (keys['KeyA']) rightInput -= 1;
  if (keys['KeyD']) rightInput += 1;

  // جوی‌استیک چپ: y منفی = جلو
  forwardInput += -moveInput.y;
  rightInput   +=  moveInput.x;

  const forward = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
  const right   = new THREE.Vector3( Math.cos(yaw), 0, -Math.sin(yaw));
  const move = new THREE.Vector3()
    .addScaledVector(forward, forwardInput)
    .addScaledVector(right, rightInput);

  if (move.length() > 1) move.normalize();
  player.pos.addScaledVector(move, speed * dt);

  // پرش (فقط دسکتاپ)
  if (!isMobile) {
    if (keys['Space'] && player.onGround) {
      player.vel.y = 6; player.onGround = false;
    }
    player.vel.y -= 20 * dt;
    player.pos.y += player.vel.y * dt;
    if (player.pos.y <= 1.7) { player.pos.y = 1.7; player.vel.y = 0; player.onGround = true; }
  }

  cameraHolder.position.copy(player.pos);
  cameraHolder.rotation.y = yaw;
  camera.rotation.x = pitch + recoilKick * 2;
}

// ---------- دشمن‌ها ----------
function updateEnemies(dt, time) {
  enemies.forEach(e => {
    if (!e.userData.alive) return;
    const dx = player.pos.x - e.position.x;
    const dz = player.pos.z - e.position.z;
    const dist = Math.hypot(dx, dz);
    e.rotation.y = Math.atan2(dx, dz);

    // تعقیب آرام اگر دور باشد
    if (dist > 12) {
      const spd = 1.5 * dt;
      e.position.x += Math.sin(e.rotation.y) * spd;
      e.position.z += Math.cos(e.rotation.y) * spd;
      e.userData.walkPhase += dt * 8;
      e.position.y = Math.abs(Math.sin(e.userData.walkPhase)) * 0.08;
    } else if (dist < 6) {
      // کمی عقب
      const spd = 0.8 * dt;
      e.position.x -= Math.sin(e.rotation.y) * spd;
      e.position.z -= Math.cos(e.rotation.y) * spd;
    }
  });
}

// ---------- حلقه اصلی ----------
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // شلیک خودکار
  if (isFiring && weapons[currentWeapon].auto) {
    tryShoot();
  }

  updateMovement(dt);
  updateEnemies(dt, t);

  // recoil recovery
  recoilKick *= 0.85;
  weapons[currentWeapon].obj.position.z = -0.5 + recoilKick * 3;
  weapons[currentWeapon].obj.rotation.x = recoilKick * 2;

  // tracers fade
  for (let i = tracers.length - 1; i >= 0; i--) {
    tracers[i].life -= dt;
    tracers[i].line.material.opacity = Math.max(0, tracers[i].life / 0.12);
    if (tracers[i].life <= 0) {
      scene.remove(tracers[i].line);
      tracers[i].line.geometry.dispose();
      tracers[i].line.material.dispose();
      tracers.splice(i, 1);
    }
  }

  renderer.render(scene, camera);
}
animate();

// جلوگیری از اسکرول/زوم لمسی
document.addEventListener('touchmove', e => e.preventDefault(), { passive:false });
document.addEventListener('gesturestart', e => e.preventDefault());
</script>
</body>
