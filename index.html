<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>بازی تیراندازی</title>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; padding:0; overflow:hidden; background:#000; font-family:monospace; touch-action:none; user-select:none; }

  #rotateOverlay { position:fixed; inset:0; background:#0a0a15; color:#0f0; display:none; flex-direction:column; align-items:center; justify-content:center; z-index:9999; font-size:22px; text-align:center; padding:20px; }
  #rotateOverlay .icon { font-size:80px; margin-bottom:25px; animation:rot 2s infinite; }
  @keyframes rot { 0%,40%{transform:rotate(0)} 60%,100%{transform:rotate(-90deg)} }
  @media (orientation: portrait) and (max-width: 1100px) {
    #rotateOverlay { display:flex; }
    #mainMenu, #levelMenu, #gameContainer { display:none !important; }
  }

  #mainMenu, #levelMenu {
    position:fixed; inset:0; z-index:8000;
    background:linear-gradient(135deg, #0a0a15 0%, #1a1a3e 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:#0f0; overflow-y:auto; padding:20px;
  }
  #mainMenu.hide, #levelMenu.hide { display:none; }
  #mainMenu h1, #levelMenu h1 { font-size:42px; margin:0 0 10px 0; text-shadow:0 0 20px #0f0, 0 0 40px #0f0; letter-spacing:6px; }
  #mainMenu .subtitle, #levelMenu .subtitle { font-size:14px; opacity:0.7; margin-bottom:30px; }
  #startBtn {
    padding:16px 60px; font-size:22px; font-family:monospace; font-weight:bold;
    color:#0f0; background:transparent; border:3px solid #0f0; border-radius:10px;
    cursor:pointer; letter-spacing:4px; box-shadow:0 0 20px rgba(0,255,0,0.5); transition:all 0.15s;
  }
  #startBtn:active { background:#0f0; color:#000; box-shadow:0 0 40px #0f0; transform:scale(1.05); }

  #levelGrid { display:grid; grid-template-columns:repeat(3, 1fr); gap:15px; max-width:600px; width:100%; }
  .levelBtn {
    padding:20px; font-size:16px; font-family:monospace; font-weight:bold;
    color:#0f0; background:rgba(0,60,0,0.4); border:3px solid #0f0; border-radius:12px;
    cursor:pointer; transition:all 0.15s; text-align:center;
  }
  .levelBtn:active { transform:scale(0.95); }
  .levelBtn.locked { color:#666; border-color:#444; background:rgba(30,30,30,0.5); cursor:not-allowed; }
  .levelBtn.locked::after { content:'🔒'; display:block; font-size:24px; margin-top:5px; }
  .levelBtn .levelName { font-size:14px; opacity:0.8; display:block; margin-top:5px; }
  #backBtn {
    margin-top:20px; padding:10px 30px; font-size:16px; font-family:monospace;
    color:#f80; background:transparent; border:2px solid #f80; border-radius:8px;
    cursor:pointer;
  }

  #loading { position:fixed; inset:0; background:#0a0a15; color:#0f0; display:none; flex-direction:column; align-items:center; justify-content:center; z-index:9000; font-size:16px; }
  #loading.show { display:flex; }
  #loading .spinner { width:50px; height:50px; border:4px solid #0f044; border-top-color:#0f0; border-radius:50%; animation:spin 1s linear infinite; margin-bottom:20px; }
  @keyframes spin { to { transform:rotate(360deg); } }

  #gameContainer { position:fixed; inset:0; display:none; }
  #gameContainer.show { display:block; }

  #crosshair { position:fixed; top:50%; left:50%; width:30px; height:30px; transform:translate(-50%,-50%); z-index:10; pointer-events:none; }
  #crosshair .dot { position:absolute; top:50%; left:50%; width:6px; height:6px; background:#0f0; border-radius:50%; transform:translate(-50%,-50%); box-shadow:0 0 6px #0f0; }
  #crosshair .ring { position:absolute; inset:0; border:2px solid rgba(0,255,0,0.5); border-radius:50%; }
  #crosshair.locked .dot { background:#f00; box-shadow:0 0 10px #f00; width:10px; height:10px; }
  #crosshair.locked .ring { border-color:#f00; border-width:3px; animation:pulseLock 0.5s infinite; }
  @keyframes pulseLock { 0%,100%{transform:scale(1)} 50%{transform:scale(0.85)} }
  #lockTimer { position:fixed; top:52%; left:50%; transform:translate(-50%,0); color:#f80; font-size:14px; z-index:11; pointer-events:none; text-shadow:0 0 5px #000; display:none; }
  #lockTimer.show { display:block; }

  .hud { position:fixed; color:#0f0; font-size:16px; z-index:10; text-shadow:0 0 5px #000; pointer-events:none; }
  #hud { top:15px; left:15px; font-size:18px; line-height:1.4; }
  #weaponUI { top:15px; right:170px; text-align:right; line-height:1.5; font-size:14px; }
  #levelHud { top:100px; left:15px; font-size:14px; color:#fc0; }
  #radar { position:fixed; top:15px; right:15px; width:140px; height:140px; border-radius:50%; background:rgba(0,20,0,0.8); border:2px solid #0f0; z-index:10; pointer-events:none; box-shadow:0 0 15px rgba(0,255,0,0.5); }
  #radarCanvas { width:100%; height:100%; border-radius:50%; }
  #mobileControls { position:fixed; inset:0; z-index:20; pointer-events:none; }
  #lookArea { position:absolute; inset:0; pointer-events:auto; z-index:1; }
  #joyLeft { position:absolute; bottom:20px; left:20px; width:140px; height:140px; border-radius:50%; background:rgba(0,255,0,0.08); border:2px solid rgba(0,255,0,0.4); pointer-events:auto; touch-action:none; z-index:5; }
  .joyKnob { position:absolute; top:50%; left:50%; width:60px; height:60px; border-radius:50%; background:rgba(0,255,0,0.35); border:2px solid #0f0; transform:translate(-50%,-50%); box-shadow:0 0 12px rgba(0,255,0,0.7); }

  #fireBtn {
    position:absolute; right:20px; bottom:20px; width:110px; height:110px;
    border-radius:50%; pointer-events:auto;
    background:radial-gradient(circle at 30% 30%, #ffdd44 0%, #cc8800 50%, #664400 100%);
    border:3px solid #ffcc00;
    display:flex; align-items:center; justify-content:center;
    z-index:5; box-shadow:0 0 20px rgba(255,200,0,0.6), inset 0 -5px 10px rgba(0,0,0,0.5);
    transition:transform 0.06s, box-shadow 0.06s, filter 0.06s;
  }
  #fireBtn.pressed { transform:scale(0.88); filter:brightness(1.4); box-shadow:0 0 30px rgba(255,255,0,1), inset 0 5px 15px rgba(0,0,0,0.7); }
  #fireBtn svg { width:60%; height:60%; }

  #zoomBtn,#reloadBtn,#grenadeBtn {
    position:absolute; border-radius:50%; pointer-events:auto;
    color:#fff; font-size:12px; font-weight:bold;
    display:flex; align-items:center; justify-content:center;
    border:2px solid; z-index:5; transition:transform 0.06s, filter 0.06s;
  }
  #zoomBtn { right:140px; bottom:20px; width:70px; height:70px; background:rgba(120,60,255,0.4); border-color:#84f; }
  #reloadBtn { right:20px; bottom:140px; width:70px; height:70px; background:rgba(60,120,255,0.4); border-color:#48f; }
  #grenadeBtn { right:140px; bottom:100px; width:70px; height:70px; background:rgba(80,255,80,0.3); border-color:#4f4; font-size:26px; }
  #zoomBtn:active, #reloadBtn:active, #grenadeBtn:active { transform:scale(0.85); filter:brightness(1.4); }

  #weaponButtons { position:absolute; left:180px; bottom:20px; display:flex; flex-direction:row; gap:8px; pointer-events:auto; z-index:5; }
  .wbtn {
    width:52px; height:80px; border-radius:10px;
    background:rgba(255,200,60,0.3); border:2px solid #fc0;
    color:#fff; font-weight:bold;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    cursor:pointer; text-align:center;
    transition:transform 0.06s; padding:6px 2px;
  }
  .wbtn.active { background:rgba(255,200,60,0.85); box-shadow:0 0 15px #fc0; }
  .wbtn:active { transform:scale(0.9); }
  .wbtn .wname {
    font-size:11px;
    writing-mode: vertical-rl;
    text-orientation: upright;
    letter-spacing:1px;
    direction:rtl;
    max-height:68px;
    overflow:hidden;
  }

  #hurtFlash { position:fixed; inset:0; pointer-events:none; z-index:30; background:radial-gradient(ellipse at center, rgba(255,0,0,0) 30%, rgba(255,0,0,0.7) 100%); opacity:0; transition:opacity 0.15s; }
  #hurtFlash.on { opacity:1; }

  #levelComplete {
    position:fixed; inset:0; z-index:8500; background:rgba(0,0,0,0.85);
    display:none; flex-direction:column; align-items:center; justify-content:center;
    color:#0f0; font-family:monospace;
  }
  #levelComplete.show { display:flex; }
  #levelComplete h2 { font-size:40px; color:#0f0; text-shadow:0 0 20px #0f0; margin:0 0 20px 0; }
  #levelComplete button {
    padding:14px 50px; font-size:20px; font-family:monospace; font-weight:bold;
    color:#0f0; background:transparent; border:3px solid #0f0; border-radius:10px;
    cursor:pointer; margin:10px;
  }
  #gameOver {
    position:fixed; inset:0; z-index:8500; background:rgba(0,0,0,0.9);
    display:none; flex-direction:column; align-items:center; justify-content:center;
    color:#f44; font-family:monospace;
  }
  #gameOver.show { display:flex; }
  #gameOver h2 { font-size:44px; color:#f44; text-shadow:0 0 20px #f00; margin:0 0 20px 0; }
  #gameOver button {
    padding:14px 50px; font-size:20px; font-family:monospace; font-weight:bold;
    color:#f44; background:transparent; border:3px solid #f44; border-radius:10px;
    cursor:pointer; margin:10px;
  }
</style>
</head>
<body>

<div id="rotateOverlay">
  <div class="icon">📱</div>
  <div>گوشی را <b>افقی</b> بگیرید</div>
</div>

<div id="mainMenu">
  <h1>FPS</h1>
  <div class="subtitle">بازی تیراندازی سه‌بعدی</div>
  <button id="startBtn">شروع بازی</button>
</div>

<div id="levelMenu" class="hide">
  <h1>مرحله‌ها</h1>
  <div class="subtitle">یک مرحله را انتخاب کنید</div>
  <div id="levelGrid"></div>
  <button id="backBtn">بازگشت</button>
</div>

<div id="loading"><div class="spinner"></div><div>در حال بارگذاری...</div></div>

<div id="gameContainer">
  <div id="crosshair"><div class="ring"></div><div class="dot"></div></div>
  <div id="lockTimer">در حال قفل...</div>
  <div class="hud" id="hud"><div>جان: <span id="hp">20</span></div><div>کشته: <span id="kills">0</span></div></div>
  <div class="hud" id="levelHud">مرحله: <span id="levelNum">1</span> | دشمن: <span id="enemiesLeft">0</span></div>
  <div class="hud" id="weaponUI"><div id="weaponName">کلاشنیکوف</div><div>خشاب: <span id="ammo">30</span>/<span id="mag">30</span></div><div>ذخیره: <span id="reserve">90</span></div></div>
  <div id="radar"><canvas id="radarCanvas" width="260" height="260"></canvas></div>
  <div id="hurtFlash"></div>
  <div id="mobileControls">
    <div id="lookArea"></div>
    <div id="joyLeft"><div class="joyKnob" id="knobLeft"></div></div>
    <button id="fireBtn">
      <svg viewBox="0 0 100 100">
        <ellipse cx="50" cy="50" rx="12" ry="35" fill="#fff" opacity="0.9"/>
        <path d="M38 50 Q50 20 62 50 L62 75 Q50 88 38 75 Z" fill="#ffddaa" opacity="0.6"/>
      </svg>
    </button>
    <button id="zoomBtn">🎯</button>
    <button id="reloadBtn">R</button>
    <button id="grenadeBtn">💣</button>
    <div id="weaponButtons"></div>
  </div>
</div>

<div id="levelComplete">
  <h2>مرحله تمام شد!</h2>
  <div style="font-size:18px;margin-bottom:20px;">مرحله <span id="completedLevel">1</span> با موفقیت گذشت</div>
  <button id="nextLevelBtn">مرحله بعدی</button>
  <button id="backToMenuBtn">بازگشت به منو</button>
</div>

<div id="gameOver">
  <h2>باختی!</h2>
  <div style="font-size:18px;margin-bottom:20px;color:#fff;">دوباره تلاش کن</div>
  <button id="retryBtn">تلاش دوباره</button>
  <button id="backToMenu2Btn">بازگشت به منو</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const LEVELS = [
  { num:1, name:'دشت', enemies:5,  gunners:0, rocks:0,  trees:15, terrain:0.3, bunkers:4 },
  { num:2, name:'جنگل', enemies:8,  gunners:2, rocks:5,  trees:25, terrain:0.5, bunkers:6 },
  { num:3, name:'کوهستان', enemies:12, gunners:4, rocks:15, trees:15, terrain:1.0, bunkers:8 },
  { num:4, name:'دشت جنگلی', enemies:16, gunners:7, rocks:8, trees:20, terrain:0.7, bunkers:10 },
  { num:5, name:'میدان جنگ', enemies:20, gunners:10, rocks:12, trees:12, terrain:0.8, bunkers:12 }
];
const LEVEL_STORAGE_KEY = 'fps_unlocked_level';
function getUnlockedLevel() { return parseInt(localStorage.getItem(LEVEL_STORAGE_KEY) || '1'); }
function unlockLevel(n) { if (n > getUnlockedLevel()) localStorage.setItem(LEVEL_STORAGE_KEY, n.toString()); }

function buildLevelMenu() {
  const grid = document.getElementById('levelGrid');
  grid.innerHTML = '';
  const unlocked = getUnlockedLevel();
  LEVELS.forEach(lv => {
    const btn = document.createElement('div');
    btn.className = 'levelBtn' + (lv.num > unlocked ? ' locked' : '');
    btn.innerHTML = `مرحله ${lv.num}<span class="levelName">${lv.name}</span>`;
    if (lv.num <= unlocked) btn.addEventListener('click', () => startLevel(lv.num));
    grid.appendChild(btn);
  });
}
buildLevelMenu();

document.getElementById('startBtn').addEventListener('click', () => {
  document.getElementById('mainMenu').classList.add('hide');
  document.getElementById('levelMenu').classList.remove('hide');
  buildLevelMenu();
});
document.getElementById('backBtn').addEventListener('click', () => {
  document.getElementById('levelMenu').classList.add('hide');
  document.getElementById('mainMenu').classList.remove('hide');
});
document.getElementById('nextLevelBtn').addEventListener('click', () => {
  document.getElementById('levelComplete').classList.remove('show');
  startLevel(Math.min(5, currentLevel + 1));
});
document.getElementById('backToMenuBtn').addEventListener('click', () => {
  document.getElementById('levelComplete').classList.remove('show');
  document.getElementById('levelMenu').classList.remove('hide');
  buildLevelMenu();
});
document.getElementById('retryBtn').addEventListener('click', () => {
  document.getElementById('gameOver').classList.remove('show');
  startLevel(currentLevel);
});
document.getElementById('backToMenu2Btn').addEventListener('click', () => {
  document.getElementById('gameOver').classList.remove('show');
  document.getElementById('levelMenu').classList.remove('hide');
  buildLevelMenu();
});

let currentLevel = 1;
let gameState = null;

function startLevel(levelNum) {
  currentLevel = levelNum;
  document.getElementById('levelMenu').classList.add('hide');
  document.getElementById('loading').classList.add('show');
  if (gameState) { gameState.dispose(); gameState = null; }
  if (typeof THREE === 'undefined') {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js';
    s.onload = () => initGame(levelNum);
    s.onerror = () => { document.getElementById('loading').innerHTML = '<div style="color:#f44;padding:20px;text-align:center">خطا در بارگذاری Three.js</div>'; };
    document.head.appendChild(s);
  } else {
    initGame(levelNum);
  }
}

function initGame(levelNum) {
  document.getElementById('loading').classList.remove('show');
  document.getElementById('gameContainer').classList.add('show');

  const levelCfg = LEVELS[levelNum - 1];
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87ceeb);
  scene.fog = new THREE.Fog(0x87ceeb, 40, 160);

  const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 500);
  const BASE_FOV = 75, ZOOM_FOV = 45;
  const renderer = new THREE.WebGLRenderer({ antialias:true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  document.getElementById('gameContainer').appendChild(renderer.domElement);

  const onResize = () => {
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  };
  addEventListener('resize', onResize);

  scene.add(new THREE.AmbientLight(0xffffff, 0.7));
  const sun = new THREE.DirectionalLight(0xffffff, 0.9);
  sun.position.set(50, 80, 30);
  scene.add(sun);

  const MAP_SIZE = 60;
  const WALL_HEIGHT = 8;

  // ===== زمین ناهموار =====
  const terrainSeg = 60;
  const groundGeo = new THREE.PlaneGeometry(MAP_SIZE*2, MAP_SIZE*2, terrainSeg, terrainSeg);
  const pos = groundGeo.attributes.position;
  const terrainHeight = levelCfg.terrain;
  for (let i=0; i<pos.count; i++) {
    const x = pos.getX(i);
    const y = pos.getY(i);
    const h = Math.sin(x*0.15)*Math.cos(y*0.15)*terrainHeight
            + Math.sin(x*0.05+y*0.08)*terrainHeight*0.8
            + (Math.random()-0.5)*terrainHeight*0.2;
    pos.setZ(i, h);
  }
  groundGeo.computeVertexNormals();
  const groundMat = new THREE.MeshStandardMaterial({ color:0x4a7a3a, roughness:1 });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI/2;
  scene.add(ground);

  function getTerrainY(x, z) {
    return Math.sin(x*0.15)*Math.cos(z*0.15)*terrainHeight
         + Math.sin(x*0.05+z*0.08)*terrainHeight*0.8;
  }

  // ===== دیوار دور نقشه =====
  const wallGroup = new THREE.Group();
  const wallMat = new THREE.MeshStandardMaterial({ color:0x6a6a7a, roughness:0.85 });
  const wallCapMat = new THREE.MeshStandardMaterial({ color:0x4a4a5a, roughness:0.9 });
  const WALL_THICK = 1.5;

  function makeWallPiece(x, z, w, d) {
    const wall = new THREE.Mesh(new THREE.BoxGeometry(w, WALL_HEIGHT, d), wallMat);
    wall.position.set(x, WALL_HEIGHT/2 - 1, z);
    wall.castShadow = false; wall.receiveShadow = false;
    wallGroup.add(wall);
    const cap = new THREE.Mesh(new THREE.BoxGeometry(w + 0.3, 0.4, d + 0.3), wallCapMat);
    cap.position.set(x, WALL_HEIGHT - 1, z);
    wallGroup.add(cap);
  }

  const wallSegments = 20;
  const segLength = (MAP_SIZE*2) / wallSegments;
  for (let i=0; i<wallSegments; i++) {
    const offset = -MAP_SIZE + segLength * i + segLength/2;
    makeWallPiece(offset, -MAP_SIZE - WALL_THICK/2, segLength, WALL_THICK);
    makeWallPiece(offset, MAP_SIZE + WALL_THICK/2, segLength, WALL_THICK);
    makeWallPiece(-MAP_SIZE - WALL_THICK/2, offset, WALL_THICK, segLength);
    makeWallPiece(MAP_SIZE + WALL_THICK/2, offset, WALL_THICK, segLength);
  }
  scene.add(wallGroup);

  // ===== درخت‌ها =====
  const treeGroup = new THREE.Group();
  function createTree(x, z) {
    const y = getTerrainY(x, z);
    const trunk = new THREE.Mesh(
      new THREE.CylinderGeometry(0.2, 0.3, 2.5, 8),
      new THREE.MeshStandardMaterial({ color:0x5a3a1a, roughness:0.9 })
    );
    trunk.position.set(x, y + 1.25, z);
    treeGroup.add(trunk);
    const leaves = new THREE.Mesh(
      new THREE.SphereGeometry(1.3, 8, 8),
      new THREE.MeshStandardMaterial({ color:0x2a6a2a, roughness:0.9 })
    );
    leaves.position.set(x, y + 3.2, z);
    treeGroup.add(leaves);
  }
  for (let i=0; i<levelCfg.trees; i++) {
    const x = (Math.random()-0.5)*(MAP_SIZE*1.4);
    const z = (Math.random()-0.5)*(MAP_SIZE*1.4);
    if (Math.abs(x) < 5 && Math.abs(z) < 5) continue;
    createTree(x, z);
  }
  scene.add(treeGroup);

  // ===== سنگ‌های بزرگ =====
  const rockGroup = new THREE.Group();
  function createRock(x, z, size) {
    const y = getTerrainY(x, z);
    const rock = new THREE.Mesh(
      new THREE.DodecahedronGeometry(size, 0),
      new THREE.MeshStandardMaterial({ color:0x707070, roughness:1 })
    );
    rock.position.set(x, y + size*0.6, z);
    rock.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, Math.random()*Math.PI);
    rockGroup.add(rock);
  }
  for (let i=0; i<levelCfg.rocks; i++) {
    const x = (Math.random()-0.5)*(MAP_SIZE*1.3);
    const z = (Math.random()-0.5)*(MAP_SIZE*1.3);
    if (Math.abs(x) < 6 && Math.abs(z) < 6) continue;
    createRock(x, z, 1.5 + Math.random()*2);
  }
  scene.add(rockGroup);

  // ===== سنگرها =====
  const bunkerGroup = new THREE.Group();
  function createBunker(x, z, w, h, d) {
    const y = getTerrainY(x, z);
    const mat = new THREE.MeshStandardMaterial({ color:0x7a7a6a, roughness:0.95 });
    const bunker = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
    bunker.position.set(x, y + h/2, z);
    bunker.rotation.y = Math.random() * Math.PI;
    bunkerGroup.add(bunker);
    // لبه‌ی بالای سنگر (رنگ متفاوت)
    const topMat = new THREE.MeshStandardMaterial({ color:0x5a5a4a, roughness:0.9 });
    const top = new THREE.Mesh(new THREE.BoxGeometry(w + 0.2, 0.15, d + 0.2), topMat);
    top.position.set(x, y + h + 0.075, z);
    top.rotation.y = bunker.rotation.y;
    bunkerGroup.add(top);
  }
  for (let i=0; i<levelCfg.bunkers; i++) {
    const x = (Math.random()-0.5)*(MAP_SIZE*1.2);
    const z = (Math.random()-0.5)*(MAP_SIZE*1.2);
    if (Math.abs(x) < 8 && Math.abs(z) < 8) continue;
    createBunker(x, z, 3.5 + Math.random()*2, 1.4, 2 + Math.random());
  }
  scene.add(bunkerGroup);

  // ===== ماشین‌های نظامی =====

  }
  function playSnd(freq, dur, type, vol) {
    if (!audioCtx || audioCtx.state !== 'running') return;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type || 'square'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol||0.15, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  }

  (function setupJoystick() {
    const el = document.getElementById('joyLeft');
    const knob = document.getElementById('knobLeft');
    let active = false, id = null, cx = 0, cy = 0, maxR = 0;
    const start = e => {
      e.preventDefault(); e.stopPropagation();
      const t = e.changedTouches[0];
      id = t.identifier;
      const r = el.getBoundingClientRect();
      cx = r.left+r.width/2; cy = r.top+r.height/2; maxR = r.width/2;
      active = true; upd(t.clientX, t.clientY);
    };
    const move = e => {
      if (!active) return;
      for (const t of e.changedTouches) {
        if (t.identifier === id) { e.preventDefault(); e.stopPropagation(); upd(t.clientX, t.clientY); }
      }
    };
    const end = e => {
      for (const t of e.changedTouches) {
        if (t.identifier === id) { active = false; id = null; knob.style.transform = 'translate(-50%,-50%)'; moveInput.x = 0; moveInput.y = 0; }
      }
    };
    el.addEventListener('touchstart', start, { passive:false });
    el.addEventListener('touchmove', move, { passive:false });
    el.addEventListener('touchend', end);
    el.addEventListener('touchcancel', end);
    function upd(x, y) {
      let dx = x-cx, dy = y-cy;
      const d = Math.hypot(dx, dy);
      if (d > maxR) { dx = dx/d*maxR; dy = dy/d*maxR; }
      knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
      moveInput.x = dx/maxR;
      moveInput.y = dy/maxR;
    }
  })();

      e.preventDefault(); initAudio();

      id = t.identifier; lastX = t.clientX; lastY = t.clientY;
      startX = t.clientX; startY = t.clientY; moved = false;
    }, { passive:false });
    el.addEventListener('touchmove', e => {
      if (id === null) return;
      for (const t of e.changedTouches) {
        if (t.identifier === id) {
          e.preventDefault();
          const dx = t.clientX - lastX, dy = t.clientY - lastY;
          const sens = isZooming ? 0.002 : 0.004;
          yaw -= dx * sens; pitch -= dy * sens;
          pitch = Math.max(-Math.PI/2+0.01, Math.min(Math.PI/2-0.01, pitch));
          lastX = t.clientX; lastY = t.clientY;
          if (Math.hypot(t.clientX - startX, t.clientY - startY) > 20) {
            if (!moved) { lockedEnemy = null; moved = true; }
          }
        }
      }
    }, { passive:false });
    const end = e => {
      for (const t of e.changedTouches) { if (t.identifier === id) id = null; }

  function tryShoot() {
    if (reloadState) return;
    const w = weapons[currentWeapon];
    const now = performance.now();
    if (now - lastShot < w.fireRate) return;
    if (w.ammo <= 0) { emptySnd(); lastShot = now; return; }
    lastShot = now; w.ammo--; updateUI();

    if (w.isRPG) {
      rpgSnd();
      const camPos = new THREE.Vector3();
      camera.getWorldPosition(camPos);
      const dir = new THREE.Vector3();
      camera.getWorldDirection(dir);
      const rocket = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.5, 8), new THREE.MeshStandardMaterial({ color:0xaa3333, metalness:0.7 }));
      rocket.position.copy(camPos).addScaledVector(dir, 1.5);
      rocket.lookAt(camPos.clone().addScaledVector(dir, 10));
      rocket.rotateX(Math.PI/2);
      scene.add(rocket);
      rockets.push({ mesh: rocket, vel: dir.clone().multiplyScalar(30), life: 5, damage: w.damage });
      if (w.obj.userData.mag) w.obj.userData.mag.visible = false;
    } else {
      if (currentWeapon === 'shotgun') shotgunSnd(); else shotSnd();
    }
    recoilKick = w.recoil;

    const ud = w.obj.userData;
    if (ud.flash) { ud.flash.intensity = 3; setTimeout(()=>ud.flash.intensity = 0, 60); }
    if (ud.flashMesh) { ud.flashMesh.visible = true; ud.flashMesh.rotation.z = Math.random()*Math.PI; setTimeout(()=>ud.flashMesh.visible = false, 50); }
    if (ud.slide) { ud.slide.position.z = ud.slideZBase + 0.08; setTimeout(()=>{ if (ud.slide) ud.slide.position.z = ud.slideZBase; }, 60); }

    if (!w.isRPG) {
      const q = camera.getWorldQuaternion(new THREE.Quaternion());
      const rightDir = new THREE.Vector3(1,0,0).applyQuaternion(q);
      const upDir = new THREE.Vector3(0,1,0).applyQuaternion(q);
      const camPos = new THREE.Vector3();
      camera.getWorldPosition(camPos);
      const shellPos = camPos.clone().addScaledVector(rightDir, 0.35).addScaledVector(upDir, -0.15);
      spawnShell(shellPos, rightDir, upDir);

      for (let p=0; p<w.pellets; p++) {
        const spreadX = (Math.random()-0.5) * w.spread * (p===0 && w.pellets===1 ? 0 : 1);
        const spreadY = (Math.random()-0.5) * w.spread * (p===0 && w.pellets===1 ? 0 : 1);
        raycaster.setFromCamera(new THREE.Vector2(spreadX, spreadY), camera);
        const targets = [...enemies, ...allies, ground, treeGroup, rockGroup, carGroup, bunkerGroup, wallGroup];
        const hits = raycaster.intersectObjects(targets, true);
        const from = camPos.clone();
        let to = from.clone().add(raycaster.ray.direction.clone().multiplyScalar(100));
        if (hits.length > 0) {
          const hit = hits[0];
          to = hit.point.clone();
          if (p === 0 || w.pellets > 1) spawnSpark(hit.point);
          let cur = hit.object;
          let isEnemy = false, isAlly = false;
          while (cur) {
            if (enemies.includes(cur)) { isEnemy = true; break; }
            if (allies.includes(cur)) { isAlly = true; break; }
            cur = cur.parent;
          }
          if (isEnemy && cur.userData.alive) {
            damageEnemy(cur, w.damage);
            if (p === 0) hitSnd();
          } else if (isAlly && cur.userData.alive) {
            cur.userData.hp -= w.damage * 0.5;
            cur.userData.hurtTime = 0.15;
            if (cur.userData.healthBar) {
              const r = Math.max(0, cur.userData.hp / cur.userData.maxHp);
              cur.userData.healthBar.scale.x = r;
              cur.userData.healthBar.position.x = -(1-r)*0.425;
            }
            if (cur.userData.hp <= 0) { cur.userData.alive = false; cur.rotation.x = Math.PI/2; }
          } else if (p === 0) {
            let n = new THREE.Vector3(0,1,0);
            if (hit.face) n = hit.face.normal.clone().transformDirection(hit.object.matrixWorld);
            spawnDecal(hit.point, n);
          }
        }
        if (p === 0 || w.pellets <= 4) spawnTracer(from, to);
      }
    }
  }

  function reload() {
    if (reloadState) return;
    const w = weapons[currentWeapon];
    if (w.reserve <= 0 || w.ammo === w.mag) return;
    reloadState = { startTime: performance.now(), duration: w.reloadTime*1000, weapon: currentWeapon };
    const ud = w.obj.userData;
    if (w.isRPG) {
      setTimeout(() => { if (ud.mag) { magOutSnd(); ud.mag.visible = false; } }, 800);
      setTimeout(() => { if (ud.mag) { magInSnd(); ud.mag.visible = true; ud.mag.position.z = ud.magYBase; } }, w.reloadTime*1000 - 700);
    } else {
      setTimeout(() => {
        if (!ud.mag) return;
        magOutSnd();
        const magWorld = new THREE.Vector3();
        ud.mag.getWorldPosition(magWorld);
        const fallingMag = new THREE.Mesh(new THREE.BoxGeometry(0.06,0.22,0.08), new THREE.MeshStandardMaterial({ color:0x222222, metalness:0.6 }));
        fallingMag.position.copy(magWorld);
        scene.add(fallingMag);
        fallingMag.userData = { vel: new THREE.Vector3(0,-2,0), life: 3 };
        shells.push(fallingMag);
        ud.mag.visible = false;
      }, 500);
      setTimeout(() => { if (!ud.mag) return; ud.mag.visible = true; magInSnd(); }, w.reloadTime*1000 - 600);
    }
    setTimeout(() => {
      const need = w.mag - w.ammo;
      const give = Math.min(need, w.reserve);
      w.ammo += give; w.reserve -= give;
      updateUI();
      hand.visible = false;
      reloadState = null;
    }, w.reloadTime*1000);
  }

  function switchWeapon(name) {
    if (!weapons[name] || name === currentWeapon || reloadState) return;
    weapons[currentWeapon].obj.visible = false;
    currentWeapon = name;
    weapons[currentWeapon].obj.visible = true;
    updateUI(); updateSwitchUI();
  }

  function updateUI() {
    const w = weapons[currentWeapon];
    document.getElementById('weaponName').textContent = w.name;
    document.getElementById('ammo').textContent = w.ammo;
    document.getElementById('mag').textContent = w.mag;
    document.getElementById('reserve').textContent = w.reserve;
    document.getElementById('hp').textContent = player.hp;
  }
  function updateEnemiesLeft() {
    const left = enemies.filter(e => e.userData.alive && !e.userData.dying).length;
    document.getElementById('enemiesLeft').textContent = left;
    document.getElementById('levelNum').textContent = levelNum;
    if (left === 0 && !gameWon) { gameWon = true; winTimer = 1.5; }
  }
  updateUI(); updateEnemiesLeft();

  function updateMovement(dt) {
    const speed = isZooming ? 3 : 6;
    let fi = 0, ri = 0;
    if (keys['KeyW']) fi += 1;
    if (keys['KeyS']) fi -= 1;
    if (keys['KeyA']) ri -= 1;
    if (keys['KeyD']) ri += 1;
    fi += -moveInput.y;
    ri += moveInput.x;
    const forward = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
    const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
    const move = new THREE.Vector3().addScaledVector(forward, fi).addScaledVector(right, ri);
    if (move.length() > 1) move.normalize();
    player.pos.x += move.x * speed * dt;
    player.pos.z += move.z * speed * dt;

    // محدودیت دیوار
    const limit = MAP_SIZE - 1.5;
    if (player.pos.x > limit) player.pos.x = limit;
    if (player.pos.x < -limit) player.pos.x = -limit;
    if (player.pos.z > limit) player.pos.z = limit;
    if (player.pos.z < -limit) player.pos.z = -limit;

    const terrainY = getTerrainY(player.pos.x, player.pos.z);
    const groundLevel = terrainY + 1.7;

    if (keys['Space'] && player.onGround) { player.vel.y = 6; player.onGround = false; }
    player.vel.y -= 20 * dt;
    player.pos.y += player.vel.y * dt;
    if (player.pos.y <= groundLevel) { player.pos.y = groundLevel; player.vel.y = 0; player.onGround = true; }
    else player.onGround = false;

    cameraHolder.position.copy(player.pos);
    cameraHolder.rotation.y = yaw;
    camera.rotation.x = pitch + recoilKick * 2;

    const targetFov = isZooming ? ZOOM_FOV : BASE_FOV;
    camera.fov += (targetFov - camera.fov) * 0.2;
    camera.updateProjectionMatrix();
  }

  function updateLock(dt) {
    raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
    const hits = raycaster.intersectObjects(enemies, true);
    let hitEnemy = null;
    if (hits.length > 0) {
      let obj = hits[0].object;
      while (obj.parent && !enemies.includes(obj)) obj = obj.parent;
      if (enemies.includes(obj) && obj.userData.alive && !obj.userData.dying) hitEnemy = obj;
    }
    if (lockedEnemy) {
      if (!lockedEnemy.userData.alive || lockedEnemy.userData.dying) { lockedEnemy = null; lockProgress = 0; }
      else {
        const targetPos = lockedEnemy.position.clone();
        targetPos.y += 1.5;
        const camPos = cameraHolder.position.clone();
        const dir = targetPos.clone().sub(camPos).normalize();
        const targetYaw = Math.atan2(-dir.x, -dir.z);
        const targetPitch = Math.asin(dir.y);
        yaw += (targetYaw - yaw) * 0.3;
        pitch += (targetPitch - pitch) * 0.3;
      }
      return;
    }
    if (hitEnemy && hitEnemy === lockTarget) {
      lockProgress += dt;
      if (lockProgress >= LOCK_TIME) { lockedEnemy = hitEnemy; lockDoneSnd(); lockProgress = 0; }
    } else { lockTarget = hitEnemy; lockProgress = 0; }
    const ch = document.getElementById('crosshair');
    const lt = document.getElementById('lockTimer');
    if (lockedEnemy) { ch.classList.add('locked'); lt.classList.remove('show'); }
    else if (lockTarget && lockProgress > 0.05) {
      ch.classList.remove('locked'); lt.classList.add('show');
      lt.textContent = 'قفل: ' + Math.min(100, Math.round(lockProgress/LOCK_TIME*100)) + '%';
    } else { ch.classList.remove('locked'); lt.classList.remove('show'); }
  }

  function updateEnemies(dt) {
    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      const ud = e.userData;
      if (ud.dying) {
        ud.deathTime += dt;
        e.rotation.x = Math.min(Math.PI/2, ud.deathTime * 4);
        e.position.y -= dt * 0.8;
        if (ud.deathTime > 2.5) { scene.remove(e); enemies.splice(i, 1); updateEnemiesLeft(); }
        continue;
      }
      if (!ud.alive) continue;
      const dx = player.pos.x - e.position.x;
      const dz = player.pos.z - e.position.z;
      const dist = Math.hypot(dx, dz);

      if (!ud.hasGun) {
        e.rotation.y = Math.atan2(dx, dz);
        if (dist > 8) { const spd = 2.0 * dt; e.position.x += Math.sin(e.rotation.y) * spd; e.position.z += Math.cos(e.rotation.y) * spd; }
        else if (dist < 5) { const spd = 1.2 * dt; e.position.x -= Math.sin(e.rotation.y) * spd; e.position.z -= Math.cos(e.rotation.y) * spd; }
        e.position.y = getTerrainY(e.position.x, e.position.z);
      } else {
        e.rotation.y = Math.atan2(dx, dz);
        if (dist > 22) { const spd = 1.5 * dt; e.position.x += Math.sin(e.rotation.y) * spd; e.position.z += Math.cos(e.rotation.y) * spd; }
        else if (dist < 12) { const spd = 1.5 * dt; e.position.x -= Math.sin(e.rotation.y) * spd; e.position.z -= Math.cos(e.rotation.y) * spd; }
        e.position.y = getTerrainY(e.position.x, e.position.z);
        ud.lastShot += dt * 1000;
        if (ud.lastShot > ud.shootInterval && dist < 30) {
          ud.lastShot = 0;
          enemyShotSnd();
          if (Math.random() < 0.4) {
            player.hp = Math.max(0, player.hp - 1);
            updateUI(); hurtSnd(); flashRed();
            const eFrom = new THREE.Vector3(e.position.x, e.position.y + 1.5, e.position.z);
            spawnTracer(eFrom, player.pos.clone());
            if (player.hp <= 0) gameOver();
          }
        }
      }
      ud.walkPhase += dt * 9;
      const swing = Math.sin(ud.walkPhase) * 0.5;
      if (ud.legL) {
        ud.legL.rotation.x = swing; ud.legR.rotation.x = -swing;
        ud.bootL.rotation.x = swing; ud.bootR.rotation.x = -swing;
        ud.bootL.position.z = 0.05 + swing * 0.2; ud.bootR.position.z = 0.05 - swing * 0.2;
        ud.armL.rotation.x = -swing * 0.7; ud.armR.rotation.x = swing * 0.7;
        ud.body.position.y = 1.25 + Math.abs(Math.sin(ud.walkPhase)) * 0.03;
      }
      if (ud.hurtTime > 0) { ud.hurtTime -= dt; if (ud.body) ud.body.material.emissive = new THREE.Color(0x660000); }
      else { if (ud.body) ud.body.material.emissive = new THREE.Color(0x000000); }
      // به‌روزرسانی نوار سلامتی همیشه به سمت دوربین
      if (ud.healthBarGroup) ud.healthBarGroup.lookAt(camera.position);
    }
  }

  function updateAllies(dt) {
    for (const a of allies) {
      if (!a.userData.alive) continue;
      const ud = a.userData;
      let nearest = null, nearestDist = 999;
      for (const e of enemies) {
        if (!e.userData.alive || e.userData.dying) continue;
        const d = a.position.distanceTo(e.position);
        if (d < nearestDist) { nearestDist = d; nearest = e; }
      }
      const pd = a.position.distanceTo(player.pos);
      if (pd > 6) {
        const dir = player.pos.clone().sub(a.position).normalize();
        a.position.x += dir.x * 3 * dt; a.position.z += dir.z * 3 * dt;
        a.position.y = getTerrainY(a.position.x, a.position.z);
      }
      if (nearest) {
        const dx = nearest.position.x - a.position.x;
        const dz = nearest.position.z - a.position.z;
        a.rotation.y = Math.atan2(dx, dz);
        ud.lastShot += dt * 1000;
        if (ud.lastShot > ud.shootInterval && nearestDist < 30) {
          ud.lastShot = 0; allyShotSnd();
          const from = new THREE.Vector3(a.position.x, a.position.y + 1.5, a.position.z);
          const to = new THREE.Vector3(nearest.position.x, nearest.position.y + 1.5, nearest.position.z);
          spawnTracer(from, to);
          if (Math.random() < 0.5) damageEnemy(nearest, 15);
        }
      }
      ud.walkPhase += dt * 6;
      const swing = Math.sin(ud.walkPhase) * 0.4;
      if (ud.legL) {
        ud.legL.rotation.x = swing; ud.legR.rotation.x = -swing;
        ud.bootL.rotation.x = swing; ud.bootR.rotation.x = -swing;
        ud.armL.rotation.x = -swing * 0.6; ud.armR.rotation.x = swing * 0.6;
      }
      if (ud.healthBar) ud.healthBar.parent.lookAt(camera.position);
    }
  }

  let hurtFlashTimeout = null;
  function flashRed() {
    const f = document.getElementById('hurtFlash');
    f.classList.add('on');
    clearTimeout(hurtFlashTimeout);
    hurtFlashTimeout = setTimeout(() => f.classList.remove('on'), 200);
  }
  function gameOver() { document.getElementById('gameOver').classList.add('show'); }
  function levelComplete() {
    unlockLevel(levelNum + 1);
    document.getElementById('completedLevel').textContent = levelNum;
    document.getElementById('levelComplete').classList.add('show');
    winSnd();
  }

  function updatePickups(dt) {
    for (let i = pickups.length - 1; i >= 0; i--) {
      const p = pickups[i];
      p.rotation.y += dt * 1.5;
      p.userData.phase += dt * 2;
      p.position.y = p.userData.baseY + Math.sin(p.userData.phase) * 0.2;
      const dx = player.pos.x - p.position.x;
      const dz = player.pos.z - p.position.z;
      if (Math.hypot(dx, dz) < 1.2) {
        if (p.userData.type === 'ammo') {
          weapons.rifle.reserve = Math.min(90, weapons.rifle.reserve + 30);
          weapons.smg.reserve = Math.min(120, weapons.smg.reserve + 40);
          weapons.shotgun.reserve = Math.min(32, weapons.shotgun.reserve + 8);
          weapons.rpg.reserve = Math.min(5, weapons.rpg.reserve + 1);
        } else player.hp = Math.min(player.maxHp, player.hp + 5);
        pickSnd(); updateUI();
        scene.remove(p); pickups.splice(i, 1);
        spawnRandomPickup();
      }
    }
  }

  function updateEffects(dt) {
    for (let i = shells.length - 1; i >= 0; i--) {
      const s = shells[i];
      if (s.userData.vel) {
        s.userData.vel.y -= 15 * dt;
        s.position.addScaledVector(s.userData.vel, dt);
        if (s.position.y < 0.05) {
          s.position.y = 0.05;
          s.userData.vel.multiplyScalar(0.3);
          s.userData.vel.y = Math.abs(s.userData.vel.y) * 0.3;
        }
      }
      if (s.userData.rot) {
        s.rotation.x += s.userData.rot.x * dt;
        s.rotation.y += s.userData.rot.y * dt;
        s.rotation.z += s.userData.rot.z * dt;
      }
      s.userData.life -= dt;
      if (s.userData.life <= 0) { scene.remove(s); shells.splice(i, 1); }
    }
    for (let i = sparks.length - 1; i >= 0; i--) {
      const sp = sparks[i];
      sp.userData.vel.y -= 10 * dt;
      sp.position.addScaledVector(sp.userData.vel, dt);
      sp.userData.life -= dt;
      sp.material.opacity = Math.max(0, sp.userData.life / 0.4);
      if (sp.userData.life <= 0) { scene.remove(sp); sp.material.dispose(); sparks.splice(i, 1); }
    }
    for (let i = tracers.length - 1; i >= 0; i--) {
      const tr = tracers[i];
      tr.life -= dt;
      tr.line.material.opacity = Math.max(0, tr.life / 0.12);
      if (tr.life <= 0) { scene.remove(tr.line); tr.line.geometry.dispose(); tr.line.material.dispose(); tracers.splice(i, 1); }
    }
    for (let i = decals.length - 1; i >= 0; i--) {
      decals[i].userData.life -= dt;
      if (decals[i].userData.life <= 0) { scene.remove(decals[i]); decals.splice(i, 1); }
    }
    for (let i = grenades.length - 1; i >= 0; i--) {
      const g = grenades[i];
      g.userData.vel.y -= 15 * dt;
      g.position.addScaledVector(g.userData.vel, dt);
      if (g.userData.spin) {
        g.rotation.x += g.userData.spin.x * dt;
        g.rotation.y += g.userData.spin.y * dt;
        g.rotation.z += g.userData.spin.z * dt;
      }
      const gy = getTerrainY(g.position.x, g.position.z);
      if (g.position.y < gy + 0.15) {
        g.position.y = gy + 0.15;
        g.userData.vel.y = Math.abs(g.userData.vel.y) * 0.4;
        g.userData.vel.x *= 0.7; g.userData.vel.z *= 0.7;
      }
      g.userData.life -= dt;
      if (g.userData.life <= 0 && !g.userData.exploded) {
        g.userData.exploded = true;
        explodeGrenade(g.position.clone());
        scene.remove(g); grenades.splice(i, 1);
      }
    }
    for (let i = rockets.length - 1; i >= 0; i--) {
      const r = rockets[i];
      r.mesh.position.addScaledVector(r.vel, dt);
      r.vel.y -= 3 * dt;
      r.life -= dt;
      let hit = false;
      const rPos = r.mesh.position;
      for (const e of enemies) {
        if (!e.userData.alive || e.userData.dying) continue;
        if (rPos.distanceTo(e.position) < 1.2) { hit = true; break; }
      }
      const gy = getTerrainY(rPos.x, rPos.z);
      if (rPos.y < gy + 0.2 || r.life <= 0) hit = true;
      // برخورد با ماشین
      for (const car of carGroup.children) {
        if (car.userData.destroyed) continue;
        if (rPos.distanceTo(car.position) < 2) { hit = true; break; }
      }
      if (hit) { explodeRPG(rPos.clone()); scene.remove(r.mesh); rockets.splice(i, 1); }
    }
    for (let i = explosions.length - 1; i >= 0; i--) {
      const ex = explosions[i];
      ex.life -= dt;
      const k = ex.life / ex.maxLife;
      const scale = 1 + (1-k) * (ex.maxScale || 8);
      ex.mesh.scale.setScalar(scale);
      ex.mesh.material.opacity = k * 0.9;
      if (ex.life <= 0) { scene.remove(ex.mesh); explosions.splice(i, 1); }
    }
    if (grenadeCooldown > 0) grenadeCooldown -= dt;
  }

  function updateReloadAnim(dt) {
    if (!reloadState) { hand.visible = false; return; }
    const w = weapons[reloadState.weapon];
    const t = (performance.now() - reloadState.startTime) / reloadState.duration;
    hand.visible = true;
    if (t < 0.25) {
      const k = t / 0.25;
      hand.position.set(0.15, -0.35 - k*0.15, -0.3 - k*0.1);
      hand.rotation.set(0, 0, 0.3 * k);
      w.obj.rotation.z = 0.3 * k;
      w.obj.position.y = -0.25 - 0.1 * k;
    } else if (t < 0.5) {
      const k = (t - 0.25) / 0.25;
      hand.position.set(0.15, -0.5 - k*0.2, -0.4);
      hand.rotation.set(0, 0, 0.3);
      w.obj.rotation.z = 0.3;
      w.obj.position.y = -0.35 - 0.1 * k;
    } else if (t < 0.75) {
      const k = (t - 0.5) / 0.25;
      hand.position.set(0.15, -0.7 + k*0.2, -0.4);
      hand.rotation.set(0, 0, 0.3 - 0.3 * k);
      w.obj.rotation.z = 0.3 * (1 - k);
      w.obj.position.y = -0.45 + 0.1 * k;
    } else {
      const k = (t - 0.75) / 0.25;
      hand.position.set(0.15, -0.5 + k*0.25, -0.4 + k*0.1);
      hand.rotation.set(0, 0, 0);
      w.obj.rotation.z = 0;
      w.obj.position.y = -0.35 + k * 0.1;
    }
  }

  const radarCanvas = document.getElementById('radarCanvas');
  const radarCtx = radarCanvas.getContext('2d');
  const RADAR_RANGE = 40;
  function drawRadar() {
    const W = radarCanvas.width, H = radarCanvas.height;
    const cx = W/2, cy = H/2, r = W/2 - 6;
    radarCtx.clearRect(0, 0, W, H);
    radarCtx.beginPath(); radarCtx.arc(cx, cy, r, 0, Math.PI*2);
    radarCtx.fillStyle = 'rgba(0,30,0,0.6)'; radarCtx.fill();
    radarCtx.strokeStyle = '#0f0'; radarCtx.lineWidth = 2; radarCtx.stroke();
    radarCtx.strokeStyle = 'rgba(0,255,0,0.3)'; radarCtx.lineWidth = 1;
    for (let i=1; i<=2; i++) { radarCtx.beginPath(); radarCtx.arc(cx, cy, r*i/3, 0, Math.PI*2); radarCtx.stroke(); }
    radarCtx.beginPath();
    radarCtx.moveTo(cx, cy-r); radarCtx.lineTo(cx, cy+r);
    radarCtx.moveTo(cx-r, cy); radarCtx.lineTo(cx+r, cy);
    radarCtx.stroke();
    radarCtx.save();
    radarCtx.translate(cx, cy);
    radarCtx.rotate(-yaw);
    radarCtx.fillStyle = '#0f0';
    radarCtx.beginPath();
    radarCtx.moveTo(0, -8); radarCtx.lineTo(-6, 6); radarCtx.lineTo(6, 6);
    radarCtx.closePath(); radarCtx.fill();
    radarCtx.restore();
    const px = player.pos.x, pz = player.pos.z;
    const scale = r / RADAR_RANGE;
    function drawDot(x, z, color, size) {
      const dx = x - px, dz = z - pz;
      const d = Math.hypot(dx, dz);
      if (d > RADAR_RANGE) return;
      const rx = dx * Math.cos(-yaw) - dz * Math.sin(-yaw);
      const rz = dx * Math.sin(-yaw) + dz * Math.cos(-yaw);
      radarCtx.fillStyle = color;
      radarCtx.beginPath(); radarCtx.arc(cx + rx*scale, cy + rz*scale, size, 0, Math.PI*2); radarCtx.fill();
    }
    for (const e of enemies) {
      if (!e.userData.alive || e.userData.dying) continue;
      drawDot(e.position.x, e.position.z, e.userData.hasGun ? '#ff0' : '#f33', e.userData.hasGun ? 5 : 4);
    }
    for (const a of allies) {
      if (!a.userData.alive) continue;
      drawDot(a.position.x, a.position.z, '#4af', 4);
    }
    for (const p of pickups) {
      drawDot(p.position.x, p.position.z, p.userData.type === 'ammo' ? '#fc0' : '#f6c', 3);
    }
  }

  const clock = new THREE.Clock();
  let radarTimer = 0;

  function animate() {
    if (!gameState) return;
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);
    if (isFiring && weapons[currentWeapon].auto && !reloadState) tryShoot();
    updateMovement(dt);
    updateLock(dt);
    updateEnemies(dt);
    updateAllies(dt);
    updatePickups(dt);
    updateEffects(dt);
    updateReloadAnim(dt);
    radarTimer += dt;
    if (radarTimer > 0.1) { drawRadar(); radarTimer = 0; }
    recoilKick *= 0.85;
    const w = weapons[currentWeapon];
    if (!reloadState) {
      const bp = w.basePos;
      w.obj.position.z = bp.z + recoilKick * 3;
      w.obj.rotation.x = recoilKick * 2;
      if (isZooming) {
        w.obj.position.x += (0 - w.obj.position.x) * 0.15;
        w.obj.position.y += (-0.15 - w.obj.position.y) * 0.15;
      } else {
        w.obj.position.x += (bp.x - w.obj.position.x) * 0.15;
        w.obj.position.y += (bp.y - w.obj.position.y) * 0.15;
      }
    }
    if (gameWon && winTimer > 0) { winTimer -= dt; if (winTimer <= 0) levelComplete(); }
    renderer.render(scene, camera);
  }

  const origDispose = () => {
    removeEventListener('resize', onResize);
    document.removeEventListener('mousemove', onMouseMove);
    document.removeEventListener('mousedown', onMouseDown);
    document.removeEventListener('mouseup', onMouseUp);
    document.removeEventListener('contextmenu', onCtxMenu);
    renderer.dispose();
    if (renderer.domElement.parentNode) renderer.domElement.parentNode.removeChild(renderer.domElement);
  };
  gameState = { dispose: origDispose };
  animate();

  document.addEventListener('touchmove', e => {
    if (e.target.id !== 'lookArea' && !e.target.closest('#joyLeft') && !e.target.closest('#weaponButtons')) e.preventDefault();
  }, { passive:false });
  document.addEventListener('gesturestart', e => e.preventDefault());
}
</script>
</body>
</html>
