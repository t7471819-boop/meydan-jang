<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>میدان جنگ - ۱۵ مرحله</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Tahoma, Arial, sans-serif;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    position: fixed;
}

canvas {
    display: block;
}

#hud {
    position: fixed;
    inset: 0;
    pointer-events: none;
    color: white;
    text-shadow: 2px 2px 5px #000;
    z-index: 10;
}

#level {
    position: absolute;
    top: 8px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 13px;
    color: #ffcc00;
    background: rgba(0, 0, 0, 0.6);
    padding: 4px 14px;
    border-radius: 20px;
    font-weight: bold;
    white-space: nowrap;
}

#health {
    position: absolute;
    top: 8px;
    right: 10px;
    font-size: 15px;
    color: #ff5555;
    background: rgba(0, 0, 0, 0.6);
    padding: 4px 12px;
    border-radius: 20px;
}

#enemyCount {
    position: absolute;
    top: 40px;
    right: 10px;
    font-size: 13px;
    color: #88ccff;
    background: rgba(0, 0, 0, 0.6);
    padding: 4px 12px;
    border-radius: 20px;
}

#allyCount {
    position: absolute;
    top: 72px;
    right: 10px;
    font-size: 13px;
    color: #88ff88;
    background: rgba(0, 0, 0, 0.6);
    padding: 4px 12px;
    border-radius: 20px;
}

#grenadeCount {
    position: absolute;
    top: 104px;
    right: 10px;
    font-size: 13px;
    color: #ffaa66;
    background: rgba(0, 0, 0, 0.6);
    padding: 4px 12px;
    border-radius: 20px;
}

#weapon {
    position: absolute;
    top: 8px;
    left: 10px;
    font-size: 14px;
    color: #ffaa00;
    background: rgba(0, 0, 0, 0.6);
    padding: 4px 12px;
    border-radius: 20px;
}

#ammo {
    position: absolute;
    top: 40px;
    left: 10px;
    font-size: 13px;
    color: #ffdd44;
    background: rgba(0, 0, 0, 0.6);
    padding: 4px 12px;
    border-radius: 20px;
}

#reserve {
    position: absolute;
    top: 72px;
    left: 10px;
    font-size: 13px;
    color: #88ffaa;
    background: rgba(0, 0, 0, 0.6);
    padding: 4px 12px;
    border-radius: 20px;
}

#reloadMsg {
    position: fixed;
    top: 45%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #ffdd44;
    font-size: 18px;
    text-shadow: 2px 2px 6px #000;
    z-index: 29;
    pointer-events: none;
    text-align: center;
    background: rgba(0, 0, 0, 0.75);
    padding: 8px 20px;
    border-radius: 12px;
    opacity: 0;
    transition: opacity 0.2s;
    font-weight: bold;
}

#radar {
    position: fixed;
    top: 8px;
    left: 50%;
    transform: translateX(-50%) translateX(-115px);
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: rgba(0, 20, 0, 0.75);
    border: 3px solid rgba(0, 255, 0, 0.6);
    z-index: 12;
    pointer-events: none;
    box-shadow: 0 0 15px rgba(0, 255, 0, 0.4),
                inset 0 0 20px rgba(0, 255, 0, 0.15);
}

#radarCanvas {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    display: block;
}

#joyZone {
    position: fixed;
    bottom: 15px;
    left: 15px;
    width: 105px;
    height: 105px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.13);
    border: 2px solid rgba(255, 255, 255, 0.35);
    z-index: 20;
    touch-action: none;
}

#joyKnob {
    position: absolute;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.55);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
}

#fireBtn {
    position: fixed;
    bottom: 15px;
    right: 15px;
    width: 75px;
    height: 75px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 60, 60, 0.95), rgba(180, 20, 20, 0.95));
    border: 3px solid rgba(255, 255, 255, 0.6);
    z-index: 25;
    color: white;
    font-size: 11px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
    box-shadow: 0 0 18px rgba(255, 0, 0, 0.6);
}

#fireBtn:active {
    transform: scale(0.92);
}

#grenadeBtn {
    position: fixed;
    bottom: 100px;
    right: 100px;
    width: 65px;
    height: 65px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 140, 40, 0.95), rgba(180, 80, 10, 0.95));
    border: 3px solid rgba(255, 255, 255, 0.6);
    z-index: 25;
    color: white;
    font-size: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
    box-shadow: 0 0 15px rgba(255, 140, 40, 0.7);
}

#grenadeBtn:active {
    transform: scale(0.9);
}

#jumpBtn {
    position: fixed;
    bottom: 100px;
    right: 175px;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(70, 150, 255, 0.95), rgba(30, 80, 180, 0.95));
    border: 3px solid rgba(255, 255, 255, 0.6);
    z-index: 25;
    color: white;
    font-size: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
    box-shadow: 0 0 15px rgba(70, 150, 255, 0.7);
}

#jumpBtn:active {
    transform: scale(0.9);
}

#zoomBtn, #reloadBtn {
    position: fixed;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.55);
    border: 2px solid rgba(255, 255, 255, 0.4);
    color: white;
    font-size: 18px;
    z-index: 22;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
}

#zoomBtn {
    bottom: 98px;
    right: 15px;
}

#reloadBtn {
    bottom: 98px;
    right: 70px;
}

#zoomBtn:active, #reloadBtn:active {
    background: rgba(255, 165, 0, 0.6);
}

#weaponBtns {
    position: fixed;
    bottom: 15px;
    left: 130px;
    display: flex;
    flex-direction: column;
    gap: 3px;
    z-index: 22;
}

.wbtn {
    width: 68px;
    height: 26px;
    border-radius: 8px;
    background: rgba(0, 0, 0, 0.55);
    border: 2px solid rgba(255, 255, 255, 0.3);
    color: white;
    font-size: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
}

.wbtn.active {
    background: rgba(255, 165, 0, 0.8);
    border-color: #fff;
    box-shadow: 0 0 12px rgba(255, 165, 0, 0.6);
}

#msg {
    position: fixed;
    top: 25%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: white;
    font-size: 22px;
    text-shadow: 3px 3px 8px #000;
    z-index: 30;
    pointer-events: none;
    text-align: center;
    background: rgba(0, 0, 0, 0.75);
    padding: 12px 24px;
    border-radius: 15px;
    opacity: 0;
    transition: opacity 0.4s;
    font-weight: bold;
}

#menuScreen {
    position: fixed;
    inset: 0;
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 15px;
    overflow-y: auto;
}

#menuScreen h1 {
    color: #ffcc00;
    font-size: 24px;
    margin-bottom: 15px;
    text-shadow: 3px 3px 8px #000;
}

#menuRow {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: 20px;
    width: 100%;
    max-width: 1100px;
    flex-wrap: wrap;
}

#startArea {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    min-width: 200px;
    order: 1;
}

#levelGrid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    width: auto;
    max-width: 600px;
    order: 2;
}

.lvlBtn {
    padding: 10px 8px;
    border-radius: 12px;
    background: linear-gradient(135deg, #3a3a5a, #2a2a4a);
    border: 2px solid #88aaff;
    color: white;
    font-family: Tahoma;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
    text-align: center;
    transition: all 0.2s;
    touch-action: manipulation;
}

.lvlBtn:active {
    transform: scale(0.95);
}

.lvlBtn.locked {
    background: linear-gradient(135deg, #2a2a2a, #1a1a1a);
    border-color: #555;
    color: #666;
    cursor: not-allowed;
    pointer-events: none;
    opacity: 0.5;
}

.lvlBtn .num {
    font-size: 16px;
    color: #ffcc00;
    display: block;
    margin-bottom: 3px;
}

.lvlBtn.locked .num {
    color: #666;
}

.lvlBtn .name {
    font-size: 10px;
    color: #ccc;
}

.lvlBtn .stars {
    font-size: 12px;
    color: #ffdd44;
    margin-top: 2px;
    display: block;
}

#gameOverScreen {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.92);
    color: white;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 110;
    text-align: center;
    padding: 15px;
}

#gameOverScreen h1 {
    font-size: 32px;
    margin-bottom: 10px;
}

#gameOverScreen.win h1 {
    color: #44ff88;
}

#gameOverScreen.lose h1 {
    color: #ff4444;
}

#gameOverScreen p {
    font-size: 14px;
    margin-bottom: 12px;
    color: #ccc;
}

.bigBtn {
    padding: 14px 40px;
    font-size: 18px;
    font-family: Tahoma;
    font-weight: bold;
    color: white;
    background: linear-gradient(135deg, #ff6b00, #ff3300);
    border: 3px solid #ffcc00;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(255, 80, 0, 0.5);
    transition: all 0.2s;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
}

.bigBtn:active {
    transform: scale(0.94);
}

#crosshair {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 22px;
    height: 22px;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 15;
}

#crosshair::before,
#crosshair::after {
    content: '';
    position: absolute;
    background: #fff;
    box-shadow: 0 0 4px #000;
}

#crosshair::before {
    left: 50%;
    top: 0;
    width: 2px;
    height: 100%;
    transform: translateX(-50%);
}

#crosshair::after {
    top: 50%;
    left: 0;
    height: 2px;
    width: 100%;
    transform: translateY(-50%);
}

#lockIndicator {
    position: fixed;
    width: 60px;
    height: 60px;
    border: 3px solid #ff2222;
    border-radius: 50%;
    pointer-events: none;
    z-index: 18;
    display: none;
    box-shadow: 0 0 15px rgba(255, 30, 30, 0.8),
                inset 0 0 15px rgba(255, 30, 30, 0.4);
    animation: lockPulse 0.8s infinite;
}

@keyframes lockPulse {
    0%, 100% {
        transform: scale(1);
        opacity: 1;
    }
    50% {
        transform: scale(1.15);
        opacity: 0.6;
    }
}

#lockText {
    position: fixed;
    color: #ff2222;
    font-size: 12px;
    font-weight: bold;
    text-shadow: 0 0 8px #ff0000, 2px 2px 4px #000;
    pointer-events: none;
    z-index: 18;
    display: none;
}

#scopeOverlay {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 17;
    display: none;
    background: radial-gradient(
        circle at center,
        transparent 0%,
        transparent 22%,
        rgba(0, 0, 0, 0.95) 25%,
        #000 100%
    );
}

#scopeOverlay::before {
    content: '';
    position: absolute;
    left: 50%;
    top: 0;
    bottom: 0;
    width: 2px;
    background: rgba(0, 0, 0, 0.9);
    transform: translateX(-50%);
}

#scopeOverlay::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 0;
    right: 0;
    height: 2px;
    background: rgba(0, 0, 0, 0.9);
    transform: translateY(-50%);
}

#damageOverlay {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(
        circle,
        transparent 40%,
        rgba(255, 0, 0, 0.6) 100%
    );
    opacity: 0;
    transition: opacity 0.3s;
    z-index: 14;
}

#hitmarker {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 32px;
    height: 32px;
    transform: translate(-50%, -50%) rotate(45deg);
    pointer-events: none;
    z-index: 16;
    display: none;
}

#hitmarker::before,
#hitmarker::after {
    content: '';
    position: absolute;
    background: #ff3333;
}

#hitmarker::before {
    left: 50%;
    top: 0;
    width: 3px;
    height: 100%;
    transform: translateX(-50%);
}

#hitmarker::after {
    top: 50%;
    left: 0;
    height: 3px;
    width: 100%;
    transform: translateY(-50%);
}

#rotateMsg {
    display: none;
    position: fixed;
    inset: 0;
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    color: white;
    z-index: 200;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 30px;
}

#rotateMsg .icon {
    font-size: 70px;
    margin-bottom: 20px;
}

#rotateMsg h2 {
    color: #ffcc00;
    font-size: 22px;
    margin-bottom: 15px;
}

@media (orientation: portrait) and (max-width: 768px) {
    #rotateMsg {
        display: flex;
    }
}

@media (max-width: 600px) {
    #menuRow {
        flex-direction: column;
    }
    #startArea {
        order: 1;
    }
    #levelGrid {
        grid-template-columns: repeat(4, 1fr);
        max-width: 450px;
        order: 2;
    }
}
</style>
</head>

<div id="hud">

    <div id="health">❤️ 10</div>
    <div id="enemyCount">👥 0</div>
    <div id="allyCount">🤝 0</div>
    <div id="grenadeCount">💣 3</div>
    <div id="weapon">کلت</div>
    <div id="ammo">🔫 12/12</div>
    <div id="reserve">📦 36</div>
</div>

<div id="radar">
    <canvas id="radarCanvas"></canvas>
</div>

<div id="crosshair"></div>
<div id="lockIndicator"></div>
<div id="lockText">🎯 قفل</div>
<div id="scopeOverlay"></div>
<div id="hitmarker"></div>
<div id="msg"></div>
<div id="reloadMsg"></div>
<div id="damageOverlay"></div>

<div id="joyZone"><div id="joyKnob"></div></div>
<div id="fireBtn">🔥</div>
<div id="grenadeBtn">💣</div>
<div id="jumpBtn">⬆️</div>
<div id="zoomBtn">🔍</div>
<div id="reloadBtn">🔄</div>
<div id="weaponBtns">
    <div class="wbtn active" data-w="pistol">کلت</div>
    <div class="wbtn" data-w="rifle">رگبار</div>
    <div class="wbtn" data-w="sniper">اسنایپ</div>
    <div class="wbtn" data-w="shotgun">شات‌گان</div>
    <div class="wbtn" data-w="heavy">دوشگاه</div>
</div>

<div id="menuScreen">
    <h1>🎯 میدان جنگ - ۱۵ مرحله</h1>
    <div id="menuRow">
        <div id="startArea">
            <button id="startFromOneBtn" class="bigBtn">🚀 شروع از مرحله ۱</button>
        </div>
        <div id="levelGrid"></div>
    </div>
</div>

<div id="gameOverScreen">
    <h1 id="gameOverTitle">بازی تمام شد</h1>
    <p id="gameOverMsg"></p>
    <button id="backToMenuBtn" class="bigBtn">🏠 بازگشت به منو</button>
</div>

<div id="rotateMsg">
    <div class="icon">📱</div>
    <h2>گوشی رو افقی بگیر!</h2>
</div>

function groundHeight(x, z) {
    const dist = Math.sqrt(x * x + z * z);
    const damp = Math.min(1, dist / 20);
    return (
        Math.sin(x * 0.05) * Math.cos(z * 0.05) * 1.5 +
        Math.sin(x * 0.15 + 1) * Math.cos(z * 0.12) * 0.6 +
        Math.sin(x * 0.3) * 0.3
    ) * damp;
}

let groundMesh = null;
let tuftMeshes = [];
let coverMeshes = [];
let rockMeshes = [];
let treeMeshes = [];
const covers = [];

function clearWorld() {
    if (groundMesh) scene.remove(groundMesh);
    tuftMeshes.forEach(t => scene.remove(t));
    coverMeshes.forEach(c => scene.remove(c));
    rockMeshes.forEach(r => scene.remove(r));
    treeMeshes.forEach(t => scene.remove(t));
    tuftMeshes = [];
    coverMeshes = [];
    rockMeshes = [];
    treeMeshes = [];
    covers.length = 0;
}

function buildWorld(L) {
    clearWorld();
    scene.background = new THREE.Color(L.sky);
    scene.fog = new THREE.Fog(L.fog, L.fogN, L.fogF);

    const groundGeo = new THREE.PlaneGeometry(300, 300, 80, 80);
    groundGeo.rotateX(-Math.PI / 2);
    const pos = groundGeo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
        pos.setY(i, groundHeight(pos.getX(i), pos.getZ(i)));
    }
    pos.needsUpdate = true;
    groundGeo.computeVertexNormals();

    groundMesh = new THREE.Mesh(
        groundGeo,
        new THREE.MeshStandardMaterial({ color: L.ground, roughness: 0.95 })
    );
    groundMesh.receiveShadow = true;
    scene.add(groundMesh);

    const tuftMat = new THREE.MeshStandardMaterial({ color: L.tuft });
    for (let i = 0; i < 100; i++) {
        const a = Math.random() * Math.PI * 2;
        const r = 15 + Math.random() * 100;
        const x = Math.cos(a) * r;
        const z = Math.sin(a) * r;
        const tuft = new THREE.Mesh(new THREE.ConeGeometry(0.3, 0.8, 4), tuftMat);
        tuft.position.set(x, groundHeight(x, z) + 0.3, z);
        scene.add(tuft);
        tuftMeshes.push(tuft);
    }

    const coverMat = new THREE.MeshStandardMaterial({ color: L.cover, roughness: 1 });
    const coverLayout = [
        [10, 10, 4, 2, 1.5], [-15, 8, 5, 1.5, 2],
        [15, -12, 3, 2, 2], [-20, -15, 4, 1.5, 2.5],
        [0, 20, 6, 2, 1.5], [-25, 5, 3, 1.5, 2],
        [25, 20, 4, 2, 2], [-30, -20, 5, 2, 1.8]
    ];

    coverLayout.forEach(([x, z, w, h, d]) => {
        const cover = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), coverMat);
        cover.position.set(x, groundHeight(x, z) + h / 2, z);
        cover.castShadow = true;
        cover.receiveShadow = true;
        scene.add(cover);
        coverMeshes.push(cover);
        covers.push({ mesh: cover, w, h, d });
    });

    const rockMat = new THREE.MeshStandardMaterial({ color: 0x808080, roughness: 1 });
    for (let i = 0; i < L.rocks; i++) {
        const a = Math.random() * Math.PI * 2;
        const r = 20 + Math.random() * 100;
        const x = Math.cos(a) * r;
        const z = Math.sin(a) * r;
        const size = 1 + Math.random() * 2;
        const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(size), rockMat);
        rock.position.set(x, groundHeight(x, z) + size * 0.6, z);
        rock.rotation.set(Math.random(), Math.random(), Math.random());
        rock.castShadow = true;
        rock.receiveShadow = true;
        scene.add(rock);
        rockMeshes.push(rock);
    }

    if (L.trees > 0) {
        const trunkMat = new THREE.MeshStandardMaterial({ color: 0x4a2a1a, roughness: 1 });
        const leafMat = new THREE.MeshStandardMaterial({ color: 0x1a4a1a, roughness: 1 });

        for (let i = 0; i < L.trees; i++) {
            const a = Math.random() * Math.PI * 2;
            const r = 20 + Math.random() * 90;
            const x = Math.cos(a) * r;
            const z = Math.sin(a) * r;
            const gh = groundHeight(x, z);

            const trunk = new THREE.Mesh(
                new THREE.CylinderGeometry(0.4, 0.5, 3, 6), trunkMat
            );
            trunk.position.set(x, gh + 1.5, z);
            trunk.castShadow = true;
            scene.add(trunk);
            treeMeshes.push(trunk);

            const leaves = new THREE.Mesh(
                new THREE.ConeGeometry(2.5, 5, 8), leafMat
            );
            leaves.position.set(x, gh + 5, z);
            leaves.castShadow = true;
            scene.add(leaves);
            treeMeshes.push(leaves);

            const leaves2 = new THREE.Mesh(
                new THREE.ConeGeometry(2, 4, 8), leafMat
            );
            leaves2.position.set(x, gh + 6.5, z);
            leaves2.castShadow = true;
            scene.add(leaves2);
            treeMeshes.push(leaves2);
        }
    }
}

    else if (currentWeapon === 'rifle') muzzleGroup.position.set(0, 0.06, -1.4);

}

function triggerFlash() {
    flashTime = FLASH_DURATION;
    flashCore.material.opacity = 1;
    flashCone.material.opacity = 0.9;
    muzzleLight.intensity = 4;
}

function updateFlash(dt) {
    if (flashTime > 0) {
        flashTime -= dt;
        const t = Math.max(0, flashTime / FLASH_DURATION);
        flashCore.material.opacity = t;
        flashCone.material.opacity = t * 0.9;
        muzzleLight.intensity = t * 4;
    } else {
        flashCore.material.opacity = 0;
        flashCone.material.opacity = 0;
        muzzleLight.intensity = 0;
    }
}

let bloodParticles = [];

function spawnBlood(pos) {
    for (let i = 0; i < 8; i++) {
        const p = new THREE.Mesh(
            new THREE.SphereGeometry(0.08, 4, 4),
            new THREE.MeshBasicMaterial({ color: 0xcc0000 })
        );
        p.position.copy(pos).add(new THREE.Vector3(
            (Math.random() - 0.5) * 0.3,
            (Math.random() - 0.3) * 0.3,
            (Math.random() - 0.5) * 0.3
        ));
        scene.add(p);
        bloodParticles.push({
            mesh: p,
            vel: new THREE.Vector3(
                (Math.random() - 0.5) * 3,
                Math.random() * 2 + 1,
                (Math.random() - 0.5) * 3
            ),
            life: 0.8
        });
    }
}

function updateBlood(dt) {
    for (let i = bloodParticles.length - 1; i >= 0; i--) {
        const b = bloodParticles[i];
        b.vel.y -= 15 * dt;
        b.mesh.position.add(b.vel.clone().multiplyScalar(dt));
        b.life -= dt;
        b.mesh.material.opacity = b.life / 0.8;
        if (b.life <= 0) {
            scene.remove(b.mesh);
            bloodParticles.splice(i, 1);
        }
    }
}

let bullets = [];
const bulletGeo = new THREE.SphereGeometry(0.06, 6, 6);

function spawnBulletVisual(from, to, color) {
    const dir = new THREE.Vector3().subVectors(to, from);
    const len = dir.length();
    dir.normalize();

    const trailGeo = new THREE.BufferGeometry().setFromPoints([
        from.clone(), to.clone()
    ]);
    const trailMat = new THREE.LineBasicMaterial({
        color, transparent: true, opacity: 0.9
    });
    const trail = new THREE.Line(trailGeo, trailMat);
    scene.add(trail);
    setTimeout(() => scene.remove(trail), 80);

    const bullet = new THREE.Mesh(bulletGeo, new THREE.MeshBasicMaterial({ color }));
    bullet.position.copy(from);
    scene.add(bullet);

    bullets.push({
        mesh: bullet, dir, speed: 250,
        traveled: 0, maxDist: len,
        startPos: from.clone()
    });
}

let grenades = [];
const grenadeGeo = new THREE.SphereGeometry(0.15, 8, 8);
const grenadeBodyMat = new THREE.MeshStandardMaterial({ color: 0x2a5a2a, roughness: 0.7 });
let explosionParticles = [];

function throwGrenade() {
    if (grenadeCount <= 0) {
        showMsg('❌ نارنجکی نداری!', 1);
        return;
    }
    grenadeCount--;
    updateGrenadeUI();

    const dir = new THREE.Vector3(0, 0, -1).applyEuler(
        new THREE.Euler(player.pitch, player.yaw, 0, 'YXZ')
    );
    const start = camera.position.clone().add(dir.clone().multiplyScalar(1));
    start.y -= 0.2;

    const mesh = new THREE.Mesh(grenadeGeo, grenadeBodyMat);
    mesh.position.copy(start);
    mesh.castShadow = true;
    scene.add(mesh);

    const vel = dir.clone().multiplyScalar(20);
    vel.y += 5;

    grenades.push({ mesh, vel, life: 2.0, exploded: false });
    showMsg('💣 نارنجک پرتاب شد!', 0.8);
}

function explodeGrenade(g) {
    g.exploded = true;
    const pos = g.mesh.position.clone();

    const explosionGeo = new THREE.SphereGeometry(1, 16, 16);
    const explosionMat = new THREE.MeshBasicMaterial({
        color: 0xffaa00, transparent: true, opacity: 0.9
    });
    const explosion = new THREE.Mesh(explosionGeo, explosionMat);
    explosion.position.copy(pos);
    scene.add(explosion);

    const light = new THREE.PointLight(0xff8800, 8, 15);
    light.position.copy(pos);
    scene.add(light);

    for (let i = 0; i < 20; i++) {
        const p = new THREE.Mesh(
            new THREE.SphereGeometry(0.3, 6, 6),
            new THREE.MeshBasicMaterial({
                color: 0x8a6a4a, transparent: true, opacity: 0.9
            })
        );
        p.position.copy(pos);
        scene.add(p);
        explosionParticles.push({
            mesh: p,
            vel: new THREE.Vector3(
                (Math.random() - 0.5) * 10,
                Math.random() * 8 + 2,
                (Math.random() - 0.5) * 10
            ),
            life: 1.2
        });
    }

    let scale = 1, opacity = 0.9;
    const anim = setInterval(() => {
        scale += 0.8;
        opacity -= 0.08;
        explosion.scale.set(scale, scale, scale);
        explosion.material.opacity = Math.max(0, opacity);
        light.intensity = Math.max(0, 8 - scale * 1.5);
        if (opacity <= 0) {
            clearInterval(anim);
            scene.remove(explosion);
            scene.remove(light);
        }
    }, 30);

    const radius = 8, damage = 150;
    for (const enemy of enemies) {
        if (!enemy.alive || enemy.dying) continue;
        const d = enemy.group.position.distanceTo(pos);
        if (d < radius) {
            enemy.health -= damage * (1 - d / radius);
            enemy.hitTimer = 0.3;
            if (enemy.health <= 0 && !enemy.dying) startDying(enemy);
        }
    }

    const pd = player.pos.distanceTo(pos);
    if (pd < radius) {
        const dmg = Math.floor(3 * (1 - pd / radius));
        if (dmg > 0) {
            player.health -= dmg;
            updateHealthUI();
            showDamageOverlay();
        }
    }

    scene.remove(g.mesh);
}

function updateGrenades(dt) {
    for (let i = grenades.length - 1; i >= 0; i--) {
        const g = grenades[i];
        if (g.exploded) { grenades.splice(i, 1); continue; }

        g.vel.y -= 15 * dt;
        g.mesh.position.add(g.vel.clone().multiplyScalar(dt));

        const gh = groundHeight(g.mesh.position.x, g.mesh.position.z);
        if (g.mesh.position.y < gh + 0.15) {
            g.mesh.position.y = gh + 0.15;
            g.vel.y = -g.vel.y * 0.4;
            g.vel.x *= 0.7;
            g.vel.z *= 0.7;
        }

        g.mesh.rotation.x += dt * 5;
        g.mesh.rotation.z += dt * 3;
        g.life -= dt;
        if (g.life <= 0) explodeGrenade(g);
    }

    for (let i = explosionParticles.length - 1; i >= 0; i--) {
        const p = explosionParticles[i];
        p.vel.y -= 10 * dt;
        p.mesh.position.add(p.vel.clone().multiplyScalar(dt));
        p.mesh.scale.multiplyScalar(1 + dt * 2);
        p.mesh.material.opacity -= dt * 0.7;
        p.life -= dt;
        if (p.life <= 0) {
            scene.remove(p.mesh);
            explosionParticles.splice(i, 1);
        }
    }
}

function startDying(enemy) {
    enemy.dying = true;
    enemy.dyingTimer = 0;
    enemy.alive = false;
    enemiesRemaining--;
    updateEnemyCountUI();

    if (lockedEnemy === enemy) {
        lockedEnemy = null;
        document.getElementById('lockIndicator').style.display = 'none';
        document.getElementById('lockText').style.display = 'none';
    }

    if (Math.random() < 0.5) {
        spawnPickup(
            enemy.group.position.x,
            enemy.group.position.z,
            Math.random() < 0.7 ? 'ammo' : 'health'
        );
    }
}

let joyX = 0, joyY = 0;
let joyActive = false;
let joyTouchId = null;
let lookTouchId = null;
let lastLookX = 0, lastLookY = 0;
let firing = false;

const joyZone = document.getElementById('joyZone');
const joyKnob = document.getElementById('joyKnob');
const fireBtn = document.getElementById('fireBtn');

const lockText = document.getElementById('lockText');

function getCenter(el) {
    const r = el.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2, r: r.width / 2 };
}

joyZone.addEventListener('touchstart', e => {
    e.preventDefault(); e.stopPropagation();
    const t = e.changedTouches[0];
    joyTouchId = t.identifier;
    joyActive = true;
    updateJoy(t);
}, { passive: false });

joyZone.addEventListener('touchmove', e => {
    e.preventDefault(); e.stopPropagation();
    for (const t of e.changedTouches) {
        if (t.identifier === joyTouchId) updateJoy(t);
    }
}, { passive: false });

joyZone.addEventListener('touchend', e => {
    e.preventDefault(); e.stopPropagation();
    for (const t of e.changedTouches) {
        if (t.identifier === joyTouchId) {
            joyTouchId = null;
            joyActive = false;
            joyX = 0; joyY = 0;
            joyKnob.style.transform = 'translate(-50%,-50%)';
        }
    }
}, { passive: false });

function updateJoy(t) {
    const c = getCenter(joyZone);
    let dx = t.clientX - c.x;
    let dy = t.clientY - c.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const maxR = c.r - 8;
    if (dist > maxR) {
        dx = dx / dist * maxR;
        dy = dy / dist * maxR;
    }
    joyKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
    joyX = dx / maxR;
    joyY = dy / maxR;
}

document.addEventListener('touchstart', e => {
    if (lookTouchId !== null) return;
    const target = e.target;
    if (
        target.closest('#joyZone') || target.closest('#fireBtn') ||
        target.closest('#grenadeBtn') || target.closest('#jumpBtn') ||
        target.closest('#zoomBtn') || target.closest('#reloadBtn') ||
        target.closest('.wbtn') || target.closest('.bigBtn') ||
        target.closest('.lvlBtn') || target.closest('#radar')
    ) return;
    const t = e.changedTouches[0];
    lookTouchId = t.identifier;
    lastLookX = t.clientX;
    lastLookY = t.clientY;
    lookDragDistance = 0;
}, { passive: true });

document.addEventListener('touchmove', e => {
    for (const t of e.changedTouches) {
        if (t.identifier === lookTouchId) {
            const dx = t.clientX - lastLookX;
            const dy = t.clientY - lastLookY;
            lastLookX = t.clientX;
            lastLookY = t.clientY;

            lookDragDistance += Math.sqrt(dx * dx + dy * dy);

            if (lookDragDistance > LOOK_BREAK_THRESHOLD) {
                if (lockedEnemy) {
                    lockedEnemy = null;
                    lockBreakCooldown = 1.5;
                    lockIndicator.style.display = 'none';
                    lockText.style.display = 'none';
                    showMsg('🔓 قفل برداشته شد', 0.8);
                }
                lookDragDistance = 0;
            }

            if (lockedEnemy) {
                const sens = 0.0003;
                player.yaw -= dx * sens;
                player.pitch -= dy * sens;
            } else {
                const sens = player.zooming ? 0.0008 : 0.0035;
                player.yaw -= dx * sens;
                player.pitch -= dy * sens;
            }
            player.pitch = Math.max(
                -Math.PI / 2 + 0.1,
                Math.min(Math.PI / 2 - 0.1, player.pitch)
            );
        }
    }
}, { passive: true });

document.addEventListener('touchend', e => {
    for (const t of e.changedTouches) {
        if (t.identifier === lookTouchId) {
            lookTouchId = null;
            lookDragDistance = 0;
        }
    }
}, { passive: true });

addEventListener('keydown', e => {
    keysDown[e.code] = true;
    if (e.code === 'Digit1') switchWeapon('pistol');
    if (e.code === 'Digit2') switchWeapon('rifle');
    if (e.code === 'Digit3') switchWeapon('sniper');
    if (e.code === 'Digit4') switchWeapon('shotgun');
    if (e.code === 'Digit5') switchWeapon('heavy');
    if (e.code === 'KeyR') startReload();
    if (e.code === 'KeyG') throwGrenade();

});

});

function switchWeapon(w) {
    if (currentWeapon === w || reloading) return;
    currentWeapon = w;
    document.getElementById('weapon').textContent = WEAPONS[w].name;
    document.querySelectorAll('.wbtn').forEach(b => {
        b.classList.toggle('active', b.dataset.w === w);
    });
    showWeaponModel(w);
    updateMuzzlePos();
    updateAmmoUI();
    updateReserveUI();
    if (player.zooming && w !== 'sniper' && w !== 'heavy') {
        player.zooming = false;
        scopeOverlay.style.display = 'none';
    }
}

function startReload() {
    if (reloading) return;
    const w = WEAPONS[currentWeapon];
    if (ammo[currentWeapon] >= w.maxAmmo) return;
    if (reserve[currentWeapon] <= 0) {
        showMsg('❌ فشنگ ذخیره نداری!', 1);
        return;
    }
    reloading = true;
    reloadStartTime = performance.now() / 1000;
    reloadDuration = w.reloadTime;
    const rm = document.getElementById('reloadMsg');
    rm.textContent = '🔄 در حال تعویض خشاب...';
    rm.style.opacity = 1;
}

function finishReload() {
    const w = WEAPONS[currentWeapon];
    const need = w.maxAmmo - ammo[currentWeapon];
    const take = Math.min(need, reserve[currentWeapon]);
    ammo[currentWeapon] += take;
    reserve[currentWeapon] -= take;
    reloading = false;
    document.getElementById('reloadMsg').style.opacity = 0;
    updateAmmoUI();
    updateReserveUI();
}

function updateAmmoUI() {
    const w = WEAPONS[currentWeapon];
    document.getElementById('ammo').textContent = `🔫 ${ammo[currentWeapon]}/${w.maxAmmo}`;

function shoot(now) {
    const w = WEAPONS[currentWeapon];

    if (reloading) return;
    if (ammo[currentWeapon] <= 0) { startReload(); return; }
    if (now - player.lastShot < w.fireRate) return;

    player.lastShot = now;
    ammo[currentWeapon]--;
    updateAmmoUI();

    triggerFlash();
    player.recoilOffset = 0.12 * (w.kick * 10);
    player.recoilPitch = w.kick;
    player.recoilRoll = (Math.random() - 0.5) * w.kick * 1.5;

    let baseDir;
    if (lockedEnemy && lockedEnemy.alive && !lockedEnemy.dying) {
        const ep = lockedEnemy.group.position.clone().add(new THREE.Vector3(0, 1.2, 0));
        baseDir = new THREE.Vector3().subVectors(ep, camera.position).normalize();
    } else {
        baseDir = new THREE.Vector3(0, 0, -1).applyEuler(
            new THREE.Euler(player.pitch, player.yaw, 0, 'YXZ')
        );
    }

    const pellets = w.pellets || 1;
    const hitEnemies = new Set();

    for (let p = 0; p < pellets; p++) {
        const dir = baseDir.clone();
        dir.x += (Math.random() - 0.5) * w.spread * 2;
        dir.y += (Math.random() - 0.5) * w.spread * 2;
        dir.z += (Math.random() - 0.5) * w.spread * 2;
        dir.normalize();

        const origin = camera.position.clone();
        let closestHit = null;
        let closestDist = Infinity;

        for (const enemy of enemies) {
            if (!enemy.alive || enemy.dying) continue;
            const ec = enemy.group.position.clone().add(new THREE.Vector3(0, 1.2, 0));
            const toE = new THREE.Vector3().subVectors(ec, origin);
            const proj = toE.dot(dir);
            if (proj < 0 || proj > w.range) continue;
            const cp = origin.clone().add(dir.clone().multiplyScalar(proj));
            const d = cp.distanceTo(ec);
            const hitR = currentWeapon === 'shotgun' ? 1.0 : 0.8;
            if (d < hitR && proj < closestDist) {
                closestDist = proj;
                closestHit = enemy;
            }
        }

        if (closestHit) {
            const hp = origin.clone().add(dir.clone().multiplyScalar(closestDist));
            spawnBulletVisual(origin, hp, 0xffff66);
            spawnBlood(hp);
            if (!hitEnemies.has(closestHit)) {
                hitEnemies.add(closestHit);
                closestHit.health -= w.damage;
                closestHit.hitTimer = 0.25;
                showHitmarker();
                if (closestHit.health <= 0 && !closestHit.dying) startDying(closestHit);
            }
        } else {
            let endPoint = origin.clone().add(dir.clone().multiplyScalar(w.range));
            for (let t = 0; t < w.range; t += 2) {
                const pt = origin.clone().add(dir.clone().multiplyScalar(t));
                if (pt.y < groundHeight(pt.x, pt.z)) { endPoint = pt; break; }
                if (Math.abs(pt.x) > 150 || Math.abs(pt.z) > 150) { endPoint = pt; break; }
            }
            spawnBulletVisual(origin, endPoint, 0xffff66);
        }
    }
}

function updateAutoLock(dt) {
    if (lockBreakCooldown > 0) {
        lockBreakCooldown -= dt;
        lockedEnemy = null;
        lockIndicator.style.display = 'none';
        lockText.style.display = 'none';
        return;
    }

    if (lockedEnemy) {
        if (!lockedEnemy.alive || lockedEnemy.dying) {
            lockedEnemy = null;
            lockIndicator.style.display = 'none';
            lockText.style.display = 'none';
            return;
        }
    }

    if (!lockedEnemy) {
        let bestEnemy = null;
        let bestScore = Infinity;
        const camDir = new THREE.Vector3(0, 0, -1).applyEuler(
            new THREE.Euler(player.pitch, player.yaw, 0, 'YXZ')
        );

        for (const enemy of enemies) {
            if (!enemy.alive || enemy.dying) continue;
            const ep = enemy.group.position.clone().add(new THREE.Vector3(0, 1.2, 0));
            const toEnemy = new THREE.Vector3().subVectors(ep, camera.position);
            const dist = toEnemy.length();
            if (dist > LOCK_RANGE) continue;
            toEnemy.normalize();
            const dot = toEnemy.dot(camDir);
            if (dot < Math.cos(LOCK_ANGLE_THRESHOLD)) continue;
            const score = dist * (2 - dot);
            if (score < bestScore) { bestScore = score; bestEnemy = enemy; }
        }

        if (bestEnemy) lockedEnemy = bestEnemy;
    }

    if (lockedEnemy) {
        const ep = lockedEnemy.group.position.clone().add(new THREE.Vector3(0, 1.2, 0));
        const toEnemy = new THREE.Vector3().subVectors(ep, camera.position).normalize();
        const targetYaw = Math.atan2(-toEnemy.x, -toEnemy.z);
        const targetPitch = Math.asin(toEnemy.y);
        const lerpSpeed = 5 * dt;

        let yawDiff = targetYaw - player.yaw;
        while (yawDiff > Math.PI) yawDiff -= Math.PI * 2;
        while (yawDiff < -Math.PI) yawDiff += Math.PI * 2;
        player.yaw += yawDiff * lerpSpeed;
        player.pitch += (targetPitch - player.pitch) * lerpSpeed;

        const screenPos = ep.clone().project(camera);
        const sx = (screenPos.x * 0.5 + 0.5) * innerWidth;
        const sy = (-screenPos.y * 0.5 + 0.5) * innerHeight;

        if (screenPos.z < 1) {
            lockIndicator.style.display = 'block';
            lockIndicator.style.left = (sx - 30) + 'px';
            lockIndicator.style.top = (sy - 30) + 'px';
            lockText.style.display = 'block';
            lockText.style.left = (sx - 20) + 'px';
            lockText.style.top = (sy - 55) + 'px';
        } else {
            lockIndicator.style.display = 'none';
            lockText.style.display = 'none';
        }
    }
}

function updateEnemies(dt, now) {
    for (const enemy of enemies) {
        if (enemy.dying) {
            enemy.dyingTimer += dt;
            if (enemy.dyingTimer < 0.6) {
                const t = enemy.dyingTimer / 0.6;
                enemy.group.rotation.x = -Math.PI / 2 * t;
                enemy.group.position.y = enemy.baseY + 0.3 * (1 - t);
            } else if (enemy.dyingTimer >= 3 && enemy.dyingTimer < 4.5) {
                enemy.group.traverse(o => {
                    if (o.material && o.material.opacity !== undefined) {
                        o.material.transparent = true;
                        o.material.opacity = Math.max(0, 1 - (enemy.dyingTimer - 3) / 1.5);
                    }
                });
            } else if (enemy.dyingTimer >= 4.5) {
                scene.remove(enemy.group);
                enemy.dying = false;
            }
            continue;
        }

        if (!enemy.alive) continue;

        if (enemy.hitTimer > 0) {
            enemy.hitTimer -= dt;
            enemy.group.rotation.z = Math.sin(now * 50) * 0.15;
            enemy.group.scale.setScalar(1 + Math.sin(now * 40) * 0.05);
        } else {
            enemy.group.rotation.z *= 0.9;
            enemy.group.scale.setScalar(1);
        }

        const ep = enemy.group.position;
        const toP = new THREE.Vector3().subVectors(player.pos, ep);
        toP.y = 0;
        const dist = toP.length();
        toP.normalize();

        const ta = Math.atan2(toP.x, toP.z);
        let ad = ta - enemy.group.rotation.y;
        while (ad > Math.PI) ad -= Math.PI * 2;
        while (ad < -Math.PI) ad += Math.PI * 2;
        enemy.group.rotation.y += ad * dt * 3;

        const maxR = enemy.hasGun ? 15 : 1.5;

        if (dist > maxR) {
            const ms = enemy.speed * dt;
            const nx = ep.x + toP.x * ms;
            const nz = ep.z + toP.z * ms;
            let blocked = false;
            for (const c of covers) {
                const dx = nx - c.mesh.position.x;
                const dz = nz - c.mesh.position.z;
                if (Math.abs(dx) < c.w / 2 + 0.5 && Math.abs(dz) < c.d / 2 + 0.5) {
                    blocked = true;
                    break;
                }
            }
            if (!blocked) {
                ep.x = nx;
                ep.z = nz;
                ep.y = groundHeight(nx, nz);
            }
            const legL = enemy.group.getObjectByName('leftLeg');
            const legR = enemy.group.getObjectByName('rightLeg');
            if (legL && legR) {
                legL.rotation.x = Math.sin(now * 10) * 0.4;
                legR.rotation.x = -Math.sin(now * 10) * 0.4;
            }
        }

        if (enemy.hasGun && dist < 25 && dist > 2) {
            if (now - enemy.lastAttack > enemy.gunCooldown) {
                enemy.lastAttack = now;
                enemy.gunCooldown = 1.5 + Math.random() * 1.5;
                if (Math.random() < 0.65) {
                    player.health--;
                    updateHealthUI();
                    showDamageOverlay();
                    const s = ep.clone().add(new THREE.Vector3(0, 1.3, 0));
                    spawnBulletVisual(s, camera.position.clone(), 0xff3300);
                }
            }
        } else if (dist < 2 && now - enemy.lastAttack > 1) {
            enemy.lastAttack = now;
            player.health--;
            updateHealthUI();
            showDamageOverlay();
        }
    }
}

function updateAllies(dt, now) {
    for (const ally of allies) {
        if (!ally.alive) continue;
        const ap = ally.group.position;
        let target = null;
        let minD = Infinity;

        for (const enemy of enemies) {
            if (!enemy.alive || enemy.dying) continue;
            const d = ap.distanceTo(enemy.group.position);
            if (d < minD) { minD = d; target = enemy; }
        }

        let moveTarget;
        if (target && minD < 30) {
            moveTarget = target.group.position.clone();
            moveTarget.x += 8;
        } else {
            moveTarget = player.pos.clone().add(ally.followOffset);
        }

        const toT = new THREE.Vector3().subVectors(moveTarget, ap);
        toT.y = 0;
        const d = toT.length();

        if (d > 3) {
            toT.normalize();
            const ms = ally.speed * dt;
            const nx = ap.x + toT.x * ms;
            const nz = ap.z + toT.z * ms;
            let blocked = false;
            for (const c of covers) {
                const ddx = nx - c.mesh.position.x;
                const ddz = nz - c.mesh.position.z;
                if (Math.abs(ddx) < c.w / 2 + 0.5 && Math.abs(ddz) < c.d / 2 + 0.5) {
                    blocked = true;
                    break;
                }
            }
            if (!blocked) {
                ap.x = nx;
                ap.z = nz;
                ap.y = groundHeight(nx, nz);
            }
            const legL = ally.group.getObjectByName('leftLeg');
            const legR = ally.group.getObjectByName('rightLeg');
            if (legL && legR) {
                legL.rotation.x = Math.sin(now * 10) * 0.4;
                legR.rotation.x = -Math.sin(now * 10) * 0.4;
            }
        }

        if (target) {
            const toE = new THREE.Vector3().subVectors(target.group.position, ap);
            toE.y = 0;
            const ta = Math.atan2(toE.x, toE.z);
            let ad = ta - ally.group.rotation.y;
            while (ad > Math.PI) ad -= Math.PI * 2;
            while (ad < -Math.PI) ad += Math.PI * 2;
            ally.group.rotation.y += ad * dt * 5;

            if (minD < 30 && now - ally.lastAttack > ally.gunCooldown) {
                ally.lastAttack = now;
                ally.gunCooldown = 0.8 + Math.random() * 1.2;
                if (Math.random() < 0.7) {
                    const s = ap.clone().add(new THREE.Vector3(0, 1.3, 0));
                    spawnBulletVisual(
                        s,
                        target.group.position.clone().add(new THREE.Vector3(0, 1.2, 0)),
                        0x00ff00
                    );
                    target.health -= 25;
                    target.hitTimer = 0.25;
                    if (target.health <= 0 && !target.dying) startDying(target);
                }
            }
        }
    }
}

const WEAPON_BASE_POS_Y = -0.35;

function updatePlayer(dt) {
    if (reloading) {
        const elapsed = performance.now() / 1000 - reloadStartTime;
        const progress = Math.min(1, elapsed / reloadDuration);
        const dip = Math.sin(progress * Math.PI);
        weaponGroup.position.y = WEAPON_BASE_POS_Y - 0.3 * dip;
        weaponGroup.rotation.z = Math.sin(progress * Math.PI * 4) * 0.1;
        if (progress >= 1) {
            finishReload();
            weaponGroup.rotation.z = 0;
        }
    }

    if (isJumping) {
        jumpVelocity -= GRAVITY * dt;
        jumpHeight += jumpVelocity * dt;
        if (jumpHeight <= 0) {
            jumpHeight = 0;
            jumpVelocity = 0;
            isJumping = false;
        }
    }

    if (!canJump) {
        jumpCooldown += dt;
        if (jumpCooldown > 0.3) canJump = true;
    }

    const fwd = new THREE.Vector3(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
    const right = new THREE.Vector3(Math.cos(player.yaw), 0, -Math.sin(player.yaw));

    let move = new THREE.Vector3();
    if (joyActive && (Math.abs(joyX) > 0.1 || Math.abs(joyY) > 0.1)) {
        move.add(fwd.clone().multiplyScalar(-joyY));
        move.add(right.clone().multiplyScalar(joyX));
    }
    if (keysDown['KeyW']) move.add(fwd);
    if (keysDown['KeyS']) move.sub(fwd);
    if (keysDown['KeyD']) move.add(right);
    if (keysDown['KeyA']) move.sub(right);

    const moving = move.length() > 0;
    if (moving) {
        move.normalize();
        const speed = player.speed * dt;
        let nx = player.pos.x + move.x * speed;
        let nz = player.pos.z + move.z * speed;
        for (const c of covers) {
            const dx = nx - c.mesh.position.x;
            const dz = nz - c.mesh.position.z;
            if (Math.abs(dx) < c.w / 2 + 0.4 && Math.abs(dz) < c.d / 2 + 0.4) {
                if (Math.abs(dx) > Math.abs(dz)) nx = player.pos.x;
                else nz = player.pos.z;
            }
        }
        nx = Math.max(-140, Math.min(140, nx));
        nz = Math.max(-140, Math.min(140, nz));
        player.pos.x = nx;
        player.pos.z = nz;
        player.bobTime += dt * 12;
    } else {
        player.bobTime *= 0.95;
    }

    player.pos.y = groundHeight(player.pos.x, player.pos.z) + player.height + jumpHeight;

    const w = WEAPONS[currentWeapon];
    const targetFov = player.zooming ? 75 / w.zoom : 75;
    camera.fov += (targetFov - camera.fov) * Math.min(1, dt * 12);
    camera.updateProjectionMatrix();

    if (player.recoilPitch > 0.0001) {
        player.recoilPitch *= 0.82;
        player.recoilRoll *= 0.82;
    } else {
        player.recoilPitch = 0;
        player.recoilRoll = 0;
    }
}

function updateWeaponSway(dt) {
    const bobX = Math.sin(player.bobTime) * 0.008;
    const bobY = Math.abs(Math.cos(player.bobTime)) * 0.012;
    const isMoving = joyActive || keysDown['KeyW'] || keysDown['KeyA'] ||
                     keysDown['KeyS'] || keysDown['KeyD'];
    const tbx = isMoving ? bobX : 0;
    const tby = isMoving ? bobY : 0;
    const zf = camera.fov / 75;
    const bx = 0.35 * (0.4 + zf * 0.6);
    const by = WEAPON_BASE_POS_Y * (0.4 + zf * 0.6);
    const bz = -0.7;
    const rb = player.recoilOffset;
    const ru = player.recoilOffset * 0.6;
    if (player.recoilOffset > 0.001) player.recoilOffset *= 0.78;
    else player.recoilOffset = 0;
    if (!reloading) {
        weaponGroup.position.x += (bx + tbx - weaponGroup.position.x) * Math.min(1, dt * 15);
        weaponGroup.position.y += (by + tby + ru - weaponGroup.position.y) * Math.min(1, dt * 20);
        weaponGroup.position.z += (bz + rb - weaponGroup.position.z) * Math.min(1, dt * 20);
    }
    weaponGroup.rotation.x = -player.recoilOffset * 3;
    weaponGroup.rotation.z = player.recoilRoll * 2;
}

function drawRadar() {
    if (!radarCtx) return;
    const w = radarCanvas.width;
    const h = radarCanvas.height;
    const cx = w / 2;
    const cy = h / 2;
    const radius = w / 2 - 5;

    radarCtx.clearRect(0, 0, w, h);

    radarCtx.beginPath();
    radarCtx.arc(cx, cy, radius, 0, Math.PI * 2);
    radarCtx.fillStyle = 'rgba(0, 30, 0, 0.9)';
    radarCtx.fill();

    radarCtx.strokeStyle = 'rgba(0, 255, 0, 0.3)';
    radarCtx.lineWidth = 1;

    for (let i = 1; i <= 3; i++) {
        radarCtx.beginPath();
        radarCtx.arc(cx, cy, radius * i / 3, 0, Math.PI * 2);
        radarCtx.stroke();
    }

    radarCtx.beginPath();
    radarCtx.moveTo(cx, cy - radius);
    radarCtx.lineTo(cx, cy + radius);
    radarCtx.moveTo(cx - radius, cy);
    radarCtx.lineTo(cx + radius, cy);
    radarCtx.stroke();

    radarCtx.save();
    radarCtx.beginPath();
    radarCtx.arc(cx, cy, radius, 0, Math.PI * 2);
    radarCtx.clip();

    const rot = -player.yaw - Math.PI / 2;

    function worldToRadar(wx, wz) {
        const dx = wx - player.pos.x;
        const dz = wz - player.pos.z;
        const rx = dx * Math.cos(rot) - dz * Math.sin(rot);
        const rz = dx * Math.sin(rot) + dz * Math.cos(rot);
        const px = cx + rx * RADAR_SCALE;
        const py = cy + rz * RADAR_SCALE;
        return { x: px, y: py, dist: Math.sqrt(dx * dx + dz * dz) };
    }

    for (const p of pickups) {
        const rp = worldToRadar(p.mesh.position.x, p.mesh.position.z);
        if (rp.dist > RADAR_RANGE) continue;
        radarCtx.beginPath();
        radarCtx.arc(rp.x, rp.y, 3, 0, Math.PI * 2);
        radarCtx.fillStyle = p.type === 'health' ? '#ff4444' : '#44ff44';
        radarCtx.fill();
    }

    for (const ally of allies) {
        if (!ally.alive) continue;
        const rp = worldToRadar(ally.group.position.x, ally.group.position.z);
        if (rp.dist > RADAR_RANGE) continue;
        radarCtx.beginPath();
        radarCtx.arc(rp.x, rp.y, 4, 0, Math.PI * 2);
        radarCtx.fillStyle = '#00ff88';
        radarCtx.fill();
    }

    for (const enemy of enemies) {
        if (!enemy.alive || enemy.dying) continue;
        const rp = worldToRadar(enemy.group.position.x, enemy.group.position.z);
        if (rp.dist > RADAR_RANGE) continue;
        radarCtx.beginPath();
        radarCtx.arc(rp.x, rp.y, 4, 0, Math.PI * 2);
        radarCtx.fillStyle = '#ff2222';
        radarCtx.fill();
        radarCtx.beginPath();
        radarCtx.arc(rp.x, rp.y, 7, 0, Math.PI * 2);
        radarCtx.strokeStyle = 'rgba(255, 50, 50, 0.6)';
        radarCtx.lineWidth = 2;
        radarCtx.stroke();
    }

    radarCtx.save();
    radarCtx.translate(cx, cy);
    radarCtx.beginPath();
    radarCtx.moveTo(0, -7);
    radarCtx.lineTo(-5, 5);
    radarCtx.lineTo(5, 5);
    radarCtx.closePath();
    radarCtx.fillStyle = '#ffffff';
    radarCtx.fill();
    radarCtx.strokeStyle = '#00ff00';
    radarCtx.lineWidth = 2;
    radarCtx.stroke();
    radarCtx.restore();

    radarCtx.restore();

    radarCtx.beginPath();
    radarCtx.arc(cx, cy, radius, 0, Math.PI * 2);
    radarCtx.strokeStyle = 'rgba(0, 255, 0, 0.8)';
    radarCtx.lineWidth = 2;
    radarCtx.stroke();
}

function updatePickups(dt) {
    for (let i = pickups.length - 1; i >= 0; i--) {
        const p = pickups[i];
        p.bob += dt * 3;
        p.mesh.position.y = groundHeight(p.mesh.position.x, p.mesh.position.z) +
                            1 + Math.sin(p.bob) * 0.2;
        p.mesh.rotation.y += dt;
        const dx = p.mesh.position.x - player.pos.x;
        const dz = p.mesh.position.z - player.pos.z;
        if (dx * dx + dz * dz < 4) {
            if (p.type === 'ammo') {
                for (const k in ammo) ammo[k] = WEAPONS[k].maxAmmo;
                for (const k in reserve) reserve[k] = WEAPONS[k].reserveMax;
                updateAmmoUI();
                updateReserveUI();
                showMsg('🔫 مهمات پر شد!', 1);
            } else if (p.type === 'health') {
                player.health = Math.min(player.maxHealth, player.health + 3);
                updateHealthUI();
                showMsg('❤️ جان +3', 1);
            }
            scene.remove(p.mesh);
            pickups.splice(i, 1);
        }
    }
}

function updateBullets(dt) {
    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.traveled += b.speed * dt;
        b.mesh.position.copy(b.startPos).add(b.dir.clone().multiplyScalar(b.traveled));
        if (b.traveled > b.maxDist) {
            scene.remove(b.mesh);
            bullets.splice(i, 1);
        }
    }
}

function startLevel(levelIndex) {
    currentLevel = levelIndex;
    const L = LEVELS[levelIndex];
    buildWorld(L);

    enemies.forEach(e => scene.remove(e.group));
    allies.forEach(a => scene.remove(a.group));
    enemies = [];
    allies = [];

    for (let i = 0; i < L.enemies; i++) {
        const a = Math.random() * Math.PI * 2;
        const r = 25 + Math.random() * 60;
        const hasGun = Math.random() < L.gunner;
        createEnemy(Math.cos(a) * r, Math.sin(a) * r, hasGun, L.speed);
    }
    enemiesRemaining = L.enemies;
    updateEnemyCountUI();

    for (let i = 0; i < L.allies; i++) {
        const a = (i / L.allies) * Math.PI * 2;
        const r = 5;
        createAlly(player.pos.x + Math.cos(a) * r, player.pos.z + Math.sin(a) * r);
    }
    updateAllyCountUI();

    player.pos.set(0, 0, 0);
    player.yaw = 0;
    player.pitch = 0;
    player.health = player.maxHealth;
    updateHealthUI();

    for (const k in ammo) ammo[k] = WEAPONS[k].maxAmmo;
    for (const k in reserve) reserve[k] = WEAPONS[k].reserveMax;
    updateAmmoUI();
    updateReserveUI();

    grenadeCount = 3;
    updateGrenadeUI();

    isJumping = false;
    jumpHeight = 0;
    jumpVelocity = 0;
    canJump = true;
    jumpCooldown = 0;

    lockedEnemy = null;
    lockBreakCooldown = 0;
    lookDragDistance = 0;
    lockIndicator.style.display = 'none';
    lockText.style.display = 'none';

    reloading = false;
    document.getElementById('reloadMsg').style.opacity = 0;

    pickups.forEach(p => scene.remove(p.mesh));
    pickups = [];
    buildPickups();

    grenades.forEach(g => scene.remove(g.mesh));
    grenades = [];
    explosionParticles.forEach(p => scene.remove(p.mesh));
    explosionParticles = [];
    bullets.forEach(b => scene.remove(b.mesh));
    bullets = [];
    bloodParticles.forEach(b => scene.remove(b.mesh));
    bloodParticles = [];

    if (player.zooming) {
        player.zooming = false;
        scopeOverlay.style.display = 'none';
    }

    updateLevelUI();
    showMsg(`🎯 مرحله ${levelIndex + 1}: ${L.emoji} ${L.name}`, 2.5);
}

let gameOver = false;
let running = false;
let clockLast = performance.now();

function resetGame(startFromLevel = 0) {
    enemies.forEach(e => scene.remove(e.group));
    allies.forEach(a => scene.remove(a.group));
    pickups.forEach(p => scene.remove(p.mesh));
    bullets.forEach(b => scene.remove(b.mesh));
    grenades.forEach(g => scene.remove(g.mesh));
    explosionParticles.forEach(p => scene.remove(p.mesh));
    bloodParticles.forEach(b => scene.remove(b.mesh));
    enemies = []; allies = []; pickups = []; bullets = [];
    grenades = []; explosionParticles = []; bloodParticles = [];

    gameOver = false;
    firing = false;
    joyActive = false;
    joyX = 0; joyY = 0;
    joyKnob.style.transform = 'translate(-50%,-50%)';

    currentWeapon = 'pistol';
    showWeaponModel('pistol');
    updateMuzzlePos();
    document.getElementById('weapon').textContent = WEAPONS.pistol.name;
    document.querySelectorAll('.wbtn').forEach(b => {
        b.classList.toggle('active', b.dataset.w === 'pistol');
    });

    player.zooming = false;
    scopeOverlay.style.display = 'none';
    lockedEnemy = null;
    lockBreakCooldown = 0;
    lookDragDistance = 0;
    lockIndicator.style.display = 'none';
    lockText.style.display = 'none';

    startLevel(startFromLevel);
}

const menuScreen = document.getElementById('menuScreen');
const levelGrid = document.getElementById('levelGrid');
const gameOverScreen = document.getElementById('gameOverScreen');
const backToMenuBtn = document.getElementById('backToMenuBtn');
const gameOverTitle = document.getElementById('gameOverTitle');
const gameOverMsg = document.getElementById('gameOverMsg');
const startFromOneBtn = document.getElementById('startFromOneBtn');

function buildMenu() {
    levelGrid.innerHTML = '';
    for (let i = 0; i < LEVELS.length; i++) {
        const L = LEVELS[i];
        const btn = document.createElement('div');
        btn.className = 'lvlBtn' + (i > unlockedLevel ? ' locked' : '');
        const stars = levelStars[i] || 0;
        const starsStr = stars > 0 ? ('★'.repeat(stars) + '☆'.repeat(3 - stars)) : '';
        btn.innerHTML = `
            <span class="num">${i + 1}</span>
            <span class="name">${L.emoji} ${L.name}</span>
            <span class="stars">${starsStr}</span>
        `;
        if (i <= unlockedLevel) {
            btn.addEventListener('click', () => startGameFromLevel(i));
            btn.addEventListener('touchend', e => {
                e.preventDefault(); e.stopPropagation();
                startGameFromLevel(i);
            }, { passive: false });
        }
        levelGrid.appendChild(btn);
    }
}

function startGameFromLevel(idx) {
    menuScreen.style.display = 'none';
    gameOverScreen.style.display = 'none';
    resetGame(idx);
    running = true;
    clockLast = performance.now();
}

function showMenu() {
    running = false;
    gameOver = false;
    menuScreen.style.display = 'flex';
    buildMenu();
    gameOverScreen.style.display = 'none';
}

function endGame(won) {
    gameOver = true;
    running = false;
    if (won) {
        const stars = player.health >= player.maxHealth ? 3 : 1;
        if (stars > levelStars[currentLevel]) {
            levelStars[currentLevel] = stars;
            try { localStorage.setItem('meydanStars15', JSON.stringify(levelStars)); } catch (e) {}
        }
        if (currentLevel === unlockedLevel && currentLevel < LEVELS.length - 1) {
            unlockedLevel = currentLevel + 1;
            try { localStorage.setItem('meydanUnlocked15', unlockedLevel); } catch (e) {}
        }
        gameOverScreen.classList.add('win');
        gameOverScreen.classList.remove('lose');
        gameOverTitle.textContent = '🏆 بردی!';
        gameOverMsg.textContent = stars === 3 ? '⭐⭐⭐ عالی!' : '⭐ خوب بود!';
    } else {
        gameOverScreen.classList.add('lose');
        gameOverScreen.classList.remove('win');
        gameOverTitle.textContent = '💀 باختی!';
        gameOverMsg.textContent = `مرحله ${currentLevel + 1}`;
    }
    gameOverScreen.style.display = 'flex';
}

backToMenuBtn.addEventListener('click', () => {
    gameOverScreen.style.display = 'none';
    showMenu();
});

backToMenuBtn.addEventListener('touchend', e => {
    e.preventDefault(); e.stopPropagation();
    gameOverScreen.style.display = 'none';
    showMenu();
}, { passive: false });

startFromOneBtn.addEventListener('click', () => {
    startGameFromLevel(0);
});

startFromOneBtn.addEventListener('touchend', e => {
    e.preventDefault(); e.stopPropagation();
    startGameFromLevel(0);
}, { passive: false });

function animate() {
    requestAnimationFrame(animate);
    const now = performance.now() / 1000;
    const dt = Math.min(0.05, (performance.now() - clockLast) / 1000);
    clockLast = performance.now();

    updateFlash(dt);
    updateWeaponSway(dt);
    updateBlood(dt);
    updateAutoLock(dt);
    drawRadar();

    if (running && !gameOver) {
        if (firing) {
            const w = WEAPONS[currentWeapon];
            if (w.auto || now - player.lastShot > w.fireRate) shoot(now);
        }
        updatePlayer(dt);
        updateEnemies(dt, now);
        updateAllies(dt, now);
        updatePickups(dt);
        updateBullets(dt);
        updateGrenades(dt);

        const bobY = Math.sin(player.bobTime * 2) * 0.04;
        camera.position.copy(player.pos);
        camera.position.y += bobY;
        camera.rotation.order = 'YXZ';
        camera.rotation.y = player.yaw;
        camera.rotation.x = player.pitch + player.recoilPitch;
        camera.rotation.z = player.recoilRoll;

        if (player.health <= 0) {
            endGame(false);
        } else if (enemiesRemaining <= 0) {
            endGame(true);
        }
    }

    if (msgTimer > 0 && msgTimer < 100) {
        msgTimer -= dt;
        if (msgTimer <= 0) document.getElementById('msg').style.opacity = 0;
    }

    renderer.render(scene, camera);
}

addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
});

updateAmmoUI();
updateHealthUI();
updateEnemyCountUI();
updateAllyCountUI();
updateGrenadeUI();
updateLevelUI();
showWeaponModel('pistol');
updateMuzzlePos();
buildMenu();
animate();
</script>
</body>
</html>
