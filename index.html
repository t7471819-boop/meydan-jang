<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>⚔️ جنگ‌آور | JangAvar</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- چرخش گوشی -->
<div id="rotateScreen">
  <div class="rot-icon">📱</div>
  <div class="rot-title">لطفاً گوشی را افقی بگیرید</div>
  <div class="rot-arrow">↻</div>
</div>

<!-- منوی اصلی -->
<div id="menu" class="screen active">
  <div class="top-coins">💰 <span id="menuCoins">5,000</span></div>
  <div class="title-wrap">
    <h1 class="title">⚔️ جنگ‌آور ⚔️</h1>
    <p class="subtitle">نبرد نهایی</p>
  </div>
  <div class="menu-buttons">
    <button class="btn primary" id="btnStart">🎯 شروع بازی</button>
    <button class="btn gold" id="btnShop">⚡ فروشگاه</button>
    <button class="btn red" id="btnReset">🔄 ریست</button>
  </div>
</div>

<!-- مراحل -->
<div id="levels" class="screen">
  <button class="back-btn" id="btnBackLevels">← بازگشت</button>
  <h2>🗺️ مراحل</h2>
  <div class="level-grid" id="levelGrid"></div>
</div>

<!-- فروشگاه -->
<div id="shop" class="screen">
  <button class="back-btn" id="btnBackShop">← بازگشت</button>
  <h2>🛒 فروشگاه</h2>
  <div class="shop-tabs">
    <button class="tab active" data-tab="weapons">🔫 سلاح‌ها</button>
    <button class="tab" data-tab="upgrades">⬆️ ارتقاء</button>
    <button class="tab" data-tab="items">🎒 آیتم‌ها</button>
  </div>
  <div class="shop-content" id="shopContent"></div>
</div>

<!-- HUD -->
<div id="hud">
  <canvas id="radarCanvas" width="220" height="220"></canvas>
  <div id="topRight">
    <div class="hud-pill">💰 <span id="hudCoins">0</span></div>
    <div class="hud-pill">🎯 مرحله <span id="hudLevel">1</span></div>
    <div class="hud-pill">☠️ <span id="hudEnemies">0</span></div>
    <div id="hpBar"><div id="hpFill"></div><span id="hpText">20/20</span></div>
  </div>
  <div id="killFeed"></div>
  <div id="weaponHud">
    <div class="weapon-name" id="weaponName">کلت</div>
    <div class="ammo-line">
      <span class="ammo" id="ammoCur">12</span> /
      <span class="ammo-res" id="ammoRes">4</span>
    </div>
  </div>
  <div id="crosshair"></div>
  <div id="scope">
    <div id="scopeRing"></div>
  </div>
</div>

<!-- کنترل موبایل -->
<div id="controls">
  <div id="joystick"><div id="joystickKnob"></div></div>
  <div id="lookPad"></div>
  <div class="action-btn" id="btnFire">🔥</div>
  <div class="action-btn small" id="btnJump">⬆️</div>
  <div class="action-btn small" id="btnCrouch">⬇️</div>
  <div class="action-btn small" id="btnZoom">🔭</div>
  <div class="action-btn small" id="btnReload">🔄</div>
</div>

<!-- منوی توقف -->
<div id="pauseMenu">
  <div class="pause-box">
    <h2>⏸️ توقف</h2>
    <button class="btn" id="btnResume">▶️ ادامه</button>
    <button class="btn red" id="btnQuit">🏠 منو</button>
  </div>
</div>

<!-- اعلان -->
<div id="notif"></div>
<div id="hitMarker">✕</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>
<script type="module" src="game.js"></script>
</body>
</html>
