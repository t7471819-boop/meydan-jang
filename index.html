<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mini Minecraft Mobile - Full</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #000; touch-action: none;
      font-family: sans-serif; user-select: none;
    }
    canvas { display: block; }

    #rotate {
      position: fixed; inset: 0; background: #111; color: #fff;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; z-index: 9999; text-align: center;
      font-size: 20px; gap: 20px;
    }
    #rotate .icon { font-size: 80px; animation: spin 2s infinite; }
    @keyframes spin { 0%,100% { transform: rotate(0); } 50% { transform: rotate(90deg); } }
    @media (orientation: landscape) { #rotate { display: none; } }

    #crosshair {
      position: fixed; top: 50%; left: 50%;
      width: 24px; height: 24px; margin: -12px 0 0 -12px;
      pointer-events: none; z-index: 10;
    }
    #crosshair::before, #crosshair::after {
      content: ''; position: absolute; background: rgba(255,255,255,0.9);
      box-shadow: 0 0 2px #000;
    }
    #crosshair::before { left: 50%; top: 0; width: 2px; height: 100%; margin-left: -1px; }
    #crosshair::after  { top: 50%; left: 0; height: 2px; width: 100%; margin-top: -1px; }

    #joy {
      position: fixed; left: 20px; bottom: 20px;
      width: 130px; height: 130px; border-radius: 50%;
      background: rgba(255,255,255,0.12); border: 2px solid rgba(255,255,255,0.3);
      z-index: 20; touch-action: none;
    }
    #joyKnob {
      position: absolute; left: 50%; top: 50%;
      width: 55px; height: 55px; margin: -27.5px 0 0 -27.5px;
      border-radius: 50%; background: rgba(255,255,255,0.5);
      border: 2px solid rgba(255,255,255,0.8);
    }

    #buttons {
      position: fixed; right: 20px; bottom: 20px;
      display: grid; grid-template-columns: 70px 70px;
      grid-template-rows: 70px 70px; gap: 12px; z-index: 20;
    }
    .btn {
      border-radius: 50%; background: rgba(255,255,255,0.18);
      border: 2px solid rgba(255,255,255,0.4);
      color: white; font-size: 28px; display: flex;
      align-items: center; justify-content: center;
      touch-action: none; user-select: none;
    }
    .btn:active { background: rgba(255,255,255,0.35); }
    #jumpBtn { grid-column: 2; grid-row: 1; font-size: 22px; }
    #placeBtn { grid-column: 2; grid-row: 2; }
    #breakBtn { grid-column: 1; grid-row: 2; }

    /* نوار انتخاب ابزار */
    #toolbar {
      position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%);
      display: flex; gap: 8px; z-index: 20;
    }
    .tool {
      width: 52px; height: 52px; border-radius: 12px;
      background: rgba(0,0,0,0.45); border: 2px solid rgba(255,255,255,0.3);
      color: white; font-size: 26px; display: flex;
      align-items: center; justify-content: center;
      touch-action: none; position: relative;
    }
    .tool.active {
      border-color: #ffd54f; background: rgba(255,213,79,0.35);
      box-shadow: 0 0 12px #ffd54f;
    }
    .tool .dur {
      position: absolute; bottom: -6px; left: 4px; right: 4px;
      height: 5px; border-radius: 3px; background: #333; overflow: hidden;
    }
    .tool .dur > i {
      display: block; height: 100%; background: #4caf50; width: 100%;
    }

    /* HUD بالا */
    #hud {
      position: fixed; top: 8px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 12px; align-items: center;
      color: white; background: rgba(0,0,0,0.45);
      padding: 6px 14px; border-radius: 20px; font-size: 13px;
      z-index: 20; white-space: nowrap;
    }
    #hud .bar { width: 90px; height: 10px; background: #333; border-radius: 5px; overflow: hidden; }
    #hud .bar > i { display: block; height: 100%; transition: width 0.2s; }
    #hp > i { background: #e53935; }
    #food > i { background: #ffb300; }

    /* اینونتوری */
    #invBtn {
      position: fixed; top: 8px; right: 8px; z-index: 20;
      width: 46px; height: 46px; border-radius: 12px;
      background: rgba(0,0,0,0.55); border: 2px solid rgba(255,255,255,0.4);
      color: white; font-size: 22px; display: flex;
      align-items: center; justify-content: center;
    }
    #inventory {
      position: fixed; inset: 0; background: rgba(0,0,0,0.75);
      z-index: 200; display: none; align-items: center; justify-content: center;
      padding: 20px;
    }
    #inventory.open { display: flex; }
    #invPanel {
      background: rgba(30,30,30,0.95); border: 2px solid #666;
      border-radius: 16px; padding: 16px; max-width: 500px; width: 100%;
    }
    #invPanel h3 { color: #fff; text-align: center; margin-bottom: 12px; font-size: 16px; }
    #invGrid {
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px;
    }
    .slot {
      aspect-ratio: 1; border-radius: 10px; background: rgba(0,0,0,0.5);
      border: 2px solid #555; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      color: white; font-size: 22px; position: relative;
    }
    .slot.sel { border-color: #ffd54f; box-shadow: 0 0 8px #ffd54f; }
    .slot .count {
      position: absolute; bottom: 2px; right: 4px; font-size: 11px;
      background: rgba(0,0,0,0.7); padding: 0 4px; border-radius: 4px;
    }
    #invClose {
      margin-top: 14px; width: 100%; padding: 12px;
      background: #4caf50; border: none; border-radius: 10px;
      color: white; font-size: 16px; font-weight: bold;
    }

    #toast {
      position: fixed; top: 60px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.75); color: white;
      padding: 8px 16px; border-radius: 20px; font-size: 14px;
      z-index: 300; opacity: 0; transition: opacity 0.3s; pointer-events: none;
    }
    #toast.show { opacity: 1; }

    #start {
      position: fixed; inset: 0; background: rgba(0,0,0,0.9);
      color: white; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      z-index: 1000; text-align: center; padding: 20px;
    }
    #start button {
      padding: 14px 36px; font-size: 18px; border-radius: 12px;
      border: none; background: #4caf50; color: white; font-weight: bold;
    }
    #start p { font-size: 14px; line-height: 1.8; opacity: 0.85; max-width: 460px; }
    #start h2 { font-size: 22px; }
  </style>
</head>
<body>

<div id="rotate">
  <div class="icon">📱</div>
  <div>لطفاً گوشی را افقی بگیرید</div>
</div>

<div id="start">
  <h2>⛏️ Mini Minecraft Mobile</h2>
  <p>
    جوی‌استیک چپ = حرکت • کشیدن انگشت سمت راست = چرخش دوربین<br>
    ⛏️ کندن • ✋ گذاشتن • 🎒 اینونتوری • ⬆️ پرش<br>
    ابزار درست رو انتخاب کن (کلنگ برای سنگ، تبر برای چوب، دست برای خاک و برگ)
  </p>
  <button id="startBtn">شروع بازی</button>
</div>

<div id="crosshair"></div>

<div id="hud">
  <span>❤️ <span class="bar" id="hp"><i style="width:100%"></i></span></span>
  <span>🍗 <span class="bar" id="food"><i style="width:100%"></i></span></span>
  <span id="clockEl">☀️</span>
</div>

<div id="invBtn">🎒</div>

<div id="inventory">
  <div id="invPanel">
    <h3>اینونتوری — انتخاب برای گذاشتن</h3>
    <div id="invGrid"></div>
    <button id="invClose">بستن</button>
  </div>
</div>

<div id="toast"></div>

<div id="joy"><div id="joyKnob"></div></div>

<div id="buttons">
  <div class="btn" id="jumpBtn">⬆️</div>
  <div class="btn" id="breakBtn">⛏️</div>
  <div class="btn" id="placeBtn">✋</div>
</div>

<div id="toolbar">
  <div class="tool active" data-tool="hand">✋</div>
  <div class="tool" data-tool="pickaxe">⛏️<div class="dur"><i></i></div></div>
  <div class="tool" data-tool="axe">🪓<div class="dur"><i></i></div></div>
  <div class="tool" data-tool="sword">🗡️<div class="dur"><i></i></div></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// ============================================================
//  صحنه، دوربین، رندرر
// ============================================================
const scene = new THREE.Scene();
const SKY_DAY = new THREE.Color(0x87ceeb);
const SKY_NIGHT = new THREE.Color(0x0a0a2a);
scene.background = SKY_DAY.clone();
scene.fog = new THREE.Fog(SKY_DAY.clone(), 25, 90);

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 500);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// نور
const ambient = new THREE.AmbientLight(0xffffff, 0.7);
scene.add(ambient);
const sun = new THREE.DirectionalLight(0xffffff, 0.9);
sun.position.set(20, 40, 20);
scene.add(sun);

// ============================================================
//  موتور صدا (WebAudio، بدون فایل خارجی)
// ============================================================
const AC = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
function initAudio() { if (!audioCtx) audioCtx = new AC(); }
function beep(freq, dur, type = 'square', vol = 0.08) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type; osc.frequency.value = freq;
  gain.gain.value = vol;
  osc.connect(gain).connect(audioCtx.destination);
  osc.start();
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  osc.stop(audioCtx.currentTime + dur);
}
const SFX = {
  break_stone: () => beep(180, 0.15, 'square', 0.1),
  break_wood:  () => beep(240, 0.15, 'triangle', 0.08),
  break_soft:  () => beep(400, 0.1, 'sine', 0.06),
  place:       () => beep(600, 0.08, 'sine', 0.07),
  hit:         () => beep(120, 0.1, 'sawtooth', 0.1),
  jump:        () => beep(500, 0.08, 'sine', 0.05),
  eat:         () => beep(320, 0.12, 'sine', 0.08),
  tool_break:  () => { beep(150, 0.2, 'sawtooth', 0.12); setTimeout(()=>beep(90, 0.3, 'sawtooth', 0.1), 100); },
  hurt:        () => beep(90, 0.2, 'sawtooth', 0.15),
  craft:       () => { beep(700,0.08); setTimeout(()=>beep(900,0.08),80); }
};

// ============================================================
//  دنیای بلوکی
// ============================================================
const blockGeo = new THREE.BoxGeometry(1, 1, 1);
const MAT = {
  grass: new THREE.MeshLambertMaterial({ color: 0x4caf50 }),
  dirt:  new THREE.MeshLambertMaterial({ color: 0x8b5a2b }),
  stone: new THREE.MeshLambertMaterial({ color: 0x9e9e9e }),
  wood:  new THREE.MeshLambertMaterial({ color: 0x6d4c41 }),
  leaf:  new THREE.MeshLambertMaterial({ color: 0x2e7d32 }),
  sand:  new THREE.MeshLambertMaterial({ color: 0xede0b3 }),
  water: new THREE.MeshLambertMaterial({ color: 0x3a86ff, transparent: true, opacity: 0.75 }),
  plank: new THREE.MeshLambertMaterial({ color: 0xc59b6a }),
  coal:  new THREE.MeshLambertMaterial({ color: 0x333333 }),
  iron:  new THREE.MeshLambertMaterial({ color: 0xd8b48c }),
  gold:  new THREE.MeshLambertMaterial({ color: 0xffd54f }),
  diamond: new THREE.MeshLambertMaterial({ color: 0x4dd0e1 })
};

const ICON = {
  grass: '🟩', dirt: '🟫', stone: '⬜', wood: '🟫', leaf: '🟩',
  sand: '🟨', water: '🟦', plank: '🟧', coal: '⬛', iron: '🟫',
  gold: '🟨', diamond: '🔷'
};

const blocks = [];
const SIZE = 14;
const worldSeed = Math.random() * 1000;

function noise(x, z) {
  return Math.sin(x*0.35 + worldSeed)*Math.cos(z*0.35 + worldSeed)*2;
}

function addBlock(x, y, z, type, save = true) {
  const mat = MAT[type];
  if (!mat) return null;
  const b = new THREE.Mesh(blockGeo, mat);
  b.position.set(x, y, z);
  b.userData.type = type;
  scene.add(b);
  blocks.push(b);
  if (save) worldChanges.push({ x, y, z, type, op: 'add' });
  return b;
}

function removeBlock(b) {
  scene.remove(b);
  const i = blocks.indexOf(b);
  if (i >= 0) blocks.splice(i, 1);
  worldChanges.push({ x: b.position.x, y: b.position.y, z: b.position.z, op: 'remove' });
}

// تولید دنیا
let worldChanges = [];
function generateWorld() {
  for (let x = -SIZE; x <= SIZE; x++) {
    for (let z = -SIZE; z <= SIZE; z++) {
      const h = Math.floor(noise(x, z) + 2);
      for (let y = 0; y <= h; y++) {
        let type = 'stone';
        if (y === h) type = h <= 0 ? 'sand' : 'grass';
        else if (y > h - 2) type = 'dirt';

        // سنگ‌های معدنی
        if (y < h - 1 && Math.random() < 0.03) {
          const r = Math.random();
          if (r < 0.5) type = 'coal';
          else if (r < 0.8) type = 'iron';
          else if (r < 0.95) type = 'gold';
          else type = 'diamond';
        }

        addBlock(x, y, z, type, false);
      }
      // درخت
      if ((x*7 + z*13) % 23 === 0 && Math.abs(x) > 2 && Math.abs(z) > 2) {
        const base = h + 1;
        for (let i = 0; i < 4; i++) addBlock(x, base + i, z, 'wood', false);
        for (let dx = -2; dx <= 2; dx++)
          for (let dz = -2; dz <= 2; dz++)
            for (let dy = 0; dy < 2; dy++) {
              if (Math.abs(dx) + Math.abs(dz) + dy < 4)
                addBlock(x + dx, base + 3 + dy, z + dz, 'leaf', false);
            }
      }
    }
  }
}
generateWorld();

// ============================================================
//  بازیکن
// ============================================================
const player = {
  pos: new THREE.Vector3(0, 8, 10),
  vel: new THREE.Vector3(),
  yaw: 0, pitch: 0,
  hp: 100, food: 100,
  canJump: false,
  selectedPlace: 'grass', // بلوکی که با ✋ میذاره
  toolDurability: { pickaxe: 100, axe: 100, sword: 100 }
};

function updateCamera() {
  camera.position.copy(player.pos);
  camera.rotation.order = 'YXZ';
  camera.rotation.y = player.yaw;
  camera.rotation.x = player.pitch;
}
updateCamera();

// ============================================================
//  اینونتوری
// ============================================================
const inventory = {
  grass: 0, dirt: 0, stone: 0, wood: 0, leaf: 0,
  sand: 0, plank: 0, coal: 0, iron: 0, gold: 0, diamond: 0
};

const invGrid = document.getElementById('invGrid');
const inventoryEl = document.getElementById('inventory');

function renderInventory() {
  invGrid.innerHTML = '';
  for (const type of Object.keys(inventory)) {
    const div = document.createElement('div');
    div.className = 'slot' + (player.selectedPlace === type ? ' sel' : '');
    div.innerHTML = `${ICON[type]}<span class="count">${inventory[type]}</span>`;
    div.addEventListener('touchstart', e => {
      player.selectedPlace = type;
      renderInventory();
      SFX.craft();
      e.preventDefault();
    }, { passive: false });
    div.addEventListener('click', () => {
      player.selectedPlace = type;
      renderInventory();
    });
    invGrid.appendChild(div);
  }
}
renderInventory();

document.getElementById('invBtn').addEventListener('touchstart', e => {
  inventoryEl.classList.add('open');
  renderInventory();
  e.preventDefault();
}, { passive: false });
document.getElementById('invBtn').addEventListener('click', () => {
  inventoryEl.classList.add('open');
  renderInventory();
});
document.getElementById('invClose').addEventListener('click', () => {
  inventoryEl.classList.remove('open');
});

// ذخیره‌سازی
function saveWorld() {
  try {
    const data = {
      changes: worldChanges.slice(-3000),
      inventory,
      playerPos: { x: player.pos.x, y: player.pos.y, z: player.pos.z },
      yaw: player.yaw, pitch: player.pitch
    };
    localStorage.setItem('mcminiworld', JSON.stringify(data));
  } catch (e) { /* ignore */ }
}
function loadWorld() {
  try {
    const raw = localStorage.getItem('mcminiworld');
    if (!raw) return;
    const data = JSON.parse(raw);
    // پاک کردن دنیای قبلی
    for (const b of [...blocks]) scene.remove(b);
    blocks.length = 0;
    generateWorld();
    // اعمال تغییرات
    for (const c of data.changes || []) {
      if (c.op === 'remove') {
        const b = blocks.find(bb =>
          bb.position.x === c.x && bb.position.y === c.y && bb.position.z === c.z);
        if (b) { scene.remove(b); blocks.splice(blocks.indexOf(b), 1); }
      } else if (c.op === 'add') {
        addBlock(c.x, c.y, c.z, c.type, false);
      }
    }
    worldChanges = data.changes || [];
    Object.assign(inventory, data.inventory || {});
    if (data.playerPos) {
      player.pos.set(data.playerPos.x, data.playerPos.y, data.playerPos.z);
      player.yaw = data.yaw || 0;
      player.pitch = data.pitch || 0;
      updateCamera();
    }
    renderInventory();
    toast('دنیای قبلی لود شد 💾');
  } catch (e) { /* ignore */ }
}

function toast(msg, ms = 1500) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), ms);
}

// ============================================================
//  کنترل لمسی: چرخش دوربین
// ============================================================
let lookTouchId = null, lookStartX = 0, lookStartY = 0, lookStartYaw = 0, lookStartPitch = 0;
const LOOK_SENS = 0.004;

renderer.domElement.addEventListener('touchstart', e => {
  for (const t of e.changedTouches) {
    if (t.clientX > innerWidth * 0.35 && lookTouchId === null) {
      lookTouchId = t.identifier;
      lookStartX = t.clientX; lookStartY = t.clientY;
      lookStartYaw = player.yaw; lookStartPitch = player.pitch;
    }
  }
}, { passive: false });

renderer.domElement.addEventListener('touchmove', e => {
  for (const t of e.changedTouches) {
    if (t.identifier === lookTouchId) {
      const dx = t.clientX - lookStartX;
      const dy = t.clientY - lookStartY;
      player.yaw = lookStartYaw - dx * LOOK_SENS;
      player.pitch = lookStartPitch - dy * LOOK_SENS;
      player.pitch = Math.max(-Math.PI/2 + 0.05, Math.min(Math.PI/2 - 0.05, player.pitch));
      updateCamera();
    }
  }
  e.preventDefault();
}, { passive: false });

renderer.domElement.addEventListener('touchend', e => {
  for (const t of e.changedTouches) if (t.identifier === lookTouchId) lookTouchId = null;
});

// ============================================================
//  جوی‌استیک
// ============================================================
const joy = document.getElementById('joy');
const knob = document.getElementById('joyKnob');
let joyId = null, joyVec = { x: 0, y: 0 };
const JOY_RADIUS = 45;

function resetJoy() {
  joyId = null; joyVec.x = 0; joyVec.y = 0;
  knob.style.transform = 'translate(0,0)';
}
joy.addEventListener('touchstart', e => {
  joyId = e.changedTouches[0].identifier;
  e.preventDefault();
}, { passive: false });
joy.addEventListener('touchmove', e => {
  for (const t of e.changedTouches) {
    if (t.identifier === joyId) {
      const rect = joy.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      let dx = t.clientX - cx, dy = t.clientY - cy;
      const dist = Math.hypot(dx, dy);
      if (dist > JOY_RADIUS) { dx = dx/dist*JOY_RADIUS; dy = dy/dist*JOY_RADIUS; }
      joyVec.x = dx / JOY_RADIUS;
      joyVec.y = dy / JOY_RADIUS;
      knob.style.transform = `translate(${dx}px, ${dy}px)`;
    }
  }
  e.preventDefault();
}, { passive: false });
joy.addEventListener('touchend', e => {
  for (const t of e.changedTouches) if (t.identifier === joyId) resetJoy();
});
joy.addEventListener('touchcancel', resetJoy);

// ============================================================
//  پرش
// ============================================================
let jumpHeld = false;
document.getElementById('jumpBtn').addEventListener('touchstart', e => { jumpHeld = true; e.preventDefault(); }, { passive: false });
document.getElementById('jumpBtn').addEventListener('touchend', e => { jumpHeld = false; e.preventDefault(); }, { passive: false });

// ============================================================
//  ابزار
// ============================================================
let currentTool = 'hand';
const toolLabels = { hand: 'دست ✋', pickaxe: 'کلنگ ⛏️', axe: 'تبر 🪓', sword: 'شمشیر 🗡️' };

document.querySelectorAll('.tool').forEach(el => {
  el.addEventListener('touchstart', e => {
    document.querySelectorAll('.tool').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    currentTool = el.dataset.tool;
    toast('ابزار: ' + toolLabels[currentTool]);
    e.preventDefault();
  }, { passive: false });
});

function updateToolDurabilityUI() {
  for (const key of ['pickaxe', 'axe', 'sword']) {
    const el = document.querySelector(`.tool[data-tool="${key}"] .dur > i`);
    if (el) el.style.width = Math.max(0, player.toolDurability[key]) + '%';
  }
}
updateToolDurabilityUI();

// ============================================================
//  ری‌کست و کندن/گذاشتن
// ============================================================
const raycaster = new THREE.Raycaster();
raycaster.far = 6;
const center = new THREE.Vector2(0, 0);

function getTarget() {
  raycaster.setFromCamera(center, camera);
  const hits = raycaster.intersectObjects(blocks);
  return hits.length ? hits[0] : null;
}

function canBreak(tool, type) {
  if (tool === 'hand')    return ['grass','dirt','leaf','sand','plank'].includes(type);
  if (tool === 'pickaxe') return ['stone','coal','iron','gold','diamond'].includes(type);
  if (tool === 'axe')     return type === 'wood';
  if (tool === 'sword')   return type === 'leaf';
  return false;
}

function requiredToolFor(type) {
  if (['grass','dirt','leaf','sand','plank'].includes(type)) return 'hand';
  if (['stone','coal','iron','gold','diamond'].includes(type)) return 'pickaxe';
  if (type === 'wood') return 'axe';
  return 'hand';
}

// انیمیشن تاب خوردن ابزار
let swingTime = 0;
function swing() { swingTime = 0.25; }

// ذرات شکستن
const particles = [];
function spawnParticles(pos, color) {
  const geo = new THREE.BoxGeometry(0.15, 0.15, 0.15);
  const mat = new THREE.MeshLambertMaterial({ color });
  for (let i = 0; i < 8; i++) {
    const p = new THREE.Mesh(geo, mat);
    p.position.copy(pos);
    p.userData.vel = new THREE.Vector3(
      (Math.random()-0.5)*3,
      Math.random()*3 + 1,
      (Math.random()-0.5)*3
    );
    p.userData.life = 0.8;
    scene.add(p);
    particles.push(p);
  }
}

const breakBtn = document.getElementById('breakBtn');
breakBtn.addEventListener('touchstart', e => {
  swing();
  const hit = getTarget();
  if (!hit) { e.preventDefault(); return; }
  const type = hit.object.userData.type;
  const pos = hit.object.position.clone();

  if (canBreak(currentTool, type)) {
    // صدا
    if (type === 'stone' || type === 'coal' || type === 'iron' || type === 'gold' || type === 'diamond') SFX.break_stone();
    else if (type === 'wood' || type === 'plank') SFX.break_wood();
    else SFX.break_soft();

    // ذرات
    const colorMap = {
      grass: 0x4caf50, dirt: 0x8b5a2b, stone: 0x9e9e9e, wood: 0x6d4c41,
      leaf: 0x2e7d32, sand: 0xede0b3, coal: 0x333333, iron: 0xd8b48c,
      gold: 0xffd54f, diamond: 0x4dd0e1, plank: 0xc59b6a
    };
    spawnParticles(pos, colorMap[type] || 0x999999);

    // اضافه به اینونتوری
    inventory[type] = (inventory[type] || 0) + 1;
    renderInventory();

    removeBlock(hit.object);
    saveWorld();

    // کاهش عمر ابزار
    if (currentTool !== 'hand') {
      player.toolDurability[currentTool] -= 3;
      if (player.toolDurability[currentTool] <= 0) {
        player.toolDurability[currentTool] = 0;
        SFX.tool_break();
        toast('ابزار شکست! 💔');
        // ریست به دست
        currentTool = 'hand';
        document.querySelectorAll('.tool').forEach(t => t.classList.remove('active'));
        document.querySelector('.tool[data-tool="hand"]').classList.add('active');
      }
      updateToolDurabilityUI();
    }
  } else {
    // ابزار اشتباه
    SFX.hit();
    if (navigator.vibrate) navigator.vibrate(60);
    const need = requiredToolFor(type);
    toast('برای این بلوک ' + toolLabels[need] + ' لازمه');
  }
  e.preventDefault();
}, { passive: false });

const placeBtn = document.getElementById('placeBtn');
placeBtn.addEventListener('touchstart', e => {
  swing();
  const hit = getTarget();
  if (!hit || !hit.face) { e.preventDefault(); return; }
  const type = player.selectedPlace;
  if (!inventory[type] || inventory[type] <= 0) {
    toast('از این بلوک نداری');
    e.preventDefault(); return;
  }
  const pos = hit.object.position.clone().add(hit.face.normal);
  if (pos.distanceTo(player.pos) < 1) { e.preventDefault(); return; }
  addBlock(pos.x, pos.y, pos.z, type);
  inventory[type]--;
  renderInventory();
  SFX.place();
  saveWorld();
  e.preventDefault();
}, { passive: false });

// ============================================================
//  جانور ساده (zombie)
// ============================================================
const mobs = [];
function spawnMob() {
  const g = new THREE.Group();
  const bodyGeo = new THREE.BoxGeometry(0.6, 1.0, 0.4);
  const headGeo = new THREE.BoxGeometry(0.5, 0.5, 0.5);
  const mat = new THREE.MeshLambertMaterial({ color: 0x4a7c3a });
  const headMat = new THREE.MeshLambertMaterial({ color: 0x5d9148 });
  const body = new THREE.Mesh(bodyGeo, mat);
  body.position.y = 0.5;
  const head = new THREE.Mesh(headGeo, headMat);
  head.position.y = 1.25;
  g.add(body, head);
  const angle = Math.random() * Math.PI * 2;
  const r = 15 + Math.random() * 8;
  g.position.set(Math.cos(angle)*r, 3, Math.sin(angle)*r);
  g.userData.hp = 3;
  g.userData.speed = 0.8 + Math.random() * 0.4;
  scene.add(g);
  mobs.push(g);
}

let mobSpawnTimer = 0;

function updateMobs(dt) {
  for (const m of mobs) {
    // حرکت به سمت بازیکن
    const dir = new THREE.Vector3().subVectors(player.pos, m.position);
    dir.y = 0;
    const dist = dir.length();
    if (dist > 0.1) {
      dir.normalize();
      m.position.x += dir.x * m.userData.speed * dt;
      m.position.z += dir.z * m.userData.speed * dt;
      m.lookAt(player.pos.x, m.position.y, player.pos.z);
    }
    // گرانش ساده: برخورد با بالاترین بلوک زیر پاش
    let groundY = 0.5;
    const mx = Math.round(m.position.x), mz = Math.round(m.position.z);
    for (const b of blocks) {
      if (Math.round(b.position.x) === mx && Math.round(b.position.z) === mz) {
        const top = b.position.y + 0.5;
        if (top > groundY) groundY = top;
      }
    }
    if (m.position.y > groundY + 0.05) m.position.y -= 5 * dt;
    else m.position.y = groundY;

    // آسیب به بازیکن
    if (dist < 1.2 && m.userData.atkCooldown === undefined || (dist < 1.2 && performance.now() - m.userData.atkCooldown > 1000)) {
      damagePlayer(8);
      m.userData.atkCooldown = performance.now();
    }
  }
}

function damagePlayer(amount) {
  player.hp = Math.max(0, player.hp - amount);
  updateHPUI();
  SFX.hurt();
  if (navigator.vibrate) navigator.vibrate(150);
  if (player.hp <= 0) {
    toast('💀 باختی! ری‌اسپاون...');
    player.hp = 100;
    player.food = 100;
    player.pos.set(0, 12, 10);
    player.vel.set(0,0,0);
    updateHPUI();
    for (const m of mobs) scene.remove(m);
    mobs.length = 0;
  }
}

// ضربه با شمشیر به جانور
function attackMobs() {
  for (const m of [...mobs]) {
    if (m.position.distanceTo(player.pos) < 3) {
      m.userData.hp--;
      spawnParticles(m.position.clone().setY(m.position.y + 1), 0x4a7c3a);
      SFX.hit();
      if (m.userData.hp <= 0) {
        scene.remove(m);
        mobs.splice(mobs.indexOf(m), 1);
        SFX.break_soft();
      }
      return true;
    }
  }
  return false;
}

// ============================================================
//  HUD: جان و غذا
// ============================================================
function updateHPUI() {
  document.querySelector('#hp > i').style.width = player.hp + '%';
  document.querySelector('#food > i').style.width = player.food + '%';
}
updateHPUI();

// ============================================================
//  چرخه شب و روز
// ============================================================
let dayTime = 0.25; // 0..1 (0.25 = صبح)
const DAY_LENGTH = 120; // ثانیه

function updateDayNight(dt) {
  dayTime = (dayTime + dt / DAY_LENGTH) % 1;
  // 0.25 = ظهر، 0.75 = نیمه‌شب
  const sunAngle = dayTime * Math.PI * 2 - Math.PI / 2;
  sun.position.set(Math.cos(sunAngle) * 40, Math.sin(sunAngle) * 40, 20);
  const bright = Math.max(0.05, Math.sin(dayTime * Math.PI * 2 - Math.PI/2) * 0.5 + 0.5);
  sun.intensity = bright * 0.9 + 0.05;
  ambient.intensity = bright * 0.6 + 0.1;

  const nightCol = SKY_NIGHT.clone();
  const dayCol = SKY_DAY.clone();
  const c = dayCol.clone().lerp(nightCol, 1 - bright);
  scene.background.copy(c);
  scene.fog.color.copy(c);

  const isNight = bright < 0.3;
  document.getElementById('clockEl').textContent = isNight ? '🌙' : '☀️';

  // جانور فقط در شب ظاهر میشه
  mobSpawnTimer -= dt;
  if (isNight && mobSpawnTimer <= 0 && mobs.length < 4) {
    spawnMob();
    mobSpawnTimer = 8 + Math.random() * 6;
  }
}

// ============================================================
//  گرسنگی
// ============================================================
let foodTimer = 0;
function updateFood(dt) {
  foodTimer += dt;
  if (foodTimer > 8) {
    foodTimer = 0;
    player.food = Math.max(0, player.food - 1);
    if (player.food <= 0) damagePlayer(3);
    updateHPUI();
  }
}

// ============================================================
//  انیمیشن تاب ابزار (یک مکعب کوچک جلو دوربین)
// ============================================================
const toolMesh = new THREE.Mesh(
  new THREE.BoxGeometry(0.1, 0.5, 0.1),
  new THREE.MeshLambertMaterial({ color: 0x8d6e63 })
);
const toolHead = new THREE.Mesh(
  new THREE.BoxGeometry(0.25, 0.15, 0.12),
  new THREE.MeshLambertMaterial({ color: 0x9e9e9e })
);
toolHead.position.y = 0.3;
toolMesh.add(toolHead);
toolMesh.position.set(0.35, -0.35, -0.6);
camera.add(toolMesh);
scene.add(camera);

// ============================================================
//  حلقه بازی
// ============================================================
const clock = new THREE.Clock();
const GRAVITY = 22;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  // حرکت
  const speed = 6;
  const forward = new THREE.Vector3(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
  const right   = new THREE.Vector3(Math.cos(player.yaw), 0, -Math.sin(player.yaw));
  const move = new THREE.Vector3();
  move.addScaledVector(forward, -joyVec.y * speed * dt);
  move.addScaledVector(right,   joyVec.x * speed * dt);
  player.pos.add(move);

  // گرانش + پرش
  player.vel.y -= GRAVITY * dt;
  if (jumpHeld && player.canJump) {
    player.vel.y = 8.5;
    player.canJump = false;
    SFX.jump();
  }
  player.pos.y += player.vel.y * dt;

  // برخورد با زمین
  let groundY = 1.5;
  const px = Math.round(player.pos.x), pz = Math.round(player.pos.z);
  for (const b of blocks) {
    if (Math.round(b.position.x) === px && Math.round(b.position.z) === pz) {
      const top = b.position.y + 1;
      if (top > groundY) groundY = top;
    }
  }
  groundY += 0.5;
  if (player.pos.y < groundY) {
    player.pos.y = groundY;
    player.vel.y = 0;
    player.canJump = true;
  }

  // ذرات
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.userData.vel.y -= 15 * dt;
    p.position.addScaledVector(p.userData.vel, dt);
    p.userData.life -= dt;
    p.rotation.x += dt * 5;
    p.rotation.y += dt * 5;
    p.scale.setScalar(Math.max(0.01, p.userData.life));
    if (p.userData.life <= 0) {
      scene.remove(p);
      particles.splice(i, 1);
    }
  }

  // جانوران
  updateMobs(dt);

  // چرخه روز و شب
  updateDayNight(dt);

  // گرسنگی
  updateFood(dt);

  // انیمیشن تاب ابزار
  if (swingTime > 0) {
    swingTime -= dt;
    const t = Math.max(0, swingTime) / 0.25;
    toolMesh.rotation.x = -Math.sin((1 - t) * Math.PI) * 1.4;
    toolMesh.position.y = -0.35 - Math.sin((1 - t) * Math.PI) * 0.15;
  } else {
    toolMesh.rotation.x = 0;
    toolMesh.position.y = -0.35;
  }

  updateCamera();
  renderer.render(scene, camera);
}
animate();

// ============================================================
//  شمشیر: ضربه به جانور
// ============================================================
document.getElementById('breakBtn').addEventListener('touchstart', e => {
  if (currentTool === 'sword') {
    attackMobs();
  }
}, { passive: false });

// ============================================================
//  ریسایز
// ============================================================
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ============================================================
//  شروع
// ============================================================
document.getElementById('startBtn').addEventListener('click', () => {
  initAudio();
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  document.getElementById('start').style.display = 'none';
  if (screen.orientation && screen.orientation.lock) {
    screen.orientation.lock('landscape').catch(() => {});
  }
  const el = document.documentElement;
  if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
  loadWorld();
  toast('خوش اومدی! ⛏️');
});

// ذخیره خودکار هر ۲۰ ثانیه
setInterval(saveWorld, 20000);
window.addEventListener('beforeunload', saveWorld);
</script>
