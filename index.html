<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>بازی تیراندازی</title>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; padding:0; overflow:hidden; background:#000; font-family:monospace; touch-action:none; user-select:none; }

  #rotateOverlay {
    position:fixed; inset:0; background:#0a0a15; color:#0f0;
    display:none; flex-direction:column; align-items:center; justify-content:center;
    z-index:9999; font-size:22px; text-align:center; padding:20px;
  }
  #rotateOverlay .icon { font-size:80px; margin-bottom:25px; animation:rot 2s infinite; }
  @keyframes rot { 0%,40%{transform:rotate(0)} 60%,100%{transform:rotate(-90deg)} }
  @media (orientation: portrait) and (max-width: 1100px) {
    #rotateOverlay { display:flex; }
    #mainMenu, #gameContainer { display:none !important; }
  }

  #mainMenu {
    position:fixed; inset:0; z-index:8000;
    background:linear-gradient(135deg, #0a0a15 0%, #1a1a3e 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:#0f0;
  }
  #mainMenu.hide { display:none; }
  #mainMenu h1 {
    font-size:44px; margin:0 0 10px 0;
    text-shadow:0 0 20px #0f0, 0 0 40px #0f0;
    letter-spacing:6px;
  }
  #mainMenu .subtitle { font-size:14px; opacity:0.7; margin-bottom:35px; }
  #startBtn {
    padding:16px 60px; font-size:22px; font-family:monospace; font-weight:bold;
    color:#0f0; background:transparent;
    border:3px solid #0f0; border-radius:10px;
    cursor:pointer; letter-spacing:4px;
    box-shadow:0 0 20px rgba(0,255,0,0.5);
    transition:all 0.15s;
  }
  #startBtn:active { background:#0f0; color:#000; box-shadow:0 0 40px #0f0; transform:scale(1.05); }

  #loading { position:fixed; inset:0; background:#0a0a15; color:#0f0; display:none; flex-direction:column; align-items:center; justify-content:center; z-index:9000; font-size:16px; }
  #loading.show { display:flex; }
  #loading .spinner { width:50px; height:50px; border:4px solid #0f044; border-top-color:#0f0; border-radius:50%; animation:spin 1s linear infinite; margin-bottom:20px; }
  @keyframes spin { to { transform:rotate(360deg); } }

  #gameContainer { position:fixed; inset:0; display:none; }
  #gameContainer.show { display:block; }

  /* نقطه هدف */
  #crosshair { position:fixed; top:50%; left:50%; width:30px; height:30px; transform:translate(-50%,-50%); z-index:10; pointer-events:none; }
  #crosshair .dot { position:absolute; top:50%; left:50%; width:6px; height:6px; background:#0f0; border-radius:50%; transform:translate(-50%,-50%); box-shadow:0 0 6px #0f0; }
  #crosshair .ring { position:absolute; inset:0; border:2px solid rgba(0,255,0,0.5); border-radius:50%; }
  #crosshair.locked .dot { background:#f00; box-shadow:0 0 10px #f00; width:10px; height:10px; }
  #crosshair.locked .ring { border-color:#f00; border-width:3px; animation:pulseLock 0.5s infinite; }
  @keyframes pulseLock { 0%,100%{transform:scale(1)} 50%{transform:scale(0.85)} }

  #lockTimer { position:fixed; top:52%; left:50%; transform:translate(-50%,0); color:#f80; font-size:14px; z-index:11; pointer-events:none; text-shadow:0 0 5px #000; display:none; }
  #lockTimer.show { display:block; }

  .hud { position:fixed; color:#0f0; font-size:16px; z-index:10; text-shadow:0 0 5px #000; pointer-events:none; }
  #hud { top:15px; left:15px; font-size:20px; }
  #weaponUI { top:15px; right:170px; text-align:right; line-height:1.6; font-size:15px; }
  #radar { position:fixed; top:15px; right:15px; width:140px; height:140px; border-radius:50%; background:rgba(0,20,0,0.8); border:2px solid #0f0; z-index:10; pointer-events:none; box-shadow:0 0 15px rgba(0,255,0,0.5); }
  #radarCanvas { width:100%; height:100%; border-radius:50%; }
  #mobileControls { position:fixed; inset:0; z-index:20; pointer-events:none; }
  #lookArea { position:absolute; inset:0; pointer-events:auto; z-index:1; }
  #joyLeft { position:absolute; bottom:20px; left:20px; width:140px; height:140px; border-radius:50%; background:rgba(0,255,0,0.08); border:2px solid rgba(0,255,0,0.4); pointer-events:auto; touch-action:none; z-index:5; }
  .joyKnob { position:absolute; top:50%; left:50%; width:60px; height:60px; border-radius:50%; background:rgba(0,255,0,0.35); border:2px solid #0f0; transform:translate(-50%,-50%); box-shadow:0 0 12px rgba(0,255,0,0.7); }

  /* دکمه شلیک - گلوله */
  #fireBtn {
    position:absolute; right:20px; bottom:20px; width:110px; height:110px;
    border-radius:50%; pointer-events:auto;
    background:radial-gradient(circle at 30% 30%, #ffdd44 0%, #cc8800 50%, #664400 100%);
    border:3px solid #ffcc00;
    display:flex; align-items:center; justify-content:center;
    z-index:5; box-shadow:0 0 20px rgba(255,200,0,0.6), inset 0 -5px 10px rgba(0,0,0,0.5);
    transition:transform 0.06s, box-shadow 0.06s, filter 0.06s;
    color:#fff; font-size:14px; font-weight:bold;
  }
  #fireBtn:active, #fireBtn.pressed {
    transform:scale(0.88);
    filter:brightness(1.4);
    box-shadow:0 0 30px rgba(255,255,0,1), inset 0 5px 15px rgba(0,0,0,0.7);
  }
  #fireBtn svg { width:60%; height:60%; }

  #zoomBtn,#reloadBtn,#grenadeBtn {
    position:absolute; border-radius:50%; pointer-events:auto;
    color:#fff; font-size:12px; font-weight:bold;
    display:flex; align-items:center; justify-content:center;
    border:2px solid; z-index:5;
    transition:transform 0.06s, filter 0.06s;
  }
  #zoomBtn { right:140px; bottom:20px; width:70px; height:70px; background:rgba(120,60,255,0.4); border-color:#84f; }
  #reloadBtn { right:20px; bottom:140px; width:70px; height:70px; background:rgba(60,120,255,0.4); border-color:#48f; }
  #grenadeBtn { right:140px; bottom:100px; width:70px; height:70px; background:rgba(80,255,80,0.3); border-color:#4f4; font-size:26px; }
  #zoomBtn:active, #reloadBtn:active, #grenadeBtn:active { transform:scale(0.85); filter:brightness(1.4); }

  #weaponButtons { position:absolute; left:180px; bottom:20px; display:flex; flex-direction:row; gap:8px; pointer-events:auto; z-index:5; }
  .wbtn {
    width:65px; height:70px; border-radius:10px;
    background:rgba(255,200,60,0.3); border:2px solid #fc0;
    color:#fff; font-size:11px; font-weight:bold;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    cursor:pointer; text-align:center; line-height:1.3;
    transition:transform 0.06s, filter 0.06s;
  }
  .wbtn.active { background:rgba(255,200,60,0.85); box-shadow:0 0 15px #fc0; }
  .wbtn:active { transform:scale(0.9); }
  .wbtn .wicon { font-size:20px; margin-bottom:2px; }
  .wbtn .wname { font-size:10px; }

  #hurtFlash { position:fixed; inset:0; pointer-events:none; z-index:30; background:radial-gradient(ellipse at center, rgba(255,0,0,0) 30%, rgba(255,0,0,0.7) 100%); opacity:0; transition:opacity 0.15s; }
  #hurtFlash.on { opacity:1; }
</style>
</head>
<body>

<div id="rotateOverlay">
  <div class="icon">📱</div>
  <div>گوشی را <b>افقی</b> بگیرید</div>
</div>

<div id="mainMenu">
  <h1>FPS</h1>
  <div class="subtitle">بازی تیراندازی سه‌بعدی</div>
  <button id="startBtn">شروع بازی</button>
</div>

<div id="loading"><div class="spinner"></div><div>در حال بارگذاری...</div></div>

<div id="gameContainer">
  <div id="crosshair"><div class="ring"></div><div class="dot"></div></div>
  <div id="lockTimer">در حال قفل...</div>
  <div class="hud" id="hud"><div>جان: <span id="hp">20</span></div><div>کشته: <span id="kills">0</span></div></div>
  <div class="hud" id="weaponUI"><div id="weaponName">کلاشنیکوف</div><div>خشاب: <span id="ammo">30</span>/<span id="mag">30</span></div><div>ذخیره: <span id="reserve">90</span></div></div>
  <div id="radar"><canvas id="radarCanvas" width="260" height="260"></canvas></div>
  <div id="hurtFlash"></div>
  <div id="mobileControls">
    <div id="lookArea"></div>
    <div id="joyLeft"><div class="joyKnob" id="knobLeft"></div></div>
    <button id="fireBtn">
      <svg viewBox="0 0 100 100">
        <ellipse cx="50" cy="50" rx="12" ry="35" fill="#fff" opacity="0.9"/>
        <path d="M38 50 Q50 20 62 50 L62 75 Q50 88 38 75 Z" fill="#ffddaa" opacity="0.6"/>
      </svg>
    </button>
    <button id="zoomBtn">🎯</button>
    <button id="reloadBtn">R</button>
    <button id="grenadeBtn">💣</button>
    <div id="weaponButtons">
      <div class="wbtn active" id="switchRifle"><span class="wicon">🔫</span><span class="wname">کلاشنیکوف</span></div>
      <div class="wbtn" id="switchSMG"><span class="wicon">💥</span><span class="wname">رگبار</span></div>
      <div class="wbtn" id="switchShotgun"><span class="wicon">🔥</span><span class="wname">ساچمه‌زن</span></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
document.getElementById('startBtn').addEventListener('click', function() {
  document.getElementById('mainMenu').classList.add('hide');
  document.getElementById('loading').classList.add('show');
  if (typeof THREE === 'undefined') {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js';
    s.onload = startGame;
    s.onerror = () => {
      document.getElementById('loading').innerHTML = '<div style="color:#f44;padding:20px;text-align:center">خطا در بارگذاری Three.js<br>اینترنت را چک کنید</div>';
    };
    document.head.appendChild(s);
  } else {
    startGame();
  }
});

function startGame() {
  document.getElementById('loading').classList.remove('show');
  document.getElementById('gameContainer').classList.add('show');

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1a1a2e);
  scene.fog = new THREE.Fog(0x1a1a2e, 25, 120);

  const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 500);
  const BASE_FOV = 75, ZOOM_FOV = 45;
  const renderer = new THREE.WebGLRenderer({ antialias:true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  document.getElementById('gameContainer').appendChild(renderer.domElement);

  addEventListener('resize', () => {
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  scene.add(new THREE.AmbientLight(0xffffff, 0.65));
  const sun = new THREE.DirectionalLight(0xffffff, 0.9);
  sun.position.set(20, 40, 20);
  scene.add(sun);

  const ground = new THREE.Mesh(new THREE.PlaneGeometry(300, 300), new THREE.MeshStandardMaterial({ color:0x3a3a3a, roughness:1 }));
  ground.rotation.x = -Math.PI/2;
  scene.add(ground);

  const wallGroup = new THREE.Group();
  for (let i=0; i<12; i++) {
    const w = new THREE.Mesh(new THREE.BoxGeometry(3, 4, 1), new THREE.MeshStandardMaterial({ color:0x555577 }));
    const a = i/12 * Math.PI * 2;
    w.position.set(Math.sin(a)*18, 2, Math.cos(a)*18);
    w.rotation.y = a;
    wallGroup.add(w);
  }
  scene.add(wallGroup);

  // ===== رنگ‌های دشمن =====
  const enemyColors = [
    { uniform:0x3a5a3a, hat:0x2d4a2d }, // سبز نظامی
    { uniform:0x6b4a2a, hat:0x5a3a1a }, // قهوه‌ای
    { uniform:0x8a8a4a, hat:0x6a6a2a }, // خاکی
    { uniform:0x2a3a5a, hat:0x1a2a4a }, // آبی نظامی
    { uniform:0x5a3a3a, hat:0x4a2a2a }, // قرمز تیره
    { uniform:0x4a4a4a, hat:0x3a3a3a }  // خاکستری
  ];

  // ===== دشمن =====
  const enemies = [];
  let enemyCounter = 0;
  function createEnemy(pos, hasGun) {
    const g = new THREE.Group();
    const col = enemyColors[Math.floor(Math.random()*enemyColors.length)];
    const uniformMat = new THREE.MeshStandardMaterial({ color:col.uniform, roughness:0.9 });
    const skinMat = new THREE.MeshStandardMaterial({ color:0xffcc99 });
    const hatMat = new THREE.MeshStandardMaterial({ color:col.hat, roughness:0.8 });
    const bootMat = new THREE.MeshStandardMaterial({ color:0x1a1a1a, roughness:0.6 });

    const body = new THREE.Mesh(new THREE.BoxGeometry(0.75, 1.3, 0.45), uniformMat);
    body.position.y = 1.25; g.add(body);

    const head = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 16), skinMat);
    head.position.y = 2.1; g.add(head);

    const hatBase = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.34, 0.15, 12), hatMat);
    hatBase.position.y = 2.35; g.add(hatBase);
    const hatTop = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.32, 0.08, 12), hatMat);
    hatTop.position.y = 2.45; g.add(hatTop);

    const eyeMat = new THREE.MeshBasicMaterial({ color:0x000000 });
    const eL = new THREE.Mesh(new THREE.SphereGeometry(0.05,8,8), eyeMat);
    eL.position.set(-0.1,2.15,0.28); g.add(eL);
    const eR = eL.clone(); eR.position.x = 0.1; g.add(eR);

    const armL = new THREE.Mesh(new THREE.BoxGeometry(0.22,1,0.22), uniformMat);
    armL.position.set(-0.52,1.4,0); g.add(armL);
    const armR = armL.clone(); armR.position.x = 0.52; g.add(armR);

    const legL = new THREE.Mesh(new THREE.BoxGeometry(0.26,0.9,0.28), uniformMat);
    legL.position.set(-0.2,0.55,0); g.add(legL);
    const legR = legL.clone(); legR.position.x = 0.2; g.add(legR);

    const bootL = new THREE.Mesh(new THREE.BoxGeometry(0.3,0.2,0.4), bootMat);
    bootL.position.set(-0.2,0.1,0.05); g.add(bootL);
    const bootR = bootL.clone(); bootR.position.x = 0.2; g.add(bootR);

    // تفنگ برای دشمن‌های تفنگدار
    if (hasGun) {
      const gunMat = new THREE.MeshStandardMaterial({ color:0x222222, metalness:0.8 });
      const gun = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.1, 0.5), gunMat);
      gun.position.set(0.5, 1.5, 0.3);
      g.add(gun);
    }

    g.position.copy(pos);
    g.userData = {
      hp:100, maxHp:100, alive:true, walkPhase: Math.random()*10,
      legL, legR, armL, armR, bootL, bootR, body,
      deathTime: 0, dying: false,
      hasGun: hasGun,
      lastShot: 0, shootInterval: 2000 + Math.random()*2000,
      hurtTime: 0, id: enemyCounter++
    };
    scene.add(g); enemies.push(g);
  }

  function spawnEnemy(hasGun) {
    createEnemy(new THREE.Vector3((Math.random()-0.5)*50, 0, (Math.random()-0.5)*50 - 15), hasGun);
  }

  // ۲۰ دشمن، فقط ۲ نفر تفنگدار
  for (let i=0; i<18; i++) spawnEnemy(false);
  for (let i=0; i<2; i++) spawnEnemy(true);

  // ===== جعبه‌ها =====
  const pickups = [];
  function createPickup(type, pos) {
    const g = new THREE.Group();
    const color = type === 'ammo' ? 0xffcc00 : 0xff3366;
    const box = new THREE.Mesh(new THREE.BoxGeometry(0.6,0.6,0.6),
      new THREE.MeshStandardMaterial({ color, emissive:color, emissiveIntensity:0.5, metalness:0.7 }));
    g.add(box);
    const ring = new THREE.Mesh(new THREE.TorusGeometry(0.5,0.04,8,24),
      new THREE.MeshStandardMaterial({ color:0xffffff, emissive:0xffffff, emissiveIntensity:0.6 }));
    ring.rotation.x = Math.PI/2;
    g.add(ring);
    const iconMat = new THREE.MeshBasicMaterial({ color:0x000000 });
    if (type === 'ammo') {
      g.add(new THREE.Mesh(new THREE.BoxGeometry(0.3,0.15,0.15), iconMat));
    } else {
      g.add(new THREE.Mesh(new THREE.BoxGeometry(0.15,0.3,0.15), iconMat));
      g.add(new THREE.Mesh(new THREE.BoxGeometry(0.3,0.15,0.15), iconMat));
    }
    g.position.copy(pos); g.position.y = 1.0;
    g.userData = { type, baseY:1.0, phase: Math.random()*Math.PI*2, alive:true };
    scene.add(g); pickups.push(g);
  }
  function spawnRandomPickup() {
    const type = Math.random() < 0.6 ? 'ammo' : 'health';
    const pos = new THREE.Vector3((Math.random()-0.5)*50, 0, (Math.random()-0.5)*50);
    createPickup(type, pos);
  }
  for (let i=0; i<8; i++) spawnRandomPickup();

  // ===== صدا =====
  let audioCtx = null;
  function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }
  function playSnd(freq, dur, type, vol) {
    if (!audioCtx || audioCtx.state !== 'running') return;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type || 'square'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol||0.15, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  }
  const shotSnd = () => { playSnd(180,0.08,'square',0.2); playSnd(80,0.12,'sawtooth',0.15); };
  const shotgunSnd = () => { playSnd(120,0.15,'sawtooth',0.25); playSnd(60,0.2,'square',0.2); };
  const hitSnd = () => playSnd(600,0.1,'sine',0.2);
  const pickSnd = () => { playSnd(800,0.08,'sine',0.2); setTimeout(()=>playSnd(1200,0.1,'sine',0.2), 80); };
  const hurtSnd = () => playSnd(200,0.2,'sawtooth',0.25);
  const enemyShotSnd = () => playSnd(150,0.1,'square',0.15);
  const emptySnd = () => playSnd(80,0.05,'square',0.1);
  const magOutSnd = () => playSnd(250,0.1,'square',0.12);
  const magInSnd = () => { playSnd(400,0.08,'square',0.15); setTimeout(()=>playSnd(280,0.1,'sine',0.12),100); };
  const shellSnd = () => playSnd(900+Math.random()*200, 0.05, 'sine', 0.04);
  const deathSnd = () => { playSnd(300,0.3,'sawtooth',0.15); setTimeout(()=>playSnd(150,0.5,'sine',0.15),150); };
  const explosionSnd = () => { playSnd(60,0.5,'sawtooth',0.3); playSnd(120,0.4,'square',0.25); };
  const lockSnd = () => playSnd(900,0.05,'sine',0.15);
  const lockDoneSnd = () => { playSnd(1200,0.08,'sine',0.2); setTimeout(()=>playSnd(1600,0.1,'sine',0.2),50); };

  // ===== دوربین =====
  const cameraHolder = new THREE.Object3D();
  cameraHolder.add(camera);
  scene.add(cameraHolder);

  // ===== افکت‌ها =====
  const shells = [], sparks = [], decals = [], tracers = [], grenades = [], explosions = [];
  const shellGeo = new THREE.CylinderGeometry(0.02,0.02,0.05,6);
  const shellMat = new THREE.MeshStandardMaterial({ color:0xffcc33, metalness:0.9, roughness:0.2 });
  const sparkGeo = new THREE.SphereGeometry(0.04,4,4);
  const decalGeo = new THREE.CircleGeometry(0.08,8);
  const decalMat = new THREE.MeshBasicMaterial({ color:0x000000, transparent:true, opacity:0.85 });

  function spawnShell(pos, rightDir, upDir) {
    if (shells.length > 25) return;
    const s = new THREE.Mesh(shellGeo, shellMat);
    s.position.copy(pos);
    s.userData = {
      vel: new THREE.Vector3().addScaledVector(rightDir, 1.5+Math.random()*0.8).addScaledVector(upDir, 1.2+Math.random()*0.5),
      rot: new THREE.Vector3(Math.random()*10,Math.random()*10,Math.random()*10), life: 3
    };
    scene.add(s); shells.push(s); shellSnd();
  }
  function spawnSpark(pos) {
    if (sparks.length > 40) return;
    for (let i=0; i<5; i++) {
      const sp = new THREE.Mesh(sparkGeo, new THREE.MeshBasicMaterial({ color:0xffaa00, transparent:true }));
      sp.position.copy(pos);
      sp.userData = { vel: new THREE.Vector3((Math.random()-0.5)*3, Math.random()*3, (Math.random()-0.5)*3), life: 0.4 };
      scene.add(sp); sparks.push(sp);
    }
  }
  function spawnDecal(pos, normal) {
    if (decals.length > 50) { const o = decals.shift(); scene.remove(o); }
    const d = new THREE.Mesh(decalGeo, decalMat);
    d.position.copy(pos).addScaledVector(normal, 0.01);
    d.lookAt(pos.clone().add(normal));
    d.userData = { life: 30 };
    scene.add(d); decals.push(d);
  }
  function spawnTracer(from, to) {
    const geo = new THREE.BufferGeometry().setFromPoints([from, to]);
    const mat = new THREE.LineBasicMaterial({ color:0xffff66, transparent:true, opacity:1 });
    const line = new THREE.Line(geo, mat);
    scene.add(line);
    tracers.push({ line, life: 0.12 });
  }

  // ===== نارنجک =====
  const grenadeGeo = new THREE.SphereGeometry(0.15, 12, 12);
  const grenadeMat = new THREE.MeshStandardMaterial({ color:0x22cc22, emissive:0x116611, emissiveIntensity:0.5, metalness:0.4 });

  function throwGrenade() {
    if (grenadeCooldown > 0) return;
    grenadeCooldown = 2;
    const g = new THREE.Mesh(grenadeGeo, grenadeMat);
    const camPos = new THREE.Vector3();
    camera.getWorldPosition(camPos);
    g.position.copy(camPos);

  function explodeGrenade(pos) {
    explosionSnd();
    // افکت نور
    const light = new THREE.PointLight(0xff6600, 5, 8);
    light.position.copy(pos); light.position.y = 1;
    scene.add(light);
    setTimeout(()=>scene.remove(light), 200);

    // افکت کره انفجار
    const sphere = new THREE.Mesh(
      new THREE.SphereGeometry(0.5, 16, 16),
      new THREE.MeshBasicMaterial({ color:0xff6600, transparent:true, opacity:0.9 })
    );
    sphere.position.copy(pos);
    sphere.position.y = 1;
    scene.add(sphere);
    explosions.push({ mesh: sphere, life: 0.4, maxLife: 0.4 });

    // آسیب به دشمن‌ها
    for (const e of enemies) {
      if (!e.userData.alive || e.userData.dying) continue;
      const dist = e.position.distanceTo(pos);
      if (dist < 5) {
        const dmg = Math.max(0, 100 - dist * 20);
        e.userData.hp -= dmg;
        e.userData.hurtTime = 0.2;
        if (e.userData.hp <= 0 && !e.userData.dying) {
          e.userData.dying = true;
          e.userData.deathTime = 0;
          deathSnd();
          kills++;
          document.getElementById('kills').textContent = kills;
        }
      }
    }
    // آسیب به بازیکن
    const pdist = player.pos.distanceTo(pos);
    if (pdist < 4) {
      player.hp = Math.max(0, player.hp - Math.floor((4-pdist) * 2));
      updateUI(); hurtSnd(); flashRed();
      if (player.hp <= 0) gameOver();
    }
  }

  // ===== جوی‌استیک =====
  (function setupJoystick() {
    const el = document.getElementById('joyLeft');
    const knob = document.getElementById('knobLeft');
    let active = false, id = null, cx = 0, cy = 0, maxR = 0;
    el.addEventListener('touchstart', e => {
      e.preventDefault(); e.stopPropagation();
      const t = e.changedTouches[0];
      id = t.identifier;
      const r = el.getBoundingClientRect();
      cx = r.left+r.width/2; cy = r.top+r.height/2; maxR = r.width/2;
      active = true; upd(t.clientX, t.clientY);
    }, { passive:false });
    el.addEventListener('touchmove', e => {
      if (!active) return;
      for (const t of e.changedTouches) {
        if (t.identifier === id) { e.preventDefault(); e.stopPropagation(); upd(t.clientX, t.clientY); }
      }
    }, { passive:false });
    const end = e => {
      for (const t of e.changedTouches) {
        if (t.identifier === id) { active = false; id = null; knob.style.transform = 'translate(-50%,-50%)'; moveInput.x = 0; moveInput.y = 0; }
      }
    };
    el.addEventListener('touchend', end);
    el.addEventListener('touchcancel', end);
    function upd(x, y) {
      let dx = x-cx, dy = y-cy;
      const d = Math.hypot(dx, dy);
      if (d > maxR) { dx = dx/d*maxR; dy = dy/d*maxR; }
      knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
      moveInput.x = dx/maxR;
      moveInput.y = dy/maxR;
    }
  })();

  (function setupLook() {
    const el = document.getElementById('lookArea');
    let id = null, lastX = 0, lastY = 0, startX = 0, startY = 0, moved = false;
    el.addEventListener('touchstart', e => {
      e.preventDefault(); initAudio();
      const t = e.changedTouches[0];
      id = t.identifier; lastX = t.clientX; lastY = t.clientY;
      startX = t.clientX; startY = t.clientY;
      moved = false;
    }, { passive:false });
    el.addEventListener('touchmove', e => {
      if (id === null) return;
      for (const t of e.changedTouches) {
        if (t.identifier === id) {
          e.preventDefault();
          const dx = t.clientX - lastX;
          const dy = t.clientY - lastY;
          const sens = isZooming ? 0.002 : 0.004;
          yaw -= dx * sens;
          pitch -= dy * sens;
          pitch = Math.max(-Math.PI/2+0.01, Math.min(Math.PI/2-0.01, pitch));
          lastX = t.clientX; lastY = t.clientY;
          // اگه کاربر انگشت رو کشید، قفل باز می‌شه
          if (Math.hypot(t.clientX - startX, t.clientY - startY) > 20) {
            if (!moved) { lockedEnemy = null; moved = true; }
          }
        }
      }
    }, { passive:false });
    const end = e => {
      for (const t of e.changedTouches) {
        if (t.identifier === id) id = null;
      }
    };
    el.addEventListener('touchend', end);
    el.addEventListener('touchcancel', end);
  })();

  // ===== شلیک =====
  const raycaster = new THREE.Raycaster();
  function tryShoot() {
    if (reloadState) return;
    const w = weapons[currentWeapon];
    const now = performance.now();
    if (now - lastShot < w.fireRate) return;
    if (w.ammo <= 0) { emptySnd(); lastShot = now; return; }
    lastShot = now; w.ammo--; updateUI();
    if (currentWeapon === 'shotgun') shotgunSnd(); else shotSnd();
    recoilKick = w.recoil;

    const ud = w.obj.userData;
    if (ud.flash) { ud.flash.intensity = 3; setTimeout(()=>ud.flash.intensity = 0, 60); }
    if (ud.flashMesh) { ud.flashMesh.visible = true; ud.flashMesh.rotation.z = Math.random()*Math.PI; setTimeout(()=>ud.flashMesh.visible = false, 50); }
    if (ud.slide) { ud.slide.position.z = ud.slideZBase + 0.08; setTimeout(()=>{ if (ud.slide) ud.slide.position.z = ud.slideZBase; }, 60); }

    const q = camera.getWorldQuaternion(new THREE.Quaternion());
    const rightDir = new THREE.Vector3(1,0,0).applyQuaternion(q);
    const upDir = new THREE.Vector3(0,1,0).applyQuaternion(q);
    const camPos = new THREE.Vector3();
    camera.getWorldPosition(camPos);
    const shellPos = camPos.clone().addScaledVector(rightDir, 0.35).addScaledVector(upDir, -0.15);
    spawnShell(shellPos, rightDir, upDir);

    for (let p=0; p<w.pellets; p++) {
      const spreadX = (Math.random()-0.5) * w.spread * (p===0 && w.pellets===1 ? 0 : 1);
      const spreadY = (Math.random()-0.5) * w.spread * (p===0 && w.pellets===1 ? 0 : 1);
      raycaster.setFromCamera(new THREE.Vector2(spreadX, spreadY), camera);
      const targets = [...enemies, ground, wallGroup];
      const hits = raycaster.intersectObjects(targets, true);
      const from = camPos.clone();
      let to = from.clone().add(raycaster.ray.direction.clone().multiplyScalar(100));

      if (hits.length > 0) {
        const hit = hits[0];
        to = hit.point.clone();
        if (p === 0 || w.pellets > 1) spawnSpark(hit.point);
        let obj = hit.object;
        while (obj.parent && !enemies.includes(obj)) obj = obj.parent;
        if (enemies.includes(obj) && obj.userData.alive) {
          obj.userData.hp -= w.damage;
          obj.userData.hurtTime = 0.15;
          if (p === 0) hitSnd();
          if (obj.userData.hp <= 0 && !obj.userData.dying) {
            obj.userData.dying = true;
            obj.userData.deathTime = 0;
            deathSnd(); kills++;
            document.getElementById('kills').textContent = kills;
          }
        } else if (p === 0) {
          let n = new THREE.Vector3(0,1,0);
          if (hit.face) n = hit.face.normal.clone().transformDirection(hit.object.matrixWorld);
          spawnDecal(hit.point, n);
        }
      }
      if (p === 0 || w.pellets <= 4) spawnTracer(from, to);
    }
  }

  // ===== Reload =====
  function reload() {
    if (reloadState) return;
    const w = weapons[currentWeapon];
    if (w.reserve <= 0 || w.ammo === w.mag) return;
    reloadState = { startTime: performance.now(), duration: w.reloadTime*1000, weapon: currentWeapon };
    const ud = w.obj.userData;
    setTimeout(() => {
      if (!ud.mag) return;
      magOutSnd();
      const magWorld = new THREE.Vector3();
      ud.mag.getWorldPosition(magWorld);
      const fallingMag = new THREE.Mesh(new THREE.BoxGeometry(0.06,0.22,0.08), new THREE.MeshStandardMaterial({ color:0x222222, metalness:0.6 }));
      fallingMag.position.copy(magWorld);
      scene.add(fallingMag);
      fallingMag.userData = { vel: new THREE.Vector3(0,-2,0), life: 3 };
      shells.push(fallingMag);
      ud.mag.visible = false;
    }, 500);
    setTimeout(() => {
      if (!ud.mag) return;
      ud.mag.visible = true;
      magInSnd();
    }, w.reloadTime*1000 - 600);
    setTimeout(() => {
      const need = w.mag - w.ammo;
      const give = Math.min(need, w.reserve);
      w.ammo += give; w.reserve -= give;
      updateUI();
      hand.visible = false;
      reloadState = null;
    }, w.reloadTime*1000);
  }

  // ===== حرکت =====
  function updateMovement(dt) {
    const speed = isZooming ? 3 : 6;
    let forwardInput = 0, rightInput = 0;
    if (keys['KeyW']) forwardInput += 1;
    if (keys['KeyS']) forwardInput -= 1;
    if (keys['KeyA']) rightInput -= 1;
    if (keys['KeyD']) rightInput += 1;
    forwardInput += -moveInput.y;
    rightInput += moveInput.x;

    const forward = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
    const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
    const move = new THREE.Vector3().addScaledVector(forward, forwardInput).addScaledVector(right, rightInput);
    if (move.length() > 1) move.normalize();
    player.pos.addScaledVector(move, speed * dt);

    if (keys['Space'] && player.onGround) { player.vel.y = 6; player.onGround = false; }
    player.vel.y -= 20 * dt;
    player.pos.y += player.vel.y * dt;
    if (player.pos.y <= 1.7) { player.pos.y = 1.7; player.vel.y = 0; player.onGround = true; }

    cameraHolder.position.copy(player.pos);
    cameraHolder.rotation.y = yaw;
    camera.rotation.x = pitch + recoilKick * 2;

    const targetFov = isZooming ? ZOOM_FOV : BASE_FOV;
    camera.fov += (targetFov - camera.fov) * 0.2;
    camera.updateProjectionMatrix();
  }

  function updateLock(dt) {
    // raycast از مرکز صفحه
    raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
    const hits = raycaster.intersectObjects(enemies, true);
    let hitEnemy = null;
    if (hits.length > 0) {
      let obj = hits[0].object;
      while (obj.parent && !enemies.includes(obj)) obj = obj.parent;
      if (enemies.includes(obj) && obj.userData.alive && !obj.userData.dying) hitEnemy = obj;
    }

    // اگه قبلاً قفل شده
    if (lockedEnemy) {
      if (!lockedEnemy.userData.alive || lockedEnemy.userData.dying) {
        lockedEnemy = null; lockProgress = 0;
      } else {
        // تنظیم yaw/pitch به سمت هدف
        const targetPos = lockedEnemy.position.clone();
        targetPos.y = 1.5;
        const camPos = cameraHolder.position.clone();
        const dir = targetPos.clone().sub(camPos).normalize();
        const targetYaw = Math.atan2(-dir.x, -dir.z);
        const targetPitch = Math.asin(dir.y);
        yaw += (targetYaw - yaw) * 0.3;
        pitch += (targetPitch - pitch) * 0.3;
      }
      return;
    }

    if (hitEnemy && hitEnemy === lockTarget) {
      lockProgress += dt;
      if (lockProgress >= LOCK_TIME) {
        lockedEnemy = hitEnemy;
        lockDoneSnd();
        lockProgress = 0;
      } else if (Math.floor(lockProgress*10) % 3 === 0) {
        // صدای تیک
      }
    } else {
      lockTarget = hitEnemy;
      lockProgress = 0;
    }

    // آپدیت HUD
    const ch = document.getElementById('crosshair');
    const lt = document.getElementById('lockTimer');
    if (lockedEnemy) {
      ch.classList.add('locked');
      lt.classList.remove('show');
    } else if (lockTarget && lockProgress > 0.05) {
      ch.classList.remove('locked');
      lt.classList.add('show');
      lt.textContent = 'قفل: ' + Math.min(100, Math.round(lockProgress/LOCK_TIME*100)) + '%';
    } else {
      ch.classList.remove('locked');
      lt.classList.remove('show');
    }
  }

  // ===== دشمن‌ها =====
  function updateEnemies(dt, time) {
    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      const ud = e.userData;

      if (ud.dying) {
        ud.deathTime += dt;
        e.rotation.x = Math.min(Math.PI/2, ud.deathTime * 4);
        e.position.y -= dt * 0.8;
        if (ud.deathTime > 2.5) { scene.remove(e); enemies.splice(i, 1); spawnEnemy(Math.random()<0.1); }
        continue;
      }

      if (!ud.alive) continue;

      const dx = player.pos.x - e.position.x;
      const dz = player.pos.z - e.position.z;
      const dist = Math.hypot(dx, dz);

      if (!ud.hasGun) {
        // دشمن معمولی: میاد سمت بازیکن
        e.rotation.y = Math.atan2(dx, dz);
        if (dist > 8) {
          const spd = 2.0 * dt;
          e.position.x += Math.sin(e.rotation.y) * spd;
          e.position.z += Math.cos(e.rotation.y) * spd;
        } else if (dist < 5) {
          const spd = 1.2 * dt;
          e.position.x -= Math.sin(e.rotation.y) * spd;
          e.position.z -= Math.cos(e.rotation.y) * spd;
        }
      } else {
        // دشمن تفنگدار: از فاصله دور شلیک می‌کنه
        e.rotation.y = Math.atan2(dx, dz);
        // فاصله‌ی ۱۲ تا ۲۵ متر
        if (dist > 22) {
          const spd = 1.5 * dt;
          e.position.x += Math.sin(e.rotation.y) * spd;
          e.position.z += Math.cos(e.rotation.y) * spd;
        } else if (dist < 12) {
          const spd = 1.5 * dt;
          e.position.x -= Math.sin(e.rotation.y) * spd;
          e.position.z -= Math.cos(e.rotation.y) * spd;
        }
        ud.lastShot += dt * 1000;
        if (ud.lastShot > ud.shootInterval && dist < 30) {
          ud.lastShot = 0;
          enemyShotSnd();
          if (Math.random() < 0.4) {
            player.hp = Math.max(0, player.hp - 1);
            updateUI(); hurtSnd(); flashRed();
            const eFrom = new THREE.Vector3(e.position.x, 1.5, e.position.z);
            spawnTracer(eFrom, player.pos.clone());
            if (player.hp <= 0) gameOver();
          }
        }
      }

      // انیمیشن دویدن
      ud.walkPhase += dt * 9;
      const swing = Math.sin(ud.walkPhase) * 0.5;
      if (ud.legL) {
        ud.legL.rotation.x = swing;
        ud.legR.rotation.x = -swing;
        ud.bootL.rotation.x = swing;
        ud.bootR.rotation.x = -swing;
        ud.bootL.position.z = 0.05 + swing * 0.2;
        ud.bootR.position.z = 0.05 - swing * 0.2;
        ud.armL.rotation.x = -swing * 0.7;
        ud.armR.rotation.x = swing * 0.7;
        ud.body.position.y = 1.25 + Math.abs(Math.sin(ud.walkPhase)) * 0.03;
      }

      if (ud.hurtTime > 0) {
        ud.hurtTime -= dt;
        if (ud.body) ud.body.material.emissive = new THREE.Color(0x660000);
      } else {
        if (ud.body) ud.body.material.emissive = new THREE.Color(0x000000);
      }
    }
  }

  let hurtFlashTimeout = null;
  function flashRed() {
    const f = document.getElementById('hurtFlash');
    f.classList.add('on');
    clearTimeout(hurtFlashTimeout);
    hurtFlashTimeout = setTimeout(() => f.classList.remove('on'), 200);
  }

  function gameOver() {
    player.hp = 20; updateUI();
    player.pos.set(0, 1.7, 0); player.vel.set(0,0,0);
    for (const e of enemies) scene.remove(e);
    enemies.length = 0;
    for (let i=0; i<18; i++) spawnEnemy(false);
    for (let i=0; i<2; i++) spawnEnemy(true);
  }

  // ===== پیکاپ‌ها =====
  function updatePickups(dt) {
    for (let i = pickups.length - 1; i >= 0; i--) {
      const p = pickups[i];
      p.rotation.y += dt * 1.5;
      p.userData.phase += dt * 2;
      p.position.y = p.userData.baseY + Math.sin(p.userData.phase) * 0.2;
      const dx = player.pos.x - p.position.x;
      const dz = player.pos.z - p.position.z;
      if (Math.hypot(dx, dz) < 1.2) {
        if (p.userData.type === 'ammo') {
          weapons.rifle.reserve = Math.min(90, weapons.rifle.reserve + 30);
          weapons.smg.reserve = Math.min(120, weapons.smg.reserve + 40);
          weapons.shotgun.reserve = Math.min(32, weapons.shotgun.reserve + 8);
        } else {
          player.hp = Math.min(player.maxHp, player.hp + 5);
        }
        pickSnd(); updateUI();
        scene.remove(p); pickups.splice(i, 1);
        spawnRandomPickup();
      }
    }
  }

  // ===== افکت‌ها =====
  function updateEffects(dt) {
    for (let i = shells.length - 1; i >= 0; i--) {
      const s = shells[i];
      if (s.userData.vel) {
        s.userData.vel.y -= 15 * dt;
        s.position.addScaledVector(s.userData.vel, dt);
        if (s.position.y < 0.05) {
          s.position.y = 0.05;
          s.userData.vel.multiplyScalar(0.3);
          s.userData.vel.y = Math.abs(s.userData.vel.y) * 0.3;
        }
      }
      if (s.userData.rot) {
        s.rotation.x += s.userData.rot.x * dt;
        s.rotation.y += s.userData.rot.y * dt;
        s.rotation.z += s.userData.rot.z * dt;
      }
      s.userData.life -= dt;
      if (s.userData.life <= 0) { scene.remove(s); shells.splice(i, 1); }
    }
    for (let i = sparks.length - 1; i >= 0; i--) {
      const sp = sparks[i];
      sp.userData.vel.y -= 10 * dt;
      sp.position.addScaledVector(sp.userData.vel, dt);
      sp.userData.life -= dt;
      sp.material.opacity = Math.max(0, sp.userData.life / 0.4);
      if (sp.userData.life <= 0) { scene.remove(sp); sp.material.dispose(); sparks.splice(i, 1); }
    }
    for (let i = tracers.length - 1; i >= 0; i--) {
      const tr = tracers[i];
      tr.life -= dt;
      tr.line.material.opacity = Math.max(0, tr.life / 0.12);
      if (tr.life <= 0) { scene.remove(tr.line); tr.line.geometry.dispose(); tr.line.material.dispose(); tracers.splice(i, 1); }
    }
    for (let i = decals.length - 1; i >= 0; i--) {
      decals[i].userData.life -= dt;
      if (decals[i].userData.life <= 0) { scene.remove(decals[i]); decals.splice(i, 1); }
    }

    // نارنجک‌ها
    for (let i = grenades.length - 1; i >= 0; i--) {
      const g = grenades[i];
      g.userData.vel.y -= 15 * dt;
      g.position.addScaledVector(g.userData.vel, dt);
      g.rotation.x += dt * 5;
      g.rotation.y += dt * 5;
      // برخورد با زمین
      if (g.position.y < 0.15) {
        g.position.y = 0.15;
        g.userData.vel.y = Math.abs(g.userData.vel.y) * 0.4;
        g.userData.vel.x *= 0.7;
        g.userData.vel.z *= 0.7;
      }
      g.userData.life -= dt;
      if (g.userData.life <= 0 && !g.userData.exploded) {
        g.userData.exploded = true;
        explodeGrenade(g.position.clone());
        scene.remove(g);
        grenades.splice(i, 1);
      }
    }

    // انفجارها
    for (let i = explosions.length - 1; i >= 0; i--) {
      const ex = explosions[i];
      ex.life -= dt;
      const k = ex.life / ex.maxLife;
      ex.mesh.scale.setScalar(1 + (1-k) * 8);
      ex.mesh.material.opacity = k * 0.9;
      if (ex.life <= 0) { scene.remove(ex.mesh); explosions.splice(i, 1); }
    }

    // کول‌داون نارنجک
    if (grenadeCooldown > 0) grenadeCooldown -= dt;
  }

  // ===== انیمیشن تعویض خشاب =====
  function updateReloadAnim(dt) {
    if (!reloadState) { hand.visible = false; return; }
    const w = weapons[reloadState.weapon];
    const t = (performance.now() - reloadState.startTime) / reloadState.duration;
    const ud = w.obj.userData;
    hand.visible = true;

    if (t < 0.25) {
      const k = t / 0.25;
      hand.position.set(0.15, -0.35 - k*0.15, -0.3 - k*0.1);
      hand.rotation.set(0, 0, 0.3 * k);
      w.obj.rotation.z = 0.3 * k;
      w.obj.position.y = -0.25 - 0.1 * k;
    } else if (t < 0.5) {
      const k = (t - 0.25) / 0.25;
      hand.position.set(0.15, -0.5 - k*0.2, -0.4);
      hand.rotation.set(0, 0, 0.3);
      w.obj.rotation.z = 0.3;
      w.obj.position.y = -0.35 - 0.1 * k;
      if (ud.mag) ud.mag.position.y = ud.magYBase - k * 0.15;
    } else if (t < 0.75) {
      const k = (t - 0.5) / 0.25;
      hand.position.set(0.15, -0.7 + k*0.2, -0.4);
      hand.rotation.set(0, 0, 0.3 - 0.3 * k);
      w.obj.rotation.z = 0.3 * (1 - k);
      w.obj.position.y = -0.45 + 0.1 * k;
      if (ud.mag) ud.mag.position.y = ud.magYBase - 0.15 + k * 0.15;
    } else {
      const k = (t - 0.75) / 0.25;
      hand.position.set(0.15, -0.5 + k*0.25, -0.4 + k*0.1);
      hand.rotation.set(0, 0, 0);
      w.obj.rotation.z = 0;
      w.obj.position.y = -0.35 + k * 0.1;
      if (ud.mag) ud.mag.position.y = ud.magYBase;
    }
  }

  // ===== رادار =====
  const radarCanvas = document.getElementById('radarCanvas');
  const radarCtx = radarCanvas.getContext('2d');
  const RADAR_RANGE = 30;
  function drawRadar() {
    const W = radarCanvas.width, H = radarCanvas.height;
    const cx = W/2, cy = H/2, r = W/2 - 6;
    radarCtx.clearRect(0, 0, W, H);
    radarCtx.beginPath();
    radarCtx.arc(cx, cy, r, 0, Math.PI*2);
    radarCtx.fillStyle = 'rgba(0,30,0,0.6)';
    radarCtx.fill();
    radarCtx.strokeStyle = '#0f0'; radarCtx.lineWidth = 2; radarCtx.stroke();

    radarCtx.strokeStyle = 'rgba(0,255,0,0.3)'; radarCtx.lineWidth = 1;
    for (let i=1; i<=2; i++) {
      radarCtx.beginPath(); radarCtx.arc(cx, cy, r*i/3, 0, Math.PI*2); radarCtx.stroke();
    }
    radarCtx.beginPath();
    radarCtx.moveTo(cx, cy-r); radarCtx.lineTo(cx, cy+r);
    radarCtx.moveTo(cx-r, cy); radarCtx.lineTo(cx+r, cy);
    radarCtx.stroke();

    radarCtx.save();
    radarCtx.translate(cx, cy);
    radarCtx.rotate(-yaw);
    radarCtx.fillStyle = '#0f0';
    radarCtx.beginPath();
    radarCtx.moveTo(0, -8); radarCtx.lineTo(-6, 6); radarCtx.lineTo(6, 6);
    radarCtx.closePath(); radarCtx.fill();
    radarCtx.restore();

    const px = player.pos.x, pz = player.pos.z;
    for (const e of enemies) {
      if (!e.userData.alive || e.userData.dying) continue;
      const dx = e.position.x - px, dz = e.position.z - pz;
      const d = Math.hypot(dx, dz);
      if (d > RADAR_RANGE) continue;
      const scale = r / RADAR_RANGE;
      const rx = dx * Math.cos(-yaw) - dz * Math.sin(-yaw);
      const rz = dx * Math.sin(-yaw) + dz * Math.cos(-yaw);
      radarCtx.fillStyle = e.userData.hasGun ? '#ff0' : '#f33';
      radarCtx.beginPath();
      radarCtx.arc(cx + rx*scale, cy + rz*scale, e.userData.hasGun ? 5 : 4, 0, Math.PI*2);
      radarCtx.fill();
    }
    for (const p of pickups) {
      const dx = p.position.x - px, dz = p.position.z - pz;
      const d = Math.hypot(dx, dz);
      if (d > RADAR_RANGE) continue;
      const scale = r / RADAR_RANGE;
      const rx = dx * Math.cos(-yaw) - dz * Math.sin(-yaw);
      const rz = dx * Math.sin(-yaw) + dz * Math.cos(-yaw);
      radarCtx.fillStyle = p.userData.type === 'ammo' ? '#fc0' : '#f6c';
      radarCtx.beginPath();
      radarCtx.arc(cx + rx*scale, cy + rz*scale, 3, 0, Math.PI*2);
      radarCtx.fill();
    }
  }

  // ===== حلقه اصلی =====
  const clock = new THREE.Clock();
  let radarTimer = 0;

  function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);
    const time = clock.elapsedTime;

    if (isFiring && weapons[currentWeapon].auto && !reloadState) tryShoot();

    updateMovement(dt);
    updateLock(dt);
    updateEnemies(dt, time);
    updatePickups(dt);
    updateEffects(dt);
    updateReloadAnim(dt);

    radarTimer += dt;
    if (radarTimer > 0.1) { drawRadar(); radarTimer = 0; }

    recoilKick *= 0.85;
    const w = weapons[currentWeapon];
    if (!reloadState) {
      const bp = w.basePos;
      w.obj.position.z = bp.z + recoilKick * 3;
      w.obj.rotation.x = recoilKick * 2;
      if (isZooming) {
        w.obj.position.x += (0 - w.obj.position.x) * 0.15;
        w.obj.position.y += (-0.15 - w.obj.position.y) * 0.15;
      } else {
        w.obj.position.x += (bp.x - w.obj.position.x) * 0.15;
        w.obj.position.y += (bp.y - w.obj.position.y) * 0.15;
      }
    }

    renderer.render(scene, camera);
  }
  animate();

  document.addEventListener('touchmove', e => {
    if (e.target.id !== 'lookArea' && !e.target.closest('#joyLeft')) e.preventDefault();
  }, { passive:false });
  document.addEventListener('gesturestart', e => e.preventDefault());
}
