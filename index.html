<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>میدان جنگ</title>
<style>
/* ==================== پایه ==================== */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Tahoma, Arial, sans-serif;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    position: fixed;
}

canvas {
    display: block;
}

/* ==================== HUD ==================== */
#hud {
    position: fixed;
    inset: 0;
    pointer-events: none;
    color: white;
    text-shadow: 2px 2px 5px #000;
    z-index: 10;
}

#level {
    position: absolute;
    top: 8px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 14px;
    color: #ffcc00;
    background: rgba(0, 0, 0, 0.6);
    padding: 4px 14px;
    border-radius: 20px;
    font-weight: bold;
    white-space: nowrap;
}

#health {
    position: absolute;
    top: 8px;
    right: 10px;
    font-size: 15px;
    color: #ff5555;
    background: rgba(0, 0, 0, 0.6);
    padding: 4px 12px;
    border-radius: 20px;
}

#enemyCount {
    position: absolute;
    top: 40px;
    right: 10px;
    font-size: 13px;
    color: #88ccff;
    background: rgba(0, 0, 0, 0.6);
    padding: 4px 12px;
    border-radius: 20px;
}

#allyCount {
    position: absolute;
    top: 72px;
    right: 10px;
    font-size: 13px;
    color: #88ff88;
    background: rgba(0, 0, 0, 0.6);
    padding: 4px 12px;
    border-radius: 20px;
}

#grenadeCount {
    position: absolute;
    top: 104px;
    right: 10px;
    font-size: 13px;
    color: #ffaa66;
    background: rgba(0, 0, 0, 0.6);
    padding: 4px 12px;
    border-radius: 20px;
}

#weapon {
    position: absolute;
    top: 8px;
    left: 10px;
    font-size: 14px;
    color: #ffaa00;
    background: rgba(0, 0, 0, 0.6);
    padding: 4px 12px;
    border-radius: 20px;
}

#ammo {
    position: absolute;
    top: 40px;
    left: 10px;
    font-size: 13px;
    color: #ffdd44;
    background: rgba(0, 0, 0, 0.6);
    padding: 4px 12px;
    border-radius: 20px;
}

#reserve {
    position: absolute;
    top: 72px;
    left: 10px;
    font-size: 13px;
    color: #88ffaa;
    background: rgba(0, 0, 0, 0.6);
    padding: 4px 12px;
    border-radius: 20px;
}

#reloadMsg {
    position: fixed;
    top: 45%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #ffdd44;
    font-size: 18px;
    text-shadow: 2px 2px 6px #000;
    z-index: 29;
    pointer-events: none;
    text-align: center;
    background: rgba(0, 0, 0, 0.75);
    padding: 8px 20px;
    border-radius: 12px;
    opacity: 0;
    transition: opacity 0.2s;
    font-weight: bold;
}

/* ==================== جوی‌استیک ==================== */
#joyZone {
    position: fixed;
    bottom: 15px;
    left: 15px;
    width: 105px;
    height: 105px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.13);
    border: 2px solid rgba(255, 255, 255, 0.35);
    z-index: 20;
    touch-action: none;
}

#joyKnob {
    position: absolute;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.55);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
}

/* ==================== دکمه شلیک ==================== */
#fireBtn {
    position: fixed;
    bottom: 15px;
    right: 15px;
    width: 75px;
    height: 75px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 60, 60, 0.95), rgba(180, 20, 20, 0.95));
    border: 3px solid rgba(255, 255, 255, 0.6);
    z-index: 25;
    color: white;
    font-size: 11px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
    box-shadow: 0 0 18px rgba(255, 0, 0, 0.6);
}

#fireBtn:active {
    transform: scale(0.92);
}

/* ==================== دکمه نارنجک ==================== */
#grenadeBtn {
    position: fixed;
    bottom: 100px;
    right: 100px;
    width: 65px;
    height: 65px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 140, 40, 0.95), rgba(180, 80, 10, 0.95));
    border: 3px solid rgba(255, 255, 255, 0.6);
    z-index: 25;
    color: white;
    font-size: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
    box-shadow: 0 0 15px rgba(255, 140, 40, 0.7);
}

#grenadeBtn:active {
    transform: scale(0.9);
}

/* ==================== دکمه‌های کنار ==================== */
#zoomBtn, #reloadBtn {
    position: fixed;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.55);
    border: 2px solid rgba(255, 255, 255, 0.4);
    color: white;
    font-size: 18px;
    z-index: 22;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
}

#zoomBtn {
    bottom: 98px;
    right: 15px;
}

#reloadBtn {
    bottom: 98px;
    right: 70px;
}

#zoomBtn:active, #reloadBtn:active {
    background: rgba(255, 165, 0, 0.6);
}

/* ==================== دکمه‌های سلاح ==================== */
#weaponBtns {
    position: fixed;
    bottom: 15px;
    left: 130px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    z-index: 22;
}

.wbtn {
    width: 68px;
    height: 30px;
    border-radius: 8px;
    background: rgba(0, 0, 0, 0.55);
    border: 2px solid rgba(255, 255, 255, 0.3);
    color: white;
    font-size: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
}

.wbtn.active {
    background: rgba(255, 165, 0, 0.8);
    border-color: #fff;
    box-shadow: 0 0 12px rgba(255, 165, 0, 0.6);
}

/* ==================== پیام ==================== */
#msg {
    position: fixed;
    top: 25%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: white;
    font-size: 22px;
    text-shadow: 3px 3px 8px #000;
    z-index: 30;
    pointer-events: none;
    text-align: center;
    background: rgba(0, 0, 0, 0.75);
    padding: 12px 24px;
    border-radius: 15px;
    opacity: 0;
    transition: opacity 0.4s;
    font-weight: bold;
}

/* ==================== منو ==================== */
#menuScreen {
    position: fixed;
    inset: 0;
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 15px;
    overflow-y: auto;
}

#menuScreen h1 {
    color: #ffcc00;
    font-size: 26px;
    margin-bottom: 20px;
    text-shadow: 3px 3px 8px #000;
}

#menuRow {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: 25px;
    width: 100%;
    max-width: 1000px;
    flex-wrap: wrap;
}

#startArea {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
    min-width: 220px;
    order: 1;
}

#levelGrid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    width: auto;
    max-width: 500px;
    order: 2;
}

.lvlBtn {
    padding: 14px 10px;
    border-radius: 15px;
    background: linear-gradient(135deg, #3a3a5a, #2a2a4a);
    border: 3px solid #88aaff;
    color: white;
    font-family: Tahoma;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    text-align: center;
    transition: all 0.2s;
    touch-action: manipulation;
}

.lvlBtn:active {
    transform: scale(0.95);
}

.lvlBtn.locked {
    background: linear-gradient(135deg, #2a2a2a, #1a1a1a);
    border-color: #555;
    color: #666;
    cursor: not-allowed;
    pointer-events: none;
    opacity: 0.5;
}

.lvlBtn .num {
    font-size: 20px;
    color: #ffcc00;
    display: block;
    margin-bottom: 4px;
}

.lvlBtn.locked .num {
    color: #666;
}

.lvlBtn .name {
    font-size: 11px;
    color: #ccc;
}

.lvlBtn .stars {
    font-size: 13px;
    color: #ffdd44;
    margin-top: 3px;
    display: block;
}

/* ==================== صفحه پایان ==================== */
#gameOverScreen {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.92);
    color: white;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 110;
    text-align: center;
    padding: 15px;
}

#gameOverScreen h1 {
    font-size: 32px;
    margin-bottom: 10px;
}

#gameOverScreen.win h1 {
    color: #44ff88;
}

#gameOverScreen.lose h1 {
    color: #ff4444;
}

#gameOverScreen p {
    font-size: 14px;
    margin-bottom: 12px;
    color: #ccc;
}

/* ==================== دکمه بزرگ ==================== */
.bigBtn {
    padding: 14px 40px;
    font-size: 18px;
    font-family: Tahoma;
    font-weight: bold;
    color: white;
    background: linear-gradient(135deg, #ff6b00, #ff3300);
    border: 3px solid #ffcc00;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(255, 80, 0, 0.5);
    transition: all 0.2s;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
}

.bigBtn:active {
    transform: scale(0.94);
}

/* ==================== کراس‌هیر ==================== */
#crosshair {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 22px;
    height: 22px;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 15;
}

#crosshair::before,
#crosshair::after {
    content: '';
    position: absolute;
    background: #fff;
    box-shadow: 0 0 4px #000;
}

#crosshair::before {
    left: 50%;
    top: 0;
    width: 2px;
    height: 100%;
    transform: translateX(-50%);
}

#crosshair::after {
    top: 50%;
    left: 0;
    height: 2px;
    width: 100%;
    transform: translateY(-50%);
}

/* ==================== دوربین اسنایپ ==================== */
#scopeOverlay {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 17;
    display: none;
    background: radial-gradient(
        circle at center,
        transparent 0%,
        transparent 22%,
        rgba(0, 0, 0, 0.95) 25%,
        #000 100%
    );
}

#scopeOverlay::before {
    content: '';
    position: absolute;
    left: 50%;
    top: 0;
    bottom: 0;
    width: 2px;
    background: rgba(0, 0, 0, 0.9);
    transform: translateX(-50%);
}

#scopeOverlay::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 0;
    right: 0;
    height: 2px;
    background: rgba(0, 0, 0, 0.9);
    transform: translateY(-50%);
}

/* ==================== آسیب ==================== */
#damageOverlay {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(
        circle,
        transparent 40%,
        rgba(255, 0, 0, 0.6) 100%
    );
    opacity: 0;
    transition: opacity 0.3s;
    z-index: 14;
}

/* ==================== هیت‌مارکر ==================== */
#hitmarker {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 32px;
    height: 32px;
    transform: translate(-50%, -50%) rotate(45deg);
    pointer-events: none;
    z-index: 16;
    display: none;
}

#hitmarker::before,
#hitmarker::after {
    content: '';
    position: absolute;
    background: #ff3333;
}

#hitmarker::before {
    left: 50%;
    top: 0;
    width: 3px;
    height: 100%;
    transform: translateX(-50%);
}

#hitmarker::after {
    top: 50%;
    left: 0;
    height: 3px;
    width: 100%;
    transform: translateY(-50%);
}

/* ==================== چرخش گوشی ==================== */
#rotateMsg {
    display: none;
    position: fixed;
    inset: 0;
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    color: white;
    z-index: 200;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 30px;
}

#rotateMsg .icon {
    font-size: 70px;
    margin-bottom: 20px;
}

#rotateMsg h2 {
    color: #ffcc00;
    font-size: 22px;
    margin-bottom: 15px;
}

@media (orientation: portrait) and (max-width: 768px) {
    #rotateMsg {
        display: flex;
    }
}

@media (max-width: 600px) {
    #menuRow {
        flex-direction: column;
    }
    #startArea {
        order: 1;
    }
    #levelGrid {
        grid-template-columns: repeat(3, 1fr);
        max-width: 400px;
        order: 2;
    }
}
</style>
</head>
<body>

<div id="hud">
    <div id="level">🎯 مرحله 1/7</div>
    <div id="health">❤️ 10</div>
    <div id="enemyCount">👥 0</div>
    <div id="allyCount">🤝 0</div>
    <div id="grenadeCount">💣 3</div>
    <div id="weapon">کلت</div>
    <div id="ammo">🔫 12/12</div>
    <div id="reserve">📦 36</div>
</div>

<div id="crosshair"></div>
<div id="scopeOverlay"></div>
<div id="hitmarker"></div>
<div id="msg"></div>
<div id="reloadMsg"></div>
<div id="damageOverlay"></div>

<div id="joyZone"><div id="joyKnob"></div></div>
<div id="fireBtn">🔥</div>
<div id="grenadeBtn">💣</div>
<div id="zoomBtn">🔍</div>
<div id="reloadBtn">🔄</div>
<div id="weaponBtns">
    <div class="wbtn active" data-w="pistol">کلت</div>
    <div class="wbtn" data-w="rifle">رگبار</div>
    <div class="wbtn" data-w="sniper">اسنایپ</div>
    <div class="wbtn" data-w="shotgun">شات‌گان</div>
</div>

<div id="menuScreen">
    <h1>🎯 میدان جنگ</h1>
    <div id="menuRow">
        <div id="startArea">
            <button id="startFromOneBtn" class="bigBtn">🚀 شروع از مرحله ۱</button>
        </div>
        <div id="levelGrid"></div>
    </div>
</div>

<div id="gameOverScreen">
    <h1 id="gameOverTitle">بازی تمام شد</h1>
    <p id="gameOverMsg"></p>
    <button id="backToMenuBtn" class="bigBtn">🏠 بازگشت به منو</button>
</div>

<div id="rotateMsg">
    <div class="icon">📱</div>
    <h2>گوشی رو افقی بگیر!</h2>
</div>

<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
}
</script>

<script type="module">
import * as THREE from 'three';

/* ==================== تنظیمات مراحل ==================== */
const LEVELS = [
    {
        name: 'چمن',
        emoji: '🌱',
        sky: 0x87CEEB,
        fog: 0x87CEEB,
        fogN: 70,
        fogF: 250,
        ground: 0x3d8b37,
        cover: 0x8B7355,
        tuft: 0x2d6b27,
        enemies: 5,
        gunner: 0,
        speed: 0,
        allies: 0,
        rocks: 8,
        trees: 0
    },
    {
        name: 'جنگل',
        emoji: '🌲',
        sky: 0x6a9a6a,
        fog: 0x5a8a5a,
        fogN: 50,
        fogF: 200,
        ground: 0x3a7a3a,
        cover: 0x7a6a50,
        tuft: 0x2a5a2a,
        enemies: 8,
        gunner: 0.4,
        speed: 0.3,
        allies: 0,
        rocks: 5,
        trees: 25
    },
    {
        name: 'بیابان',
        emoji: '🏜️',
        sky: 0xffa54f,
        fog: 0xffb070,
        fogN: 60,
        fogF: 220,
        ground: 0xd9a860,
        cover: 0x8b6f3a,
        tuft: 0xb89040,
        enemies: 10,
        gunner: 0.6,
        speed: 0.5,
        allies: 1,
        rocks: 15,
        trees: 0
    },
    {
        name: 'برفی',
        emoji: '❄️',
        sky: 0xb8d8e8,
        fog: 0xd8e8f0,
        fogN: 50,
        fogF: 200,
        ground: 0xe8f0f5,
        cover: 0x8fa0b0,
        tuft: 0xffffff,
        enemies: 12,
        gunner: 0.7,
        speed: 0.7,
        allies: 2,
        rocks: 10,
        trees: 10
    },
    {
        name: 'آتشفشان',
        emoji: '🌋',
        sky: 0xaa3a3a,
        fog: 0x8a2a2a,
        fogN: 40,
        fogF: 180,
        ground: 0x5a3a3a,
        cover: 0x6a4030,
        tuft: 0x3a2020,
        enemies: 14,
        gunner: 0.8,
        speed: 1,
        allies: 3,
        rocks: 20,
        trees: 0
    },
    {
        name: 'شب',
        emoji: '🌙',
        sky: 0x2a3a5a,
        fog: 0x304060,
        fogN: 45,
        fogF: 190,
        ground: 0x4a5a6a,
        cover: 0x5a6a7a,
        tuft: 0x3a4a5a,
        enemies: 16,
        gunner: 0.9,
        speed: 1.3,
        allies: 4,
        rocks: 12,
        trees: 15
    },
    {
        name: 'پادشاه',
        emoji: '👑',
        sky: 0x7a4a9a,
        fog: 0x5a3a7a,
        fogN: 35,
        fogF: 160,
        ground: 0x6a4a8a,
        cover: 0x8a6aaa,
        tuft: 0x5a3a7a,
        enemies: 20,
        gunner: 1,
        speed: 1.6,
        allies: 5,
        rocks: 15,
        trees: 8
    }
];

/* ==================== ذخیره پیشرفت ==================== */
let unlockedLevel = 0;
let levelStars = [0, 0, 0, 0, 0, 0, 0];

try {
    const savedUnlocked = localStorage.getItem('meydanUnlocked');
    if (savedUnlocked !== null) {
        unlockedLevel = parseInt(savedUnlocked);
    }
    const savedStars = localStorage.getItem('meydanStars');
    if (savedStars) {
        levelStars = JSON.parse(savedStars);
    }
} catch (e) {
    console.log('localStorage error:', e);
}

let currentLevel = 0;
let enemiesRemaining = 0;

/* ==================== صحنه ==================== */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(
    75,
    innerWidth / innerHeight,
    0.1,
    600
);

const weaponHolder = new THREE.Object3D();
camera.add(weaponHolder);
scene.add(camera);

const renderer = new THREE.WebGLRenderer({
    antialias: true,
    powerPreference: 'high-performance'
});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

/* ==================== نورپردازی ==================== */
const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
scene.add(ambientLight);

const sun = new THREE.DirectionalLight(0xffffff, 0.9);
sun.position.set(50, 100, 50);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -80;
sun.shadow.camera.right = 80;
sun.shadow.camera.top = 80;
sun.shadow.camera.bottom = -80;
scene.add(sun);

/* ==================== تابع ارتفاع زمین ==================== */
function groundHeight(x, z) {
    const dist = Math.sqrt(x * x + z * z);
    const damp = Math.min(1, dist / 20);
    return (
        Math.sin(x * 0.05) * Math.cos(z * 0.05) * 1.5 +
        Math.sin(x * 0.15 + 1) * Math.cos(z * 0.12) * 0.6 +
        Math.sin(x * 0.3) * 0.3
    ) * damp;
}

/* ==================== مدیریت دنیا ==================== */
let groundMesh = null;
let tuftMeshes = [];
let coverMeshes = [];
let rockMeshes = [];
let treeMeshes = [];
const covers = [];

function clearWorld() {
    if (groundMesh) {
        scene.remove(groundMesh);
    }
    tuftMeshes.forEach(t => scene.remove(t));
    coverMeshes.forEach(c => scene.remove(c));
    rockMeshes.forEach(r => scene.remove(r));
    treeMeshes.forEach(t => scene.remove(t));

    tuftMeshes = [];
    coverMeshes = [];
    rockMeshes = [];
    treeMeshes = [];
    covers.length = 0;
}

function buildWorld(L) {
    clearWorld();

    scene.background = new THREE.Color(L.sky);
    scene.fog = new THREE.Fog(L.fog, L.fogN, L.fogF);

    /* --- زمین --- */
    const groundGeo = new THREE.PlaneGeometry(300, 300, 80, 80);
    groundGeo.rotateX(-Math.PI / 2);

    const pos = groundGeo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
