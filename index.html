            nearestEnemy.health -= 50; nearestEnemy.hitTimer = 0.2;
            spawnBulletVisual(carPos, nearestEnemy.group.position.clone().add(new THREE.Vector3(0, 1.2, 0)), 0xffaa00);
            if (nearestEnemy.health <= 0 && !nearestEnemy.dying) startDying(nearestEnemy);
        }
    }
}

const WEAPON_BASE_POS_Y = -0.35;

function updatePlayer(dt) {
    if (playerInCar) {
        const car = playerInCar;
        player.pos.x = car.x; player.pos.z = car.z;
        player.pos.y = groundHeight(car.x, car.z) + 3.2;
        camera.position.copy(player.pos);
        camera.rotation.order = 'YXZ';
        camera.rotation.y = player.yaw; camera.rotation.x = player.pitch; camera.rotation.z = 0;
        return;
    }
    if (reloading) {
        const elapsed = performance.now() / 1000 - reloadStartTime;
        const progress = Math.min(1, elapsed / reloadDuration);
        const dip = Math.sin(progress * Math.PI);
        weaponGroup.position.y = WEAPON_BASE_POS_Y - 0.3 * dip;
        weaponGroup.rotation.z = Math.sin(progress * Math.PI * 4) * 0.1;
        if (progress >= 1) { finishReload(); weaponGroup.rotation.z = 0; }
    }
    if (isJumping) { jumpVelocity -= GRAVITY * dt; jumpHeight += jumpVelocity * dt; if (jumpHeight <= 0) { jumpHeight = 0; jumpVelocity = 0; isJumping = false; } }
    if (!canJump) { jumpCooldown += dt; if (jumpCooldown > 0.3) canJump = true; }
    const fwd = new THREE.Vector3(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
    const right = new THREE.Vector3(Math.cos(player.yaw), 0, -Math.sin(player.yaw));
    let move = new THREE.Vector3();
    if (joyActive && (Math.abs(joyX) > 0.1 || Math.abs(joyY) > 0.1)) { move.add(fwd.clone().multiplyScalar(-joyY)); move.add(right.clone().multiplyScalar(joyX)); }
    if (keysDown['KeyW']) move.add(fwd);
    if (keysDown['KeyS']) move.sub(fwd);
    if (keysDown['KeyD']) move.add(right);
    if (keysDown['KeyA']) move.sub(right);
    const moving = move.length() > 0;
    if (moving) {
        move.normalize();
        const speed = player.speed * dt;
        let nx = player.pos.x + move.x * speed, nz = player.pos.z + move.z * speed;
        for (const c of covers) { const dx = nx - c.mesh.position.x, dz = nz - c.mesh.position.z; if (Math.abs(dx) < c.w / 2 + 0.4 && Math.abs(dz) < c.d / 2 + 0.4) { if (Math.abs(dx) > Math.abs(dz)) nx = player.pos.x; else nz = player.pos.z; } }
        for (const car of cars) { if (car.exploded) continue; const dx = nx - car.x, dz = nz - car.z; const cd = Math.hypot(dx, dz); if (cd < car.radius + 0.6) { if (cd > 0.01) { const pushX = dx / cd, pushZ = dz / cd; nx = car.x + pushX * (car.radius + 0.7); nz = car.z + pushZ * (car.radius + 0.7); } } }
        nx = Math.max(-140, Math.min(140, nx)); nz = Math.max(-140, Math.min(140, nz));
        player.pos.x = nx; player.pos.z = nz; player.bobTime += dt * 12;
    } else player.bobTime *= 0.95;
    player.pos.y = groundHeight(player.pos.x, player.pos.z) + player.height + jumpHeight;
    const w = WEAPONS[currentWeapon];
    const hasScope = weaponScopes[currentWeapon] || false;
    const zoomMultiplier = hasScope ? w.zoom : (player.zooming ? w.zoom * 0.5 : 1);
    const targetFov = player.zooming ? 75 / zoomMultiplier : 75;
    camera.fov += (targetFov - camera.fov) * Math.min(1, dt * 12);
    camera.updateProjectionMatrix();
    const crosshairEl = document.getElementById('crosshair');
    if (player.zooming && weaponScopes[currentWeapon]) crosshairEl.style.display = 'none';
    else crosshairEl.style.display = 'block';
    if (player.recoilPitch > 0.0001) { player.recoilPitch *= 0.82; player.recoilRoll *= 0.82; }
    else { player.recoilPitch = 0; player.recoilRoll = 0; }
}

function updateWeaponSway(dt) {
    if (playerInCar) { weaponGroup.position.set(0, -10, 0); return; }
    const hasScope = weaponScopes[currentWeapon] || false;
    if (player.zooming && hasScope) { weaponGroup.visible = false; return; }
    else weaponGroup.visible = true;
    const bobX = Math.sin(player.bobTime) * 0.008;
    const bobY = Math.abs(Math.cos(player.bobTime)) * 0.012;
    const isMoving = joyActive || keysDown['KeyW'] || keysDown['KeyA'] || keysDown['KeyS'] || keysDown['KeyD'];
    const tbx = isMoving ? bobX : 0;
    const tby = isMoving ? bobY : 0;
    const zf = camera.fov / 75;
    const bx = 0.35 * (0.4 + zf * 0.6);
    const by = WEAPON_BASE_POS_Y * (0.4 + zf * 0.6);
    const bz = -0.7;
    const rb = player.recoilOffset;
    const ru = player.recoilOffset * 0.6;
    if (player.recoilOffset > 0.001) player.recoilOffset *= 0.78;
    else player.recoilOffset = 0;
    if (!reloading) {
        weaponGroup.position.x += (bx + tbx - weaponGroup.position.x) * Math.min(1, dt * 15);
        weaponGroup.position.y += (by + tby + ru - weaponGroup.position.y) * Math.min(1, dt * 20);
        weaponGroup.position.z += (bz + rb - weaponGroup.position.z) * Math.min(1, dt * 20);
    }
    weaponGroup.rotation.x = -player.recoilOffset * 3;
    weaponGroup.rotation.z = player.recoilRoll * 2;
}

function drawRadar() {
    if (!radarCtx) return;
    const w = radarCanvas.width, h = radarCanvas.height;
    const cx = w / 2, cy = h / 2, radius = w / 2 - 5;
    radarCtx.clearRect(0, 0, w, h);
    radarCtx.beginPath(); radarCtx.arc(cx, cy, radius, 0, Math.PI * 2);
    radarCtx.fillStyle = 'rgba(0, 30, 0, 0.9)'; radarCtx.fill();
    radarCtx.strokeStyle = 'rgba(0, 255, 0, 0.3)'; radarCtx.lineWidth = 1;
    for (let i = 1; i <= 3; i++) { radarCtx.beginPath(); radarCtx.arc(cx, cy, radius * i / 3, 0, Math.PI * 2); radarCtx.stroke(); }
    radarCtx.beginPath(); radarCtx.moveTo(cx, cy - radius); radarCtx.lineTo(cx, cy + radius); radarCtx.moveTo(cx - radius, cy); radarCtx.lineTo(cx + radius, cy); radarCtx.stroke();
    radarCtx.save(); radarCtx.beginPath(); radarCtx.arc(cx, cy, radius, 0, Math.PI * 2); radarCtx.clip();
    const rot = -player.yaw - Math.PI / 2;
    function worldToRadar(wx, wz) {
        const dx = wx - player.pos.x, dz = wz - player.pos.z;
        const rx = dx * Math.cos(rot) - dz * Math.sin(rot);
        const rz = dx * Math.sin(rot) + dz * Math.cos(rot);
        return { x: cx + rx * RADAR_SCALE, y: cy + rz * RADAR_SCALE, dist: Math.sqrt(dx * dx + dz * dz) };
    }
    for (const p of pickups) { const rp = worldToRadar(p.mesh.position.x, p.mesh.position.z); if (rp.dist > RADAR_RANGE) continue; radarCtx.beginPath(); radarCtx.arc(rp.x, rp.y, 3, 0, Math.PI * 2); radarCtx.fillStyle = p.type === 'health' ? '#ff4444' : '#44ff44'; radarCtx.fill(); }
    for (const ally of allies) { if (!ally.alive) continue; const rp = worldToRadar(ally.group.position.x, ally.group.position.z); if (rp.dist > RADAR_RANGE) continue; radarCtx.beginPath(); radarCtx.arc(rp.x, rp.y, 4, 0, Math.PI * 2); radarCtx.fillStyle = '#00ff88'; radarCtx.fill(); }
    for (const enemy of enemies) { if (!enemy.alive || enemy.dying) continue; const rp = worldToRadar(enemy.group.position.x, enemy.group.position.z); if (rp.dist > RADAR_RANGE) continue; radarCtx.beginPath(); radarCtx.arc(rp.x, rp.y, 4, 0, Math.PI * 2); radarCtx.fillStyle = '#ff2222'; radarCtx.fill(); }
    for (const car of cars) { if (car.exploded) continue; const rp = worldToRadar(car.x, car.z); if (rp.dist > RADAR_RANGE) continue; radarCtx.fillStyle = car.isBlackTurret ? '#ff00ff' : '#ffdd00'; radarCtx.fillRect(rp.x - 5, rp.y - 5, 10, 10); }
    for (const w of worshippers) { if (!w.alive) continue; const rp = worldToRadar(w.group.position.x, w.group.position.z); if (rp.dist > RADAR_RANGE) continue; radarCtx.beginPath(); radarCtx.arc(rp.x, rp.y, 3, 0, Math.PI * 2); radarCtx.fillStyle = '#ffffaa'; radarCtx.fill(); }
    if (boss && boss.alive) { const rp = worldToRadar(boss.group.position.x, boss.group.position.z); if (rp.dist < RADAR_RANGE * 1.5) { radarCtx.beginPath(); radarCtx.arc(rp.x, rp.y, 9, 0, Math.PI * 2); radarCtx.fillStyle = '#ff00ff'; radarCtx.fill(); } }
    if (miniBoss && miniBoss.alive) { const rp = worldToRadar(miniBoss.group.position.x, miniBoss.group.position.z); if (rp.dist < RADAR_RANGE * 1.5) { radarCtx.beginPath(); radarCtx.arc(rp.x, rp.y, 6, 0, Math.PI * 2); radarCtx.fillStyle = '#ff8800'; radarCtx.fill(); } }
    radarCtx.save(); radarCtx.translate(cx, cy);
    radarCtx.beginPath(); radarCtx.moveTo(0, -7); radarCtx.lineTo(-5, 5); radarCtx.lineTo(5, 5); radarCtx.closePath();
    radarCtx.fillStyle = '#ffffff'; radarCtx.fill(); radarCtx.restore(); radarCtx.restore();
    radarCtx.beginPath(); radarCtx.arc(cx, cy, radius, 0, Math.PI * 2); radarCtx.strokeStyle = 'rgba(0, 255, 0, 0.8)'; radarCtx.lineWidth = 2; radarCtx.stroke();
}

function updatePickups(dt) {
    for (let i = pickups.length - 1; i >= 0; i--) {
        const p = pickups[i];
        p.bob += dt * 3;
        p.mesh.position.y = groundHeight(p.mesh.position.x, p.mesh.position.z) + 1 + Math.sin(p.bob) * 0.2;
        p.mesh.rotation.y += dt;
        const dx = p.mesh.position.x - player.pos.x, dz = p.mesh.position.z - player.pos.z;
        if (dx * dx + dz * dz < 4) {
            if (p.type === 'ammo') { for (const k in ammo) ammo[k] = WEAPONS[k].maxAmmo; for (const k in reserve) reserve[k] = WEAPONS[k].reserveMax; updateAmmoUI(); updateReserveUI(); showMsg('🔫 مهمات پر شد!', 1); }
            else { player.health = Math.min(player.maxHealth, player.health + 3); updateHealthUI(); showMsg('❤️ جان +3', 1); }
            scene.remove(p.mesh); pickups.splice(i, 1);
        }
    }
}

function updateBullets(dt) {
    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.traveled += b.speed * dt;
        b.mesh.position.copy(b.startPos).add(b.dir.clone().multiplyScalar(b.traveled));
        if (b.traveled > b.maxDist) { scene.remove(b.mesh); bullets.splice(i, 1); }
    }
}

function buildWorshipLevel() {
    const baseX = 0, baseZ = 10, rowGap = 1.6, colGap = 1.4;
    createWorshipper(baseX, baseZ - 5, true, 0, 0);
    let count = 1;
    for (let row = 0; row < 9 && count < 50; row++) {
        for (let col = 0; col < 5 && count < 50; col++) {
            const xOffset = (col - 2) * colGap;
            const zOffset = rowGap * (row + 1);
            createWorshipper(baseX + xOffset, baseZ - 5 + zOffset, false, row + 1, col);
            count++;
        }
    }
    updateWorshippersUI();
}

function startLevel(levelIndex) {
    applyUpgrades();
    currentLevel = levelIndex;
    const L = LEVELS[levelIndex];
    buildWorld(L);
    enemies.forEach(e => scene.remove(e.group)); allies.forEach(a => scene.remove(a.group)); worshippers.forEach(w => scene.remove(w.group));
    if (boss) scene.remove(boss.group); if (miniBoss) scene.remove(miniBoss.group);
    enemies = []; allies = []; worshippers = [];
    boss = null; bossSpawned = false; isWorshipMode = false; miniBoss = null; worshipEnemiesSpawned = 0;
    playerInCar = null;
    document.getElementById('worshippersCount').style.display = 'none';
    document.getElementById('timer').style.display = 'none';
    document.getElementById('bossHealth').style.display = 'none';
    enterCarBtn.style.display = 'none';
    if (L.isWorshipLevel) {
        isWorshipMode = true; worshipTimer = 180; worshippersRemaining = 50; waveTimer = 0; waveCount = 0; worshipEnemiesSpawned = 0;
        player.maxHealth = 10;
        document.getElementById('worshippersCount').style.display = 'block';
        document.getElementById('timer').style.display = 'block';
        updateTimerUI(); updateWorshippersUI();
        buildWorshipLevel();
        for (let i = 0; i < 5; i++) { const a = (i / 5) * Math.PI * 2; createAlly(Math.cos(a) * 8, Math.sin(a) * 8); }
        player.pos.set(0, 0, 15); player.yaw = Math.PI;
        showMsg('🕌 از نمازگزاران محافظت کن! فقط ۵۰ دشمن میاد', 4);
    } else {
        for (let i = 0; i < L.enemies; i++) {
            const a = Math.random() * Math.PI * 2, r = 25 + Math.random() * 60;
            const hasGun = Math.random() < L.gunner;
            createEnemy(Math.cos(a) * r, Math.sin(a) * r, hasGun, L.speed);
        }
        enemiesRemaining = L.enemies; updateEnemyCountUI();
        for (let i = 0; i < L.allies; i++) { const a = (i / L.allies) * Math.PI * 2; createAlly(player.pos.x + Math.cos(a) * 5, player.pos.z + Math.sin(a) * 5); }
        updateAllyCountUI();
        player.pos.set(0, 0, 0); player.yaw = 0;
        if (L.hasMiniBoss) {
            createMiniBoss(20, 20, levelIndex);
            document.getElementById('bossHealth').style.display = 'block';
            updateBossUI();
            showMsg(`🎯 مرحله ${levelIndex + 1}: ${L.emoji} ${L.name} - مینی‌باس!`, 3);
        } else showMsg(`🎯 مرحله ${levelIndex + 1}: ${L.emoji} ${L.name}`, 2.5);
        player.maxHealth = 10;
    }
    player.pitch = 0; player.health = player.maxHealth;
    updateHealthUI(); updateArmorUI();
    for (const k in ammo) ammo[k] = WEAPONS[k].maxAmmo;
    for (const k in reserve) reserve[k] = WEAPONS[k].reserveMax;
    updateAmmoUI(); updateReserveUI();
    grenadeCount = 3; updateGrenadeUI();
    isJumping = false; jumpHeight = 0; jumpVelocity = 0; canJump = true; jumpCooldown = 0;
    lockedEnemy = null; lockBreakCooldown = 0; lookDragDistance = 0;
    lockIndicator.style.display = 'none'; lockText.style.display = 'none';
    reloading = false; document.getElementById('reloadMsg').style.opacity = 0;
    pickups.forEach(p => scene.remove(p.mesh)); pickups = []; buildPickups();
    grenades.forEach(g => scene.remove(g.mesh)); grenades = [];
    explosionParticles.forEach(p => scene.remove(p.mesh)); explosionParticles = [];
    bullets.forEach(b => scene.remove(b.mesh)); bullets = [];
    bloodParticles.forEach(b => scene.remove(b.mesh)); bloodParticles = [];
    rpgMissiles.forEach(m => scene.remove(m.mesh)); rpgMissiles.length = 0;
    if (player.zooming) { player.zooming = false; scopeOverlay.style.display = 'none'; }
    updateScopesVisibility();
    updateWeaponHUD();
    updateLevelUI();
}

let waveTimer = 0, waveCount = 0;

function spawnWorshipWave(dt) {
    if (!isWorshipMode || bossSpawned) return;
    if (worshipEnemiesSpawned >= WORSHIP_TOTAL_ENEMIES) return;
    waveTimer += dt;
    const interval = Math.max(2.5, 5 - waveCount * 0.2);
    if (waveTimer >= interval) {
        waveTimer = 0; waveCount++;
        const remaining = WORSHIP_TOTAL_ENEMIES - worshipEnemiesSpawned;
        const numEnemies = Math.min(2 + Math.floor(waveCount / 2), 5, remaining);
        for (let i = 0; i < numEnemies; i++) {
            const a = Math.random() * Math.PI * 2, r = 50 + Math.random() * 30;
            const x = player.pos.x + Math.cos(a) * r, z = player.pos.z + Math.sin(a) * r;
            const hasGun = Math.random() < 0.6;
            createEnemy(x, z, hasGun, 0.8 + waveCount * 0.05);
            worshipEnemiesSpawned++;
        }
        enemiesRemaining = enemies.filter(e => e.alive).length;
        updateEnemyCountUI();
    }
}

let gameOver = false, running = false, clockLast = performance.now();

function resetGame(startFromLevel = 0) {
    applyUpgrades();
    enemies.forEach(e => scene.remove(e.group)); allies.forEach(a => scene.remove(a.group)); worshippers.forEach(w => scene.remove(w.group));
    if (boss) scene.remove(boss.group); if (miniBoss) scene.remove(miniBoss.group);
    pickups.forEach(p => scene.remove(p.mesh)); bullets.forEach(b => scene.remove(b.mesh));
    grenades.forEach(g => scene.remove(g.mesh)); explosionParticles.forEach(p => scene.remove(p.mesh));
    bloodParticles.forEach(b => scene.remove(b.mesh)); rpgMissiles.forEach(m => scene.remove(m.mesh));
    enemies = []; allies = []; worshippers = []; pickups = []; bullets = [];
    grenades = []; explosionParticles = []; bloodParticles = []; rpgMissiles.length = 0;
    boss = null; bossSpawned = false; miniBoss = null; playerInCar = null;
    gameOver = false; firing = false; joyActive = false; joyX = 0; joyY = 0;
    joyKnob.style.transform = 'translate(-50%,-50%)';
    enterCarBtn.style.display = 'none';
    currentWeapon = 'pistol';
    showWeaponModel('pistol'); updateMuzzlePos(); updateWeaponHUD();
    document.querySelectorAll('.wbtn').forEach(b => b.classList.toggle('active', b.dataset.w === 'pistol'));
    player.zooming = false; scopeOverlay.style.display = 'none';
    lockedEnemy = null; lockBreakCooldown = 0; lookDragDistance = 0;
    lockIndicator.style.display = 'none'; lockText.style.display = 'none';
    startLevel(startFromLevel);
}

const menuScreen = document.getElementById('menuScreen');
const levelGrid = document.getElementById('levelGrid');
const gameOverScreen = document.getElementById('gameOverScreen');
const backToMenuBtn = document.getElementById('backToMenuBtn');
const gameOverTitle = document.getElementById('gameOverTitle');
const gameOverMsg = document.getElementById('gameOverMsg');
const startFromOneBtn = document.getElementById('startFromOneBtn');
const upgradeBtn = document.getElementById('upgradeBtn');
const upgradeScreen = document.getElementById('upgradeScreen');
const upgradeList = document.getElementById('upgradeList');
const backFromUpgrade = document.getElementById('backFromUpgrade');

function buildMenu() {
    updateMoneyDisplay();
    levelGrid.innerHTML = '';
    for (let i = 0; i < LEVELS.length; i++) {
        const L = LEVELS[i];
        const btn = document.createElement('div');
        btn.className = 'lvlBtn' + (i > unlockedLevel ? ' locked' : '');
        if (L.isWorshipLevel) btn.classList.add('special');
        if (L.hasMiniBoss) btn.classList.add('miniBoss');
        const stars = levelStars[i] || 0;
        const starsStr = stars > 0 ? ('★'.repeat(stars) + '☆'.repeat(3 - stars)) : '';
        btn.innerHTML = `<span class="num">${i + 1}</span><span class="name">${L.emoji} ${L.name}</span><span class="stars">${starsStr}</span>`;
        if (i <= unlockedLevel) {
            btn.addEventListener('click', () => startGameFromLevel(i));
            btn.addEventListener('touchend', e => { e.preventDefault(); e.stopPropagation(); startGameFromLevel(i); }, { passive: false });
        }
        levelGrid.appendChild(btn);
    }
}

function startGameFromLevel(idx) {
    menuScreen.style.display = 'none';
    gameOverScreen.style.display = 'none';
    upgradeScreen.style.display = 'none';
    resetGame(idx);
    running = true;
    clockLast = performance.now();
}

function showMenu() {
    running = false; gameOver = false;
    menuScreen.style.display = 'flex';
    upgradeScreen.style.display = 'none';
    buildMenu();
    gameOverScreen.style.display = 'none';
}

function endGame(won) {
    gameOver = true; running = false;
    if (isWorshipMode) {
        const alive = worshippers.filter(w => w.alive).length;
        if (boss && !boss.alive) won = true;
        else if (alive < 25) won = false;
    }
    if (won) {
        const reward = getLevelReward(currentLevel);
        money += reward;
        if (money > 100000) money = 100000;
        saveMoney();
        updateMoneyDisplay();
    }
    if (won) {
        const stars = player.health >= player.maxHealth ? 3 : 1;
        if (stars > levelStars[currentLevel]) { levelStars[currentLevel] = stars; try { localStorage.setItem('meydanStars40', JSON.stringify(levelStars)); } catch (e) {} }
        if (currentLevel === unlockedLevel && currentLevel < LEVELS.length - 1) { unlockedLevel = currentLevel + 1; try { localStorage.setItem('meydanUnlocked40', unlockedLevel); } catch (e) {} }
        gameOverScreen.classList.add('win'); gameOverScreen.classList.remove('lose');
        gameOverTitle.textContent = '🏆 بردی!';
        gameOverMsg.textContent = isWorshipMode ? `جعفر طیاره نابود شد! +${getLevelReward(currentLevel).toLocaleString('fa-IR')} تومان` : (stars === 3 ? '⭐⭐⭐ عالی!' : '⭐ خوب بود!');
    } else {
        gameOverScreen.classList.add('lose'); gameOverScreen.classList.remove('win');
        gameOverTitle.textContent = '💀 باختی!';
        gameOverMsg.textContent = isWorshipMode ? 'نمازگزاران کشته شدند...' : `مرحله ${currentLevel + 1}`;
    }
    gameOverScreen.style.display = 'flex';
}

function updateMoneyDisplay() {
    const el = document.getElementById('moneyDisplay');
    if (el) el.innerHTML = `💰 پول: ${money.toLocaleString('fa-IR')} &nbsp;|&nbsp; 🛡️ جلیقه: ${armor}/${MAX_ARMOR}`;
    const hudEl = document.getElementById('moneyHud');
    if (hudEl) hudEl.textContent = `💰 ${money.toLocaleString('fa-IR')}`;
    updateArmorUI();
}

function renderUpgradeList() {
    const moneyEl = document.getElementById('upgradeMoney');
    moneyEl.textContent = `💰 پول: ${money.toLocaleString('fa-IR')}`;
    upgradeList.innerHTML = '';
    const weaponNames = { pistol: 'کلت 🔫', rifle: 'رگبار 🔫', sniper: 'اسنایپ 🎯', shotgun: 'شات‌گان 💥', heavy: 'دوشگاه 🔥', rpg: 'آرپی‌جی 🚀', turret: 'مسلسل ⚙️' };
    for (const key in WEAPONS) {
        const w = WEAPONS[key];
        const lvl = weaponUpgrades[key] || 0;
        const cost = getUpgradeCost(key);
        const canUpgrade = lvl < MAX_UPGRADE && money >= cost;
        const isMax = lvl >= MAX_UPGRADE;
        const hasScope = weaponScopes[key] || false;
        const canBuyScope = !hasScope && money >= SCOPE_COST;
        const card = document.createElement('div');
        card.style.cssText = `background: linear-gradient(135deg, #2a2a4a, #1a1a3a); border: 2px solid ${isMax ? '#ffcc00' : '#88aaff'}; border-radius: 12px; padding: 12px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5);`;
        const levelBars = '█'.repeat(lvl) + '░'.repeat(MAX_UPGRADE - lvl);
        card.innerHTML = `
            <div style="font-size: 16px; font-weight: bold; color: #ffcc00; margin-bottom: 8px;">${weaponNames[key]}</div>
            <div style="font-size: 12px; color: #aaa; margin-bottom: 5px;">سطح: <span style="color: #ffaa00;">${lvl}/${MAX_UPGRADE}</span></div>
            <div style="font-size: 14px; color: #44ff88; margin-bottom: 8px; font-family: monospace;">${levelBars}</div>
            <div style="font-size: 11px; color: #ddd; margin-bottom: 4px;">💥 قدرت: ${w.damage}</div>
            <div style="font-size: 11px; color: #ddd; margin-bottom: 4px;">📦 فشنگ: ${w.maxAmmo} + ${w.reserveMax}</div>
            <div style="font-size: 11px; color: #ddd; margin-bottom: 8px;">🔍 زوم: ${w.zoom.toFixed(1)}x ${hasScope ? '📷' : ''}</div>
            ${isMax ? '<div style="color: #ffcc00; font-weight: bold; font-size: 13px; margin-bottom: 5px;">✅ حداکثر سطح قدرت</div>'
                : `<button class="upgradeActionBtn" data-weapon="${key}" style="width: 100%; padding: 8px; border-radius: 8px; border: none; margin-bottom: 5px; background: ${canUpgrade ? 'linear-gradient(135deg, #44aa44, #226622)' : 'linear-gradient(135deg, #555, #333)'}; color: white; font-weight: bold; font-size: 13px; cursor: ${canUpgrade ? 'pointer' : 'not-allowed'}; font-family: Tahoma; opacity: ${canUpgrade ? 1 : 0.6};" ${canUpgrade ? '' : 'disabled'}>💰 ارتقا: ${cost.toLocaleString('fa-IR')}</button>`}
            ${hasScope ? '<div style="color: #44ff88; font-weight: bold; font-size: 12px; padding: 6px; background: rgba(0,100,0,0.3); border-radius: 8px;">📷 دوربین نصب شده</div>'
                : `<button class="buyScopeBtn" data-weapon="${key}" style="width: 100%; padding: 8px; border-radius: 8px; border: none; background: ${canBuyScope ? 'linear-gradient(135deg, #4488ff, #2244aa)' : 'linear-gradient(135deg, #555, #333)'}; color: white; font-weight: bold; font-size: 13px; cursor: ${canBuyScope ? 'pointer' : 'not-allowed'}; font-family: Tahoma; opacity: ${canBuyScope ? 1 : 0.6};" ${canBuyScope ? '' : 'disabled'}>📷 دوربین: ${SCOPE_COST.toLocaleString('fa-IR')}</button>`}
        `;
        upgradeList.appendChild(card);
    }
    // کارت جلیقه
    const armorCard = document.createElement('div');
    armorCard.style.cssText = `background: linear-gradient(135deg, #1a2a4a, #0a1a3a); border: 2px solid ${armor >= MAX_ARMOR ? '#ffcc00' : '#66ccff'}; border-radius: 12px; padding: 12px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5);`;
    const isMaxArmor = armor >= MAX_ARMOR;
    const canBuyArmor = !isMaxArmor && money >= ARMOR_PACK_COST;
    const armorBars = '█'.repeat(Math.floor(armor / 10)) + '░'.repeat(8 - Math.floor(armor / 10));
    armorCard.innerHTML = `
        <div style="font-size: 16px; font-weight: bold; color: #66ccff; margin-bottom: 8px;">🛡️ جلیقه نجات</div>
        <div style="font-size: 12px; color: #aaa; margin-bottom: 5px;">مقدار: <span style="color: #66ccff;">${armor}/${MAX_ARMOR}</span></div>
        <div style="font-size: 14px; color: #44ff88; margin-bottom: 8px; font-family: monospace;">${armorBars}</div>
        <div style="font-size: 11px; color: #ddd; margin-bottom: 4px;">📦 هر بسته: +${ARMOR_PACK_SIZE} جلیقه</div>
        <div style="font-size: 11px; color: #ddd; margin-bottom: 8px;">💡 جلیقه اول آسیب رو جذب می‌کنه</div>
        ${isMaxArmor ? '<div style="color: #ffcc00; font-weight: bold; font-size: 13px; padding: 8px;">✅ حداکثر جلیقه</div>'
            : `<button id="buyArmorBtn" style="width: 100%; padding: 8px; border-radius: 8px; border: none; background: ${canBuyArmor ? 'linear-gradient(135deg, #4488ff, #2244aa)' : 'linear-gradient(135deg, #555, #333)'}; color: white; font-weight: bold; font-size: 13px; cursor: ${canBuyArmor ? 'pointer' : 'not-allowed'}; font-family: Tahoma; opacity: ${canBuyArmor ? 1 : 0.6};" ${canBuyArmor ? '' : 'disabled'}>💰 خرید: ${ARMOR_PACK_COST.toLocaleString('fa-IR')}</button>`}
    `;
    upgradeList.appendChild(armorCard);
    // اتصال دکمه‌ها
    upgradeList.querySelectorAll('.upgradeActionBtn').forEach(btn => {
        const handler = (e) => { e.preventDefault(); e.stopPropagation(); tryUpgradeWeapon(btn.dataset.weapon); };
        btn.addEventListener('click', handler);
        btn.addEventListener('touchend', handler, { passive: false });
    });
    upgradeList.querySelectorAll('.buyScopeBtn').forEach(btn => {
        const handler = (e) => { e.preventDefault(); e.stopPropagation(); tryBuyScope(btn.dataset.weapon); };
        btn.addEventListener('click', handler);
        btn.addEventListener('touchend', handler, { passive: false });
    });
    const buyArmorBtn = document.getElementById('buyArmorBtn');
    if (buyArmorBtn) {
        const handler = (e) => { e.preventDefault(); e.stopPropagation(); tryBuyArmor(); };
        buyArmorBtn.addEventListener('click', handler);
        buyArmorBtn.addEventListener('touchend', handler, { passive: false });
    }
}

function tryUpgradeWeapon(key) {
    const lvl = weaponUpgrades[key] || 0;
    if (lvl >= MAX_UPGRADE) { showMsg('✅ این سلاح در حداکثر سطحه!', 2); return; }
    const cost = getUpgradeCost(key);
    if (money < cost) { showMsg('❌ پول کافی نداری!', 2); return; }
    money -= cost;
    weaponUpgrades[key] = lvl + 1;
    saveMoney(); saveUpgrades(); applyUpgrades();
    updateMoneyDisplay(); renderUpgradeList();
    showMsg(`✅ ${WEAPONS[key].name} ارتقا یافت! سطح ${lvl + 1}`, 2);
}

function tryBuyScope(key) {
    if (weaponScopes[key]) { showMsg('📷 این سلاح دوربین داره!', 2); return; }
    if (money < SCOPE_COST) { showMsg('❌ پول کافی نداری!', 2); return; }
    money -= SCOPE_COST;
    weaponScopes[key] = true;
    saveMoney(); saveScopes(); applyUpgrades(); updateScopesVisibility();
    updateMoneyDisplay(); renderUpgradeList();
    showMsg(`📷 دوربین روی ${WEAPONS[key].name} نصب شد! زوم ۲ برابر شد`, 2.5);
}

function tryBuyArmor() {
    if (armor >= MAX_ARMOR) { showMsg('🛡️ جلیقه‌هات پره!', 2); return; }
    if (money < ARMOR_PACK_COST) { showMsg('❌ پول کافی نداری!', 2); return; }
    money -= ARMOR_PACK_COST;
    armor = Math.min(MAX_ARMOR, armor + ARMOR_PACK_SIZE);
    saveMoney(); saveArmor(); updateMoneyDisplay(); updateArmorUI(); renderUpgradeList();
    showMsg(`🛡️ ${ARMOR_PACK_SIZE} جلیقه اضافه شد! (${armor}/${MAX_ARMOR})`, 2.5);
}

function openUpgradeScreen() {
    menuScreen.style.display = 'none';
    upgradeScreen.style.display = 'flex';
    renderUpgradeList();
}
function closeUpgradeScreen() {
    upgradeScreen.style.display = 'none';
    menuScreen.style.display = 'flex';
    updateMoneyDisplay();
}

upgradeBtn.addEventListener('click', openUpgradeScreen);
upgradeBtn.addEventListener('touchend', e => { e.preventDefault(); e.stopPropagation(); openUpgradeScreen(); }, { passive: false });
backFromUpgrade.addEventListener('click', closeUpgradeScreen);
backFromUpgrade.addEventListener('touchend', e => { e.preventDefault(); e.stopPropagation(); closeUpgradeScreen(); }, { passive: false });

backToMenuBtn.addEventListener('click', () => { gameOverScreen.style.display = 'none'; showMenu(); });
backToMenuBtn.addEventListener('touchend', e => { e.preventDefault(); e.stopPropagation(); gameOverScreen.style.display = 'none'; showMenu(); }, { passive: false });
startFromOneBtn.addEventListener('click', () => startGameFromLevel(0));
startFromOneBtn.addEventListener('touchend', e => { e.preventDefault(); e.stopPropagation(); startGameFromLevel(0); }, { passive: false });

// ساخت مدل‌های دوربین روی سلاح‌ها
attachScopesToWeapons();
updateScopesVisibility();

function animate() {
    requestAnimationFrame(animate);
    const now = performance.now() / 1000;
    const dt = Math.min(0.05, (performance.now() - clockLast) / 1000);
    clockLast = performance.now();
    updateFlash(dt); updateWeaponSway(dt); updateBlood(dt); updateAutoLock(dt); drawRadar();
    if (running && !gameOver) {
        updateCarProximity();
        if (firing) {
            if (playerInCar) shootCarTurret(now);
            else { const w = WEAPONS[currentWeapon]; if (w.auto || now - player.lastShot > w.fireRate) shoot(now); }
        }
        updatePlayer(dt); updateEnemies(dt, now); updateAllies(dt, now);
        updateBoss(dt, now); updateMiniBoss(dt, now); updateCarTurrets(dt, now);
        updatePickups(dt); updateBullets(dt); updateGrenades(dt); updateRPGMissiles(dt);
        if (isWorshipMode && !bossSpawned) {
            worshipTimer -= dt; updateTimerUI(); spawnWorshipWave(dt);
            if (worshipTimer <= 0) {
                bossSpawned = true;
                document.getElementById('timer').style.display = 'none';
                document.getElementById('bossHealth').style.display = 'block';
                createBoss();
                showMsg('👹 جعفر طیاره آمد! او را بکش!', 5);
            }
        }
        if (!playerInCar) {
            const bobY = Math.sin(player.bobTime * 2) * 0.04;
            camera.position.copy(player.pos); camera.position.y += bobY;
            camera.rotation.order = 'YXZ';
            camera.rotation.y = player.yaw;
            camera.rotation.x = player.pitch + player.recoilPitch;
            camera.rotation.z = player.recoilRoll;
        }
        if (player.health <= 0) endGame(false);
        else if (!isWorshipMode && enemiesRemaining <= 0 && (!miniBoss || !miniBoss.alive)) endGame(true);
        else if (isWorshipMode) { const alive = worshippers.filter(w => w.alive).length; if (alive === 0 && bossSpawned) endGame(false); }
    }
    if (msgTimer > 0 && msgTimer < 100) { msgTimer -= dt; if (msgTimer <= 0) document.getElementById('msg').style.opacity = 0; }
    renderer.render(scene, camera);
}

addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

updateAmmoUI(); updateHealthUI(); updateEnemyCountUI(); updateAllyCountUI();
updateGrenadeUI(); updateLevelUI(); updateArmorUI();
showWeaponModel('pistol'); updateMuzzlePos(); updateWeaponHUD();
buildMenu(); animate();
</script>
