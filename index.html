<style>

canvas { display: block; }

#allyCount { position: absolute; top: 104px; right: 10px; font-size: 13px; color: #88ff88; background: rgba(0, 0, 0, 0.6); padding: 4px 12px; border-radius: 20px; }
#worshippersCount { position: absolute; top: 136px; right: 10px; font-size: 13px; color: #ffdd44; background: rgba(0, 0, 0, 0.6); padding: 4px 12px; border-radius: 20px; display: none; }
#grenadeCount { position: absolute; top: 168px; right: 10px; font-size: 13px; color: #ffaa66; background: rgba(0, 0, 0, 0.6); padding: 4px 12px; border-radius: 20px; }
#moneyHud { position: absolute; top: 200px; right: 10px; font-size: 13px; color: #ffcc00; background: rgba(0, 0, 0, 0.6); padding: 4px 12px; border-radius: 20px; }
#bossHealth { position: absolute; top: 50px; left: 50%; transform: translateX(-50%); width: 60%; max-width: 400px; height: 18px; background: rgba(0, 0, 0, 0.7); border: 2px solid #ff2222; border-radius: 10px; display: none; z-index: 11; }
#bossHealthBar { height: 100%; width: 100%; background: linear-gradient(90deg, #ff0000, #aa0000); border-radius: 8px; transition: width 0.3s; }
#bossHealthText { position: absolute; top: 0; left: 0; right: 0; bottom: 0; text-align: center; color: white; font-size: 12px; font-weight: bold; text-shadow: 1px 1px 2px #000; line-height: 14px; }
#weapon { position: absolute; top: 8px; left: 10px; font-size: 14px; color: #ffaa00; background: rgba(0, 0, 0, 0.6); padding: 4px 12px; border-radius: 20px; }
#ammo { position: absolute; top: 40px; left: 10px; font-size: 13px; color: #ffdd44; background: rgba(0, 0, 0, 0.6); padding: 4px 12px; border-radius: 20px; }
#reserve { position: absolute; top: 72px; left: 10px; font-size: 13px; color: #88ffaa; background: rgba(0, 0, 0, 0.6); padding: 4px 12px; border-radius: 20px; }
#timer { position: absolute; top: 8px; left: 50%; transform: translateX(-50%) translateX(100px); font-size: 18px; color: #ff4444; background: rgba(0, 0, 0, 0.7); padding: 6px 16px; border-radius: 20px; font-weight: bold; display: none; border: 2px solid #ff4444; box-shadow: 0 0 10px rgba(255, 68, 68, 0.6); }
#reloadMsg { position: fixed; top: 45%; left: 50%; transform: translate(-50%, -50%); color: #ffdd44; font-size: 18px; text-shadow: 2px 2px 6px #000; z-index: 29; pointer-events: none; text-align: center; background: rgba(0, 0, 0, 0.75); padding: 8px 20px; border-radius: 12px; opacity: 0; transition: opacity 0.2s; font-weight: bold; }
#radar { position: fixed; top: 8px; left: 50%; transform: translateX(-50%) translateX(-115px); width: 90px; height: 90px; border-radius: 50%; background: rgba(0, 20, 0, 0.75); border: 3px solid rgba(0, 255, 0, 0.6); z-index: 12; pointer-events: none; box-shadow: 0 0 15px rgba(0, 255, 0, 0.4), inset 0 0 20px rgba(0, 255, 0, 0.15); }
#radarCanvas { width: 100%; height: 100%; border-radius: 50%; display: block; }
#joyZone { position: fixed; bottom: 15px; left: 15px; width: 105px; height: 105px; border-radius: 50%; background: rgba(255, 255, 255, 0.13); border: 2px solid rgba(255, 255, 255, 0.35); z-index: 20; touch-action: none; }

#fireBtn { position: fixed; bottom: 15px; right: 15px; width: 78px; height: 78px; border-radius: 50%; background: radial-gradient(circle, rgba(255, 60, 60, 0.95), rgba(180, 20, 20, 0.95)); border: 3px solid rgba(255, 255, 255, 0.6); z-index: 25; color: white; font-size: 11px; font-weight: bold; display: flex; align-items: center; justify-content: center; touch-action: none; box-shadow: 0 0 18px rgba(255, 0, 0, 0.6); }

#grenadeBtn { position: fixed; bottom: 105px; right: 15px; width: 58px; height: 58px; border-radius: 50%; background: radial-gradient(circle, rgba(255, 140, 40, 0.95), rgba(180, 80, 10, 0.95)); border: 3px solid rgba(255, 255, 255, 0.6); z-index: 25; color: white; font-size: 20px; display: flex; align-items: center; justify-content: center; touch-action: none; box-shadow: 0 0 15px rgba(255, 140, 40, 0.7); }

#jumpBtn { position: fixed; bottom: 105px; right: 80px; width: 58px; height: 58px; border-radius: 50%; background: radial-gradient(circle, rgba(70, 150, 255, 0.95), rgba(30, 80, 180, 0.95)); border: 3px solid rgba(255, 255, 255, 0.6); z-index: 25; color: white; font-size: 20px; display: flex; align-items: center; justify-content: center; touch-action: none; box-shadow: 0 0 15px rgba(70, 150, 255, 0.7); }
#jumpBtn:active { transform: scale(0.9); }
#zoomBtn, #reloadBtn { position: fixed; width: 48px; height: 48px; border-radius: 50%; background: rgba(0, 0, 0, 0.55); border: 2px solid rgba(255, 255, 255, 0.4); color: white; font-size: 18px; z-index: 22; display: flex; align-items: center; justify-content: center; touch-action: none; }
#zoomBtn { bottom: 15px; right: 110px; }
#reloadBtn { bottom: 15px; right: 165px; }

#weaponBtns { position: fixed; bottom: 15px; left: 130px; display: flex; flex-direction: column; gap: 3px; z-index: 22; }
.wbtn { width: 72px; height: 24px; border-radius: 8px; background: rgba(0, 0, 0, 0.6); border: 2px solid rgba(255, 255, 255, 0.3); color: white; font-size: 10px; font-weight: bold; display: flex; align-items: center; justify-content: center; touch-action: none; }
.wbtn.active { background: rgba(255, 165, 0, 0.85); border-color: #fff; box-shadow: 0 0 12px rgba(255, 165, 0, 0.6); }
#msg { position: fixed; top: 25%; left: 50%; transform: translate(-50%, -50%); color: white; font-size: 22px; text-shadow: 3px 3px 8px #000; z-index: 30; pointer-events: none; text-align: center; background: rgba(0, 0, 0, 0.85); padding: 15px 30px; border-radius: 15px; opacity: 0; transition: opacity 0.4s; font-weight: bold; border: 3px solid #ffcc00; box-shadow: 0 0 20px rgba(255, 200, 0, 0.6); }
#menuScreen { position: fixed; inset: 0; background: linear-gradient(135deg, #1a1a2e, #16213e); color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; padding: 15px; overflow-y: auto; }
#menuScreen h1 { color: #ffcc00; font-size: 22px; margin-bottom: 12px; text-shadow: 3px 3px 8px #000; }
#moneyDisplay { color: #ffcc00; font-size: 16px; margin-bottom: 12px; font-weight: bold; text-align: center; }
#levelGrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; width: auto; max-width: 850px; margin-top: 15px; }
.lvlBtn { padding: 6px 4px; border-radius: 10px; background: linear-gradient(135deg, #3a3a5a, #2a2a4a); border: 2px solid #88aaff; color: white; font-family: Tahoma; font-size: 10px; font-weight: bold; cursor: pointer; text-align: center; transition: all 0.2s; touch-action: manipulation; }
.lvlBtn:active { transform: scale(0.95); }
.lvlBtn.locked { background: linear-gradient(135deg, #2a2a2a, #1a1a1a); border-color: #555; color: #666; cursor: not-allowed; pointer-events: none; opacity: 0.5; }
.lvlBtn.special { background: linear-gradient(135deg, #6a4a0a, #4a2a00); border-color: #ffcc00; box-shadow: 0 0 15px rgba(255, 200, 0, 0.5); animation: specialPulse 2s infinite; }
.lvlBtn.miniBoss { background: linear-gradient(135deg, #8a1a1a, #5a0a0a); border-color: #ff4444; box-shadow: 0 0 15px rgba(255, 50, 50, 0.6); animation: bossPulse 1.5s infinite; }
@keyframes specialPulse { 0%, 100% { box-shadow: 0 0 15px rgba(255, 200, 0, 0.5); } 50% { box-shadow: 0 0 25px rgba(255, 200, 0, 0.9); } }
@keyframes bossPulse { 0%, 100% { box-shadow: 0 0 15px rgba(255, 50, 50, 0.6); } 50% { box-shadow: 0 0 30px rgba(255, 50, 50, 1); } }
.lvlBtn .num { font-size: 12px; color: #ffcc00; display: block; margin-bottom: 2px; }
.lvlBtn.locked .num { color: #666; }
.lvlBtn .name { font-size: 8px; color: #ccc; }
.lvlBtn .stars { font-size: 10px; color: #ffdd44; margin-top: 1px; display: block; }
#gameOverScreen { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.92); color: white; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 110; text-align: center; padding: 15px; }
#gameOverScreen h1 { font-size: 32px; margin-bottom: 10px; }
#gameOverScreen.win h1 { color: #44ff88; }
#gameOverScreen.lose h1 { color: #ff4444; }
#gameOverScreen p { font-size: 14px; margin-bottom: 12px; color: #ccc; }
.bigBtn { padding: 14px 40px; font-size: 18px; font-family: Tahoma; font-weight: bold; color: white; background: linear-gradient(135deg, #ff6b00, #ff3300); border: 3px solid #ffcc00; border-radius: 50px; cursor: pointer; box-shadow: 0 6px 20px rgba(255, 80, 0, 0.5); transition: all 0.2s; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
.bigBtn:active { transform: scale(0.94); }
#crosshair { position: fixed; top: 50%; left: 50%; width: 22px; height: 22px; transform: translate(-50%, -50%); pointer-events: none; z-index: 15; }
#crosshair::before, #crosshair::after { content: ''; position: absolute; background: #fff; box-shadow: 0 0 4px #000; }
#crosshair::before { left: 50%; top: 0; width: 2px; height: 100%; transform: translateX(-50%); }
#crosshair::after { top: 50%; left: 0; height: 2px; width: 100%; transform: translateY(-50%); }
#lockIndicator { position: fixed; width: 70px; height: 70px; border: 3px solid #ff2222; border-radius: 50%; pointer-events: none; z-index: 18; display: none; box-shadow: 0 0 15px rgba(255, 30, 30, 0.8), inset 0 0 15px rgba(255, 30, 30, 0.4); animation: lockPulse 0.8s infinite; }
@keyframes lockPulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.15); opacity: 0.6; } }
#lockText { position: fixed; color: #ff2222; font-size: 12px; font-weight: bold; text-shadow: 0 0 8px #ff0000, 2px 2px 4px #000; pointer-events: none; z-index: 18; display: none; }
#scopeOverlay { position: fixed; inset: 0; pointer-events: none; z-index: 17; display: none; background: radial-gradient(circle at center, transparent 0%, transparent 25%, rgba(0, 0, 0, 0.98) 30%, #000 100%); }
#scopeOverlay::before { content: ''; position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: rgba(0, 0, 0, 0.9); transform: translateX(-50%); }
#scopeOverlay::after { content: ''; position: absolute; top: 50%; left: 0; right: 0; height: 2px; background: rgba(0, 0, 0, 0.9); transform: translateY(-50%); }
#scopeOverlay .scopeCircle { position: absolute; top: 50%; left: 50%; width: 60vmin; height: 60vmin; transform: translate(-50%, -50%); border-radius: 50%; border: 4px solid rgba(0, 0, 0, 0.9); box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.9); }
#scopeOverlay .scopeDot { position: absolute; top: 50%; left: 50%; width: 6px; height: 6px; background: #ff2222; border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 8px rgba(255, 0, 0, 0.8); }
#damageOverlay { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(circle, transparent 40%, rgba(255, 0, 0, 0.6) 100%); opacity: 0; transition: opacity 0.3s; z-index: 14; }
#armorOverlay { position: fixed; inset: 0; pointer-events: none; z-index: 13; transition: opacity 0.3s; opacity: 0; }
#hitmarker { position: fixed; top: 50%; left: 50%; width: 32px; height: 32px; transform: translate(-50%, -50%) rotate(45deg); pointer-events: none; z-index: 16; display: none; }
#hitmarker::before, #hitmarker::after { content: ''; position: absolute; background: #ff3333; }
#hitmarker::before { left: 50%; top: 0; width: 3px; height: 100%; transform: translateX(-50%); }
#hitmarker::after { top: 50%; left: 0; height: 3px; width: 100%; transform: translateY(-50%); }
#rotateMsg { display: none; position: fixed; inset: 0; background: linear-gradient(135deg, #1a1a2e, #16213e); color: white; z-index: 200; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px; }
#rotateMsg .icon { font-size: 70px; margin-bottom: 20px; }
#rotateMsg h2 { color: #ffcc00; font-size: 22px; margin-bottom: 15px; }
@media (orientation: portrait) and (max-width: 768px) { #rotateMsg { display: flex; } }
#enterCarBtn { position: fixed; bottom: 190px; left: 50%; transform: translateX(-50%); width: 130px; height: 50px; border-radius: 25px; background: linear-gradient(135deg, #44aa44, #226622); border: 3px solid #aaffaa; color: white; font-size: 14px; font-weight: bold; display: none; align-items: center; justify-content: center; z-index: 30; touch-action: none; box-shadow: 0 0 20px rgba(0, 255, 0, 0.6); font-family: Tahoma; cursor: pointer; }
#enterCarBtn:active { transform: translateX(-50%) scale(0.95); }
#upgradeScreen { display: none; position: fixed; inset: 0; background: linear-gradient(135deg, #1a1a2e, #16213e); color: white; z-index: 105; padding: 20px; overflow-y: auto; flex-direction: column; align-items: center; }
#upgradeScreen h1 { color: #ffcc00; margin-bottom: 10px; }
#upgradeMoney { color: #ffcc00; font-size: 18px; margin-bottom: 20px; font-weight: bold; }
#upgradeList { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; width: 100%; max-width: 900px; padding: 10px; }
#menuButtons { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; justify-content: center; }
</style>
</head>

<script type="module">
import * as THREE from 'three';

// ==================== ۴۰ مرحله ====================
const LEVELS = [];

function getLevelReward(levelIndex) {
    const base = 1000;
    const maxReward = 100000;
    const t = levelIndex / (LEVELS.length - 1);
    return Math.floor(base + (maxReward - base) * Math.pow(t, 1.5));
}

function getUpgradeCost(weaponKey) {
    const level = weaponUpgrades[weaponKey] || 0;
    const baseCost = 2000;
    return Math.floor(baseCost * Math.pow(2, level));
}

function groundHeight(x, z) {
    const dist = Math.sqrt(x * x + z * z);
    const damp = Math.min(1, dist / 20);
    return (Math.sin(x * 0.05) * Math.cos(z * 0.05) * 1.5 + Math.sin(x * 0.15 + 1) * Math.cos(z * 0.12) * 0.6 + Math.sin(x * 0.3) * 0.3) * damp;
}

function buildWorld(L) {
    clearWorld();
    scene.background = new THREE.Color(L.sky);
    scene.fog = new THREE.Fog(L.fog, L.fogN, L.fogF);
    const gGeo = new THREE.PlaneGeometry(300, 300, 80, 80);
    gGeo.rotateX(-Math.PI / 2);
    const pos = gGeo.attributes.position;
    for (let i = 0; i < pos.count; i++) pos.setY(i, groundHeight(pos.getX(i), pos.getZ(i)));
    pos.needsUpdate = true;
    gGeo.computeVertexNormals();
    groundMesh = new THREE.Mesh(gGeo, new THREE.MeshStandardMaterial({ color: L.ground, roughness: 0.95 }));
    groundMesh.receiveShadow = true;
    scene.add(groundMesh);
    const tuftMat = new THREE.MeshStandardMaterial({ color: L.tuft });
    for (let i = 0; i < 100; i++) {
        const a = Math.random() * Math.PI * 2, r = 15 + Math.random() * 100;
        const x = Math.cos(a) * r, z = Math.sin(a) * r;
        const tuft = new THREE.Mesh(new THREE.ConeGeometry(0.3, 0.8, 4), tuftMat);
        tuft.position.set(x, groundHeight(x, z) + 0.3, z); scene.add(tuft); tuftMeshes.push(tuft);
    }
    if (!L.isWorshipLevel) {
        const coverMat = new THREE.MeshStandardMaterial({ color: L.cover, roughness: 1 });
        [[10, 10, 4, 2, 1.5], [-15, 8, 5, 1.5, 2], [15, -12, 3, 2, 2], [-20, -15, 4, 1.5, 2.5], [0, 20, 6, 2, 1.5], [-25, 5, 3, 1.5, 2], [25, 20, 4, 2, 2], [-30, -20, 5, 2, 1.8]].forEach(([x, z, w, h, d]) => {
            const cover = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), coverMat);
            cover.position.set(x, groundHeight(x, z) + h / 2, z); cover.castShadow = true; cover.receiveShadow = true;
            scene.add(cover); coverMeshes.push(cover); covers.push({ mesh: cover, w, h, d });
        });
    }
    const rockMat = new THREE.MeshStandardMaterial({ color: 0x808080, roughness: 1 });
    for (let i = 0; i < L.rocks; i++) {
        const a = Math.random() * Math.PI * 2, r = 20 + Math.random() * 100;
        const x = Math.cos(a) * r, z = Math.sin(a) * r, size = 1 + Math.random() * 2;
        const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(size), rockMat);
        rock.position.set(x, groundHeight(x, z) + size * 0.6, z); rock.rotation.set(Math.random(), Math.random(), Math.random());
        rock.castShadow = true; rock.receiveShadow = true; scene.add(rock); rockMeshes.push(rock);
    }
    if (L.trees > 0) {
        const trunkMat = new THREE.MeshStandardMaterial({ color: 0x4a2a1a, roughness: 1 });
        const leafMat = new THREE.MeshStandardMaterial({ color: 0x1a4a1a, roughness: 1 });
        for (let i = 0; i < L.trees; i++) {
            const a = Math.random() * Math.PI * 2, r = 20 + Math.random() * 90;
            const x = Math.cos(a) * r, z = Math.sin(a) * r, gh = groundHeight(x, z);
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.5, 3, 6), trunkMat);
            trunk.position.set(x, gh + 1.5, z); trunk.castShadow = true; scene.add(trunk); treeMeshes.push(trunk);
            const leaves = new THREE.Mesh(new THREE.ConeGeometry(2.5, 5, 8), leafMat);
            leaves.position.set(x, gh + 5, z); leaves.castShadow = true; scene.add(leaves); treeMeshes.push(leaves);
            const leaves2 = new THREE.Mesh(new THREE.ConeGeometry(2, 4, 8), leafMat);
            leaves2.position.set(x, gh + 6.5, z); leaves2.castShadow = true; scene.add(leaves2); treeMeshes.push(leaves2);
        }
    }
    if (!L.isWorshipLevel) {
        const carPositions = [[18, 28], [-28, 22], [32, -22], [-38, -28], [42, 12], [-45, 18], [22, -38], [-22, -42], [48, 32], [-52, -12], [12, 45], [-18, 48]];
        for (let i = 0; i < L.cars && i < carPositions.length; i++) {
            const [cx, cz] = carPositions[i];
            const isBlackTurret = (currentLevel + 1) % 5 === 0 && i === 0;
            createCar(cx, cz, isBlackTurret);
        }
    }
}

function applyUpgrades() {
    for (const key in WEAPONS) {
        const lvl = weaponUpgrades[key] || 0;
        const baseDamage = WEAPONS[key].baseDamage || WEAPONS[key].damage;
        const baseMaxAmmo = WEAPONS[key].baseMaxAmmo || WEAPONS[key].maxAmmo;
        const baseReserve = WEAPONS[key].baseReserveMax || WEAPONS[key].reserveMax;
        const baseZoom = WEAPONS[key].baseZoom || WEAPONS[key].zoom;
        if (!WEAPONS[key].baseDamage) {
            WEAPONS[key].baseDamage = WEAPONS[key].damage;
            WEAPONS[key].baseMaxAmmo = WEAPONS[key].maxAmmo;
            WEAPONS[key].baseReserveMax = WEAPONS[key].reserveMax;
            WEAPONS[key].baseZoom = WEAPONS[key].zoom;
        }
        WEAPONS[key].damage = Math.floor(baseDamage * (1 + lvl * 0.25));
        WEAPONS[key].maxAmmo = Math.floor(baseMaxAmmo * (1 + lvl * 0.2));
        WEAPONS[key].reserveMax = Math.floor(baseReserve * (1 + lvl * 0.2));
        if (weaponScopes[key]) {
            WEAPONS[key].zoom = baseZoom * 2;
            WEAPONS[key].hasScope = true;
        } else {
            WEAPONS[key].zoom = baseZoom;
            WEAPONS[key].hasScope = false;
        }
    }
}

        { group: shotgunGroup, key: 'shotgun', length: 0.35, radius: 0.05, mountH: 0.09, mountPos: [0, 0.15, -0.35], scopePos: [0, 0.22, -0.35] },

function createExplosion(pos, radius, damage) {
    const explosionGeo = new THREE.SphereGeometry(1, 16, 16);
    const explosionMat = new THREE.MeshBasicMaterial({ color: 0xffaa00, transparent: true, opacity: 0.9 });
    const explosion = new THREE.Mesh(explosionGeo, explosionMat); explosion.position.copy(pos); scene.add(explosion);
    const light = new THREE.PointLight(0xff8800, 8, 15); light.position.copy(pos); scene.add(light);
    for (let i = 0; i < 20; i++) {
        const p = new THREE.Mesh(new THREE.SphereGeometry(0.3, 6, 6), new THREE.MeshBasicMaterial({ color: 0x8a6a4a, transparent: true, opacity: 0.9 }));
        p.position.copy(pos); scene.add(p);
        explosionParticles.push({ mesh: p, vel: new THREE.Vector3((Math.random() - 0.5) * 10, Math.random() * 8 + 2, (Math.random() - 0.5) * 10), life: 1.2 });
    }
    let scale = 1, opacity = 0.9;
    const anim = setInterval(() => {
        scale += 0.8; opacity -= 0.08;
        explosion.scale.set(scale, scale, scale); explosion.material.opacity = Math.max(0, opacity);
        light.intensity = Math.max(0, 8 - scale * 1.5);
        if (opacity <= 0) { clearInterval(anim); scene.remove(explosion); scene.remove(light); }
    }, 30);
    for (const enemy of enemies) {
        if (!enemy.alive || enemy.dying) continue;
        const d = enemy.group.position.distanceTo(pos);
        if (d < radius) { enemy.health -= damage * (1 - d / radius); enemy.hitTimer = 0.3; if (enemy.health <= 0 && !enemy.dying) startDying(enemy); }
    }
    const pd = player.pos.distanceTo(pos);
    if (pd < radius && !playerInCar) { const dmg = Math.floor(3 * (1 - pd / radius)); if (dmg > 0) damagePlayer(dmg); }
    for (let i = cars.length - 1; i >= 0; i--) {
        const car = cars[i];
        if (car.exploded || car.indestructible) continue;
        const d = Math.hypot(pos.x - car.x, pos.z - car.z);
        if (d < radius + car.radius) explodeCar(car);
    }
    if (boss && boss.alive) { const d = boss.group.position.distanceTo(pos); if (d < radius + 3) { boss.health -= damage * 0.5; boss.hitTimer = 0.3; updateBossUI(); if (boss.health <= 0) killBoss(); } }
    if (miniBoss && miniBoss.alive) { const d = miniBoss.group.position.distanceTo(pos); if (d < radius + 2) { miniBoss.health -= damage * 0.5; miniBoss.hitTimer = 0.3; updateBossUI(); if (miniBoss.health <= 0) killMiniBoss(); } }
}

function explodeCar(car) {
    if (car.exploded || car.indestructible) return;
    car.exploded = true;
    const carPos = new THREE.Vector3(car.x, groundHeight(car.x, car.z) + 1.5, car.z);
    const explosionGeo = new THREE.SphereGeometry(2, 20, 20);
    const explosionMat = new THREE.MeshBasicMaterial({ color: 0xffaa00, transparent: true, opacity: 1 });
    const explosion = new THREE.Mesh(explosionGeo, explosionMat); explosion.position.copy(carPos); scene.add(explosion);
    const light = new THREE.PointLight(0xff8800, 20, 40); light.position.copy(carPos); scene.add(light);
    let scale = 1, opacity = 1;
    const anim = setInterval(() => {
        scale += 2; opacity -= 0.05;
        explosion.scale.set(scale, scale, scale); explosion.material.opacity = Math.max(0, opacity);
        light.intensity = Math.max(0, 20 - scale * 2);
        if (opacity <= 0) { clearInterval(anim); scene.remove(explosion); scene.remove(light); }
    }, 30);
    for (const enemy of enemies) {
        if (!enemy.alive || enemy.dying) continue;
        const d = enemy.group.position.distanceTo(carPos);
        if (d < car.explodeRadius) { enemy.health -= car.explodeDamage; enemy.hitTimer = 0.5; if (enemy.health <= 0 && !enemy.dying) startDying(enemy); }
    }
    const pd = player.pos.distanceTo(carPos);
    if (pd < car.explodeRadius && !playerInCar) { const dmg = Math.floor(10 * (1 - pd / car.explodeRadius)); if (dmg > 0) damagePlayer(dmg); }
    scene.remove(car.group);
    const idx = cars.indexOf(car); if (idx !== -1) cars.splice(idx, 1);
}

function updateGrenades(dt) {
    for (let i = grenades.length - 1; i >= 0; i--) {
        const g = grenades[i];
        if (g.exploded) { grenades.splice(i, 1); continue; }
        g.vel.y -= 15 * dt;
        g.mesh.position.add(g.vel.clone().multiplyScalar(dt));
        const gh = groundHeight(g.mesh.position.x, g.mesh.position.z);
        if (g.mesh.position.y < gh + 0.15) { g.mesh.position.y = gh + 0.15; g.vel.y = -g.vel.y * 0.4; g.vel.x *= 0.7; g.vel.z *= 0.7; }
        g.mesh.rotation.x += dt * 5; g.mesh.rotation.z += dt * 3; g.life -= dt;
        if (g.life <= 0) explodeGrenade(g);
    }
    for (let i = explosionParticles.length - 1; i >= 0; i--) {
        const p = explosionParticles[i];
        p.vel.y -= 10 * dt; p.mesh.position.add(p.vel.clone().multiplyScalar(dt));
        p.mesh.scale.multiplyScalar(1 + dt * 1.5); p.mesh.material.opacity -= dt * 0.5; p.life -= dt;
        if (p.life <= 0) { scene.remove(p.mesh); explosionParticles.splice(i, 1); }
    }
}

}

function damagePlayer(amount) {
    if (amount <= 0) return;
    if (armor > 0) {
        const absorbed = Math.min(armor, amount);
        armor -= absorbed; amount -= absorbed;
        saveArmor();
    }
    if (amount > 0) player.health -= amount;
    updateHealthUI();
    showDamageOverlay();
}

function getCenter(el) { const r = el.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2, r: r.width / 2 }; }

joyZone.addEventListener('touchstart', e => { e.preventDefault(); e.stopPropagation(); const t = e.changedTouches[0]; joyTouchId = t.identifier; joyActive = true; updateJoy(t); }, { passive: false });
joyZone.addEventListener('touchmove', e => { e.preventDefault(); e.stopPropagation(); for (const t of e.changedTouches) if (t.identifier === joyTouchId) updateJoy(t); }, { passive: false });
joyZone.addEventListener('touchend', e => { e.preventDefault(); e.stopPropagation(); for (const t of e.changedTouches) if (t.identifier === joyTouchId) { joyTouchId = null; joyActive = false; joyX = 0; joyY = 0; joyKnob.style.transform = 'translate(-50%,-50%)'; } }, { passive: false });

function updateJoy(t) {
    const c = getCenter(joyZone);
    let dx = t.clientX - c.x, dy = t.clientY - c.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const maxR = c.r - 8;
    if (dist > maxR) { dx = dx / dist * maxR; dy = dy / dist * maxR; }
    joyKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
    joyX = dx / maxR; joyY = dy / maxR;
}

document.addEventListener('touchstart', e => {
    if (lookTouchId !== null) return;
    const target = e.target;
    if (target.closest('#joyZone') || target.closest('#fireBtn') || target.closest('#grenadeBtn') || target.closest('#jumpBtn') || target.closest('#zoomBtn') || target.closest('#reloadBtn') || target.closest('.wbtn') || target.closest('.bigBtn') || target.closest('.lvlBtn') || target.closest('#radar') || target.closest('#enterCarBtn')) return;
    const t = e.changedTouches[0];
    lookTouchId = t.identifier; lastLookX = t.clientX; lastLookY = t.clientY; lookDragDistance = 0;
}, { passive: true });

document.addEventListener('touchmove', e => {
    for (const t of e.changedTouches) {
        if (t.identifier === lookTouchId) {
            const dx = t.clientX - lastLookX, dy = t.clientY - lastLookY;
            lastLookX = t.clientX; lastLookY = t.clientY;
            lookDragDistance += Math.sqrt(dx * dx + dy * dy);
            if (lookDragDistance > LOOK_BREAK_THRESHOLD) {
                if (lockedEnemy) { lockedEnemy = null; lockBreakCooldown = 1.5; lockIndicator.style.display = 'none'; lockText.style.display = 'none'; }
                lookDragDistance = 0;
            }
            if (lockedEnemy) { const sens = 0.0003; player.yaw -= dx * sens; player.pitch -= dy * sens; }
            else { const sens = player.zooming ? 0.0008 : 0.0035; player.yaw -= dx * sens; player.pitch -= dy * sens; }
            player.pitch = Math.max(-Math.PI / 2 + 0.1, Math.min(Math.PI / 2 - 0.1, player.pitch));
        }
    }
}, { passive: true });

document.addEventListener('touchend', e => { for (const t of e.changedTouches) if (t.identifier === lookTouchId) { lookTouchId = null; lookDragDistance = 0; } }, { passive: true });

function switchWeapon(w) {
    if (currentWeapon === w || reloading) return;
    if (playerInCar) { showMsg('❌ توی ماشین نمیتونی سلاح عوض کنی!', 1.5); return; }
    currentWeapon = w;
    updateWeaponHUD();
    document.querySelectorAll('.wbtn').forEach(b => b.classList.toggle('active', b.dataset.w === w));
    showWeaponModel(w); updateMuzzlePos(); updateAmmoUI(); updateReserveUI();
    if (player.zooming && w !== 'sniper' && w !== 'heavy' && w !== 'rpg' && w !== 'turret' && !weaponScopes[w]) {
        player.zooming = false; scopeOverlay.style.display = 'none';

}

function updateWeaponHUD() {
    const w = WEAPONS[currentWeapon];
    const hasScope = weaponScopes[currentWeapon] || false;
    document.getElementById('weapon').textContent = w.name + (hasScope ? ' 📷' : '');
}

function startReload() {
    if (reloading || playerInCar) return;
    const w = WEAPONS[currentWeapon];
    if (ammo[currentWeapon] >= w.maxAmmo) return;
    if (reserve[currentWeapon] <= 0) { showMsg('❌ فشنگ ذخیره نداری!', 1); return; }
    reloading = true; reloadStartTime = performance.now() / 1000; reloadDuration = w.reloadTime;
    const rm = document.getElementById('reloadMsg');
    rm.textContent = currentWeapon === 'rpg' ? '🚀 در حال پر کردن آرپی‌جی...' : '🔄 در حال تعویض خشاب...';
    rm.style.opacity = 1;
}
function finishReload() {
    const w = WEAPONS[currentWeapon];
    const need = w.maxAmmo - ammo[currentWeapon];
    const take = Math.min(need, reserve[currentWeapon]);
    ammo[currentWeapon] += take; reserve[currentWeapon] -= take;
    reloading = false; document.getElementById('reloadMsg').style.opacity = 0;
    updateAmmoUI(); updateReserveUI();
}

function updateAmmoUI() { const w = WEAPONS[currentWeapon]; document.getElementById('ammo').textContent = `🔫 ${ammo[currentWeapon]}/${w.maxAmmo}`; }

    for (const car of cars) {
        if (!car.isBlackTurret || car.exploded || car.occupied) continue;
        const d = Math.hypot(player.pos.x - car.x, player.pos.z - car.z);
        if (d < nearestDist) { nearestDist = d; nearestCar = car; }

    if (nearestCar) {
        enterCarBtn.style.display = 'flex';

}

function shootCarTurret(now) {
    if (!playerInCar) return;
    const car = playerInCar;
    if (now - car.turretCooldown < 0.08) return;
    car.turretCooldown = now;
    const turretBody = car.group.userData.turretBody;
    const barrels = car.group.userData.barrels;
    const light = car.group.userData.turretLight;
    if (turretBody) { turretBody.rotation.y = player.yaw - car.group.rotation.y; turretBody.rotation.x = -player.pitch; }
    if (light) { light.intensity = 8; setTimeout(() => { light.intensity = 0; }, 40); }
    if (barrels) barrels.forEach(b => { b.position.z -= 0.2; setTimeout(() => { b.position.z += 0.2; }, 50); });
    const dir = new THREE.Vector3(0, 0, -1).applyEuler(new THREE.Euler(player.pitch, player.yaw, 0, 'YXZ'));
    const start = car.group.position.clone(); start.y += 3.55; start.add(dir.clone().multiplyScalar(2.5));
    const maxRange = 150;
    let hitSomething = false;
    for (const enemy of enemies) {
        if (!enemy.alive || enemy.dying) continue;
        const ec = enemy.group.position.clone().add(new THREE.Vector3(0, 1.2, 0));
        const toE = new THREE.Vector3().subVectors(ec, start);
        const proj = toE.dot(dir);
        if (proj < 0 || proj > maxRange) continue;
        const cp = start.clone().add(dir.clone().multiplyScalar(proj));
        if (cp.distanceTo(ec) < 1.5) { enemy.health -= 80; enemy.hitTimer = 0.2; spawnBlood(ec); showHitmarker(); if (enemy.health <= 0 && !enemy.dying) startDying(enemy); hitSomething = true; break; }
    }
    if (boss && boss.alive && !hitSomething) {
        const bc = boss.group.position.clone().add(new THREE.Vector3(0, 7, 0));
        const toB = new THREE.Vector3().subVectors(bc, start);
        const proj = toB.dot(dir);
        if (proj > 0 && proj < maxRange) { const cp = start.clone().add(dir.clone().multiplyScalar(proj)); if (cp.distanceTo(bc) < 5) { boss.health -= 80; boss.hitTimer = 0.15; showHitmarker(); updateBossUI(); if (boss.health <= 0) killBoss(); hitSomething = true; } }
    }
    if (miniBoss && miniBoss.alive && !hitSomething) {
        const mc = miniBoss.group.position.clone().add(new THREE.Vector3(0, 2, 0));
        const toM = new THREE.Vector3().subVectors(mc, start);
        const proj = toM.dot(dir);
        if (proj > 0 && proj < maxRange) { const cp = start.clone().add(dir.clone().multiplyScalar(proj)); if (cp.distanceTo(mc) < 1.5) { miniBoss.health -= 80; miniBoss.hitTimer = 0.15; showHitmarker(); updateBossUI(); if (miniBoss.health <= 0) killMiniBoss(); hitSomething = true; } }
    }
    if (!hitSomething) {
        let endPoint = start.clone().add(dir.clone().multiplyScalar(maxRange));
        for (let t = 0; t < maxRange; t += 2) { const pt = start.clone().add(dir.clone().multiplyScalar(t)); if (pt.y < groundHeight(pt.x, pt.z)) { endPoint = pt; break; } }
        spawnBulletVisual(start, endPoint, 0xffaa00);
    } else spawnBulletVisual(start, start.clone().add(dir.clone().multiplyScalar(30)), 0xffaa00);
}

function shoot(now) {
    const w = WEAPONS[currentWeapon];
    if (reloading) return;
    if (ammo[currentWeapon] <= 0 && !w.isTurret) { startReload(); return; }
    if (now - player.lastShot < w.fireRate) return;
    player.lastShot = now;
    if (!w.isTurret) ammo[currentWeapon]--;
    updateAmmoUI();
    triggerFlash();
    player.recoilOffset = 0.12 * (w.kick * 10);
    player.recoilPitch = w.kick;
    player.recoilRoll = (Math.random() - 0.5) * w.kick * 1.5;
    if (w.isRPG) { fireRPG(); return; }
    let baseDir;
    if (lockedEnemy && lockedEnemy.alive && !lockedEnemy.dying) {
        const ep = lockedEnemy.group.position.clone().add(new THREE.Vector3(0, 1.2, 0));
        baseDir = new THREE.Vector3().subVectors(ep, camera.position).normalize();
    } else baseDir = new THREE.Vector3(0, 0, -1).applyEuler(new THREE.Euler(player.pitch, player.yaw, 0, 'YXZ'));
    const pellets = w.pellets || 1;
    const hitEnemies = new Set();
    for (let p = 0; p < pellets; p++) {
        const dir = baseDir.clone();
        dir.x += (Math.random() - 0.5) * w.spread * 2; dir.y += (Math.random() - 0.5) * w.spread * 2; dir.z += (Math.random() - 0.5) * w.spread * 2;
        dir.normalize();
        const origin = camera.position.clone();
        let closestHit = null, closestDist = Infinity, hitCar = false, hitBoss = false, hitMiniBoss = false;
        for (const enemy of enemies) {
            if (!enemy.alive || enemy.dying) continue;
            const ec = enemy.group.position.clone().add(new THREE.Vector3(0, 1.2, 0));
            const toE = new THREE.Vector3().subVectors(ec, origin);
            const proj = toE.dot(dir);
            if (proj < 0 || proj > w.range) continue;
            const cp = origin.clone().add(dir.clone().multiplyScalar(proj));
            const d = cp.distanceTo(ec);
            const hitR = currentWeapon === 'shotgun' ? 1.0 : 0.8;
            if (d < hitR && proj < closestDist) { closestDist = proj; closestHit = enemy; }
        }
        if (boss && boss.alive) {
            const bc = boss.group.position.clone().add(new THREE.Vector3(0, 8, 0));
            const toB = new THREE.Vector3().subVectors(bc, origin);
            const proj = toB.dot(dir);
            if (proj > 0 && proj < w.range) { const cp = origin.clone().add(dir.clone().multiplyScalar(proj)); const d = cp.distanceTo(bc); if (d < 4.5 && proj < closestDist) { closestDist = proj; closestHit = null; hitBoss = true; } }
        }
        if (miniBoss && miniBoss.alive) {
            const mc = miniBoss.group.position.clone().add(new THREE.Vector3(0, 2, 0));
            const toM = new THREE.Vector3().subVectors(mc, origin);
            const proj = toM.dot(dir);
            if (proj > 0 && proj < w.range) { const cp = origin.clone().add(dir.clone().multiplyScalar(proj)); const d = cp.distanceTo(mc); if (d < 1.5 && proj < closestDist) { closestDist = proj; closestHit = null; hitMiniBoss = true; } }
        }
        for (const car of cars) {
            if (car.exploded || car.indestructible) continue;
            const carPos = new THREE.Vector3(car.x, groundHeight(car.x, car.z) + 1, car.z);
            const toC = new THREE.Vector3().subVectors(carPos, origin);
            const proj = toC.dot(dir);
            if (proj < 0 || proj > w.range) continue;
            const cp = origin.clone().add(dir.clone().multiplyScalar(proj));
            const d = cp.distanceTo(carPos);
            if (d < car.radius && proj < closestDist) { closestDist = proj; closestHit = null; hitCar = true; }
        }
        if (closestHit) {
            const hp = origin.clone().add(dir.clone().multiplyScalar(closestDist));
            spawnBulletVisual(origin, hp, 0xffff66); spawnBlood(hp);
            if (!hitEnemies.has(closestHit)) {
                hitEnemies.add(closestHit); closestHit.health -= w.damage; closestHit.hitTimer = 0.25;
                showHitmarker();
                if (closestHit.health <= 0 && !closestHit.dying) startDying(closestHit);
            }
        } else if (hitBoss) {
            const hp = origin.clone().add(dir.clone().multiplyScalar(closestDist));
            spawnBulletVisual(origin, hp, 0xff6666);
            boss.health -= w.damage; boss.hitTimer = 0.15; showHitmarker(); updateBossUI();
            if (boss.health <= 0) killBoss();
        } else if (hitMiniBoss) {
            const hp = origin.clone().add(dir.clone().multiplyScalar(closestDist));
            spawnBulletVisual(origin, hp, 0xff6666);
            miniBoss.health -= w.damage; miniBoss.hitTimer = 0.15; showHitmarker(); updateBossUI();
            if (miniBoss.health <= 0) killMiniBoss();
        } else if (hitCar) {
            const hp = origin.clone().add(dir.clone().multiplyScalar(closestDist));
            spawnBulletVisual(origin, hp, 0xffff66);
        } else {
            let endPoint = origin.clone().add(dir.clone().multiplyScalar(w.range));
            for (let t = 0; t < w.range; t += 2) {
                const pt = origin.clone().add(dir.clone().multiplyScalar(t));
                if (pt.y < groundHeight(pt.x, pt.z)) { endPoint = pt; break; }
                if (Math.abs(pt.x) > 150 || Math.abs(pt.z) > 150) { endPoint = pt; break; }
            }
            spawnBulletVisual(origin, endPoint, 0xffff66);
        }
    }
}

const rpgMissiles = [];
function fireRPG() {
    let baseDir;
    if (lockedEnemy && lockedEnemy.alive && !lockedEnemy.dying) {
        const ep = lockedEnemy.group.position.clone().add(new THREE.Vector3(0, 1.2, 0));
        baseDir = new THREE.Vector3().subVectors(ep, camera.position).normalize();
    } else baseDir = new THREE.Vector3(0, 0, -1).applyEuler(new THREE.Euler(player.pitch, player.yaw, 0, 'YXZ'));
    const start = camera.position.clone().add(baseDir.clone().multiplyScalar(2)); start.y -= 0.1;
    const missileGroup = new THREE.Group();
    const missileBody = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.5, 10), new THREE.MeshStandardMaterial({ color: 0x4a3a3a, roughness: 0.7 }));
    missileBody.rotation.x = Math.PI / 2; missileGroup.add(missileBody);
    const missileWarhead = new THREE.Mesh(new THREE.ConeGeometry(0.09, 0.25, 10), new THREE.MeshStandardMaterial({ color: 0x8a2020, roughness: 0.6 }));
    missileWarhead.rotation.x = -Math.PI / 2; missileWarhead.position.set(0, 0, 0.35); missileGroup.add(missileWarhead);
    const missileFlame = new THREE.Mesh(new THREE.ConeGeometry(0.06, 0.3, 8), new THREE.MeshBasicMaterial({ color: 0xffaa00, transparent: true, opacity: 0.9 }));
    missileFlame.rotation.x = Math.PI / 2; missileFlame.position.set(0, 0, -0.4); missileGroup.add(missileFlame);
    const missileLight = new THREE.PointLight(0xff8800, 3, 8); missileLight.position.set(0, 0, -0.4); missileGroup.add(missileLight);
    missileGroup.position.copy(start);
    missileGroup.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), baseDir);
    scene.add(missileGroup);
    rpgMissiles.push({ mesh: missileGroup, dir: baseDir, speed: 40, traveled: 0, maxDist: 150 });
    showMsg('🚀 آرپی‌جی شلیک شد!', 1);
}

function updateRPGMissiles(dt) {
    for (let i = rpgMissiles.length - 1; i >= 0; i--) {
        const m = rpgMissiles[i];
        m.traveled += m.speed * dt;
        m.mesh.position.add(m.dir.clone().multiplyScalar(m.speed * dt));
        const gh = groundHeight(m.mesh.position.x, m.mesh.position.z);
        let hitEnemy = false;
        for (const enemy of enemies) { if (!enemy.alive || enemy.dying) continue; const d = m.mesh.position.distanceTo(enemy.group.position); if (d < 2) { hitEnemy = true; break; } }
        let hitCar = false;
        for (const car of cars) { if (car.exploded || car.indestructible) continue; const d = Math.hypot(m.mesh.position.x - car.x, m.mesh.position.z - car.z); if (d < car.radius) { hitCar = true; break; } }
        let hitBoss = false;
        if (boss && boss.alive) { const d = m.mesh.position.distanceTo(boss.group.position); if (d < 5) hitBoss = true; }
        let hitMiniBoss = false;
        if (miniBoss && miniBoss.alive) { const d = m.mesh.position.distanceTo(miniBoss.group.position); if (d < 2) hitMiniBoss = true; }
        if (m.mesh.position.y < gh || m.traveled > m.maxDist || hitEnemy || hitCar || hitBoss || hitMiniBoss) {
            createExplosion(m.mesh.position.clone(), 12, 500);
            scene.remove(m.mesh); rpgMissiles.splice(i, 1);
        }
    }
}

function updateAutoLock(dt) {
    if (lockBreakCooldown > 0) { lockBreakCooldown -= dt; lockedEnemy = null; lockIndicator.style.display = 'none'; lockText.style.display = 'none'; return; }
    if (lockedEnemy) { if (!lockedEnemy.alive || lockedEnemy.dying) { lockedEnemy = null; lockIndicator.style.display = 'none'; lockText.style.display = 'none'; return; } }
    if (!lockedEnemy) {
        let bestEnemy = null, bestScore = Infinity;
        const camDir = new THREE.Vector3(0, 0, -1).applyEuler(new THREE.Euler(player.pitch, player.yaw, 0, 'YXZ'));
        for (const enemy of enemies) {
            if (!enemy.alive || enemy.dying) continue;
            const ep = enemy.group.position.clone().add(new THREE.Vector3(0, 1.2, 0));
            const toEnemy = new THREE.Vector3().subVectors(ep, camera.position);
            const dist = toEnemy.length();
            if (dist > LOCK_RANGE) continue;
            toEnemy.normalize();
            const dot = toEnemy.dot(camDir);
            if (dot < LOCK_ANGLE_THRESHOLD) continue;
            const score = dist * (2 - dot);
            if (score < bestScore) { bestScore = score; bestEnemy = enemy; }
        }
        if (bestEnemy) lockedEnemy = bestEnemy;
    }
    if (lockedEnemy) {
        const ep = lockedEnemy.group.position.clone().add(new THREE.Vector3(0, 1.2, 0));
        const toEnemy = new THREE.Vector3().subVectors(ep, camera.position).normalize();
        const targetYaw = Math.atan2(-toEnemy.x, -toEnemy.z);
        const targetPitch = Math.asin(toEnemy.y);
        const lerpSpeed = 8 * dt;
        let yawDiff = targetYaw - player.yaw;
        while (yawDiff > Math.PI) yawDiff -= Math.PI * 2;
        while (yawDiff < -Math.PI) yawDiff += Math.PI * 2;
        player.yaw += yawDiff * lerpSpeed;
        player.pitch += (targetPitch - player.pitch) * lerpSpeed;
        const screenPos = ep.clone().project(camera);
        const sx = (screenPos.x * 0.5 + 0.5) * innerWidth;
        const sy = (-screenPos.y * 0.5 + 0.5) * innerHeight;
        if (screenPos.z < 1) {
            lockIndicator.style.display = 'block'; lockIndicator.style.left = (sx - 35) + 'px'; lockIndicator.style.top = (sy - 35) + 'px';
            lockText.style.display = 'block'; lockText.style.left = (sx - 8) + 'px'; lockText.style.top = (sy - 60) + 'px';
        } else { lockIndicator.style.display = 'none'; lockText.style.display = 'none'; }
    }
}

function updateEnemies(dt, now) {
    for (const enemy of enemies) {
        if (enemy.dying) {
            enemy.dyingTimer += dt;
            if (enemy.dyingTimer < 0.6) { const t = enemy.dyingTimer / 0.6; enemy.group.rotation.x = -Math.PI / 2 * t; enemy.group.position.y = enemy.baseY + 0.3 * (1 - t); }
            else if (enemy.dyingTimer >= 3 && enemy.dyingTimer < 4.5) { enemy.group.traverse(o => { if (o.material && o.material.opacity !== undefined) { o.material.transparent = true; o.material.opacity = Math.max(0, 1 - (enemy.dyingTimer - 3) / 1.5); } }); }
            else if (enemy.dyingTimer >= 4.5) { scene.remove(enemy.group); enemy.dying = false; }
            continue;
        }
        if (!enemy.alive) continue;
        if (enemy.hitTimer > 0) { enemy.hitTimer -= dt; enemy.group.rotation.z = Math.sin(now * 50) * 0.15; enemy.group.scale.setScalar(1 + Math.sin(now * 40) * 0.05); }
        else { enemy.group.rotation.z *= 0.9; enemy.group.scale.setScalar(1); }
        const ep = enemy.group.position;
        let target = player.pos;
        if (isWorshipMode) {
            let closestW = null, closestD = Infinity;
            for (const w of worshippers) { if (!w.alive) continue; const d = ep.distanceTo(w.group.position); if (d < closestD) { closestD = d; closestW = w; } }
            if (closestW && closestD < ep.distanceTo(player.pos) * 0.7) target = closestW.group.position;
        }
        const toP = new THREE.Vector3().subVectors(target, ep); toP.y = 0;
        const dist = toP.length(); toP.normalize();
        const ta = Math.atan2(toP.x, toP.z);
        let ad = ta - enemy.group.rotation.y;
        while (ad > Math.PI) ad -= Math.PI * 2;
        while (ad < -Math.PI) ad += Math.PI * 2;
        enemy.group.rotation.y += ad * dt * 3;
        const maxR = enemy.hasGun ? 15 : 1.5;
        if (dist > maxR) {
            const ms = enemy.speed * dt;
            let nx = ep.x + toP.x * ms, nz = ep.z + toP.z * ms;
            for (const c of covers) { const dx = nx - c.mesh.position.x, dz = nz - c.mesh.position.z; if (Math.abs(dx) < c.w / 2 + 0.5 && Math.abs(dz) < c.d / 2 + 0.5) { nx = ep.x; nz = ep.z; break; } }
            for (const car of cars) { if (car.exploded) continue; const dx = nx - car.x, dz = nz - car.z; if (Math.hypot(dx, dz) < car.radius + 0.5) { nx = ep.x; nz = ep.z; break; } }
            ep.x = nx; ep.z = nz; ep.y = groundHeight(nx, nz);
            const legL = enemy.group.getObjectByName('leftLeg'), legR = enemy.group.getObjectByName('rightLeg');
            if (legL && legR) { legL.rotation.x = Math.sin(now * 10) * 0.4; legR.rotation.x = -Math.sin(now * 10) * 0.4; }
        }
        if (enemy.hasGun && dist < 25 && dist > 2) {
            if (now - enemy.lastAttack > enemy.gunCooldown) {
                enemy.lastAttack = now; enemy.gunCooldown = 1.5 + Math.random() * 1.5;
                if (Math.random() < 0.6) {
                    if (isWorshipMode && target !== player.pos) {
                        let closestW = null, closestD = Infinity;
                        for (const w of worshippers) { if (!w.alive) continue; const d = ep.distanceTo(w.group.position); if (d < closestD) { closestD = d; closestW = w; } }
                        if (closestW) { closestW.health -= 120; closestW.hitTimer = 0.3; if (closestW.health <= 0) { closestW.alive = false; updateWorshippersUI(); scene.remove(closestW.group); worshippersRemaining--; } }
                    } else { damagePlayer(1); const s = ep.clone().add(new THREE.Vector3(0, 1.3, 0)); spawnBulletVisual(s, camera.position.clone(), 0xff3300); }
                }
            }
        } else if (dist < 2 && now - enemy.lastAttack > 1) {
            enemy.lastAttack = now;
            if (isWorshipMode && target !== player.pos) {
                let closestW = null, closestD = Infinity;
                for (const w of worshippers) { if (!w.alive) continue; const d = ep.distanceTo(w.group.position); if (d < closestD) { closestD = d; closestW = w; } }
                if (closestW) { closestW.health -= 120; if (closestW.health <= 0) { closestW.alive = false; scene.remove(closestW.group); updateWorshippersUI(); } }
            } else damagePlayer(1);
        }
    }
}

function updateAllies(dt, now) {
    for (const ally of allies) {
        if (!ally.alive) continue;
        const ap = ally.group.position;
        let target = null, minD = Infinity;
        for (const enemy of enemies) { if (!enemy.alive || enemy.dying) continue; const d = ap.distanceTo(enemy.group.position); if (d < minD) { minD = d; target = enemy; } }
        let moveTarget;
        if (target && minD < 30) { moveTarget = target.group.position.clone(); moveTarget.x += 8; }
        else moveTarget = player.pos.clone().add(ally.followOffset);
        const toT = new THREE.Vector3().subVectors(moveTarget, ap); toT.y = 0;
        const d = toT.length();
        if (d > 3) {
            toT.normalize();
            const ms = ally.speed * dt;
            let nx = ap.x + toT.x * ms, nz = ap.z + toT.z * ms;
            let blocked = false;
            for (const c of covers) { const ddx = nx - c.mesh.position.x, ddz = nz - c.mesh.position.z; if (Math.abs(ddx) < c.w / 2 + 0.5 && Math.abs(ddz) < c.d / 2 + 0.5) { blocked = true; break; } }
            for (const car of cars) { if (car.exploded) continue; const dx = nx - car.x, dz = nz - car.z; if (Math.hypot(dx, dz) < car.radius + 0.5) { blocked = true; break; } }
            if (!blocked) { ap.x = nx; ap.z = nz; ap.y = groundHeight(nx, nz); }
            const legL = ally.group.getObjectByName('leftLeg'), legR = ally.group.getObjectByName('rightLeg');
            if (legL && legR) { legL.rotation.x = Math.sin(now * 10) * 0.4; legR.rotation.x = -Math.sin(now * 10) * 0.4; }
        }
        if (target) {
            const toE = new THREE.Vector3().subVectors(target.group.position, ap); toE.y = 0;
            const ta = Math.atan2(toE.x, toE.z);
            let ad = ta - ally.group.rotation.y;
            while (ad > Math.PI) ad -= Math.PI * 2;
            while (ad < -Math.PI) ad += Math.PI * 2;
            ally.group.rotation.y += ad * dt * 5;
            if (minD < 30 && now - ally.lastAttack > ally.gunCooldown) {
                ally.lastAttack = now; ally.gunCooldown = 0.8 + Math.random() * 1.2;
                if (Math.random() < 0.7) {
                    const s = ap.clone().add(new THREE.Vector3(0, 1.3, 0));
                    spawnBulletVisual(s, target.group.position.clone().add(new THREE.Vector3(0, 1.2, 0)), 0x00ff00);
                    target.health -= 30; target.hitTimer = 0.25;
                    if (target.health <= 0 && !target.dying) startDying(target);
                }
            }
        }
    }
}

function updateBoss(dt, now) {
    if (!boss || !boss.alive) return;
    const bp = boss.group.position;
    const toPlayer = new THREE.Vector3().subVectors(player.pos, bp); toPlayer.y = 0;
    const dist = toPlayer.length(); toPlayer.normalize();
    const ta = Math.atan2(toPlayer.x, toPlayer.z);
    let ad = ta - boss.group.rotation.y;
    while (ad > Math.PI) ad -= Math.PI * 2;
    while (ad < -Math.PI) ad += Math.PI * 2;
    boss.group.rotation.y += ad * dt * 2;
    const ms = boss.speed * dt;
    bp.x += toPlayer.x * ms; bp.z += toPlayer.z * ms; bp.y = groundHeight(bp.x, bp.z);
    if (dist < 3 && now - boss.lastAttack > boss.attackCooldown && !playerInCar) { boss.lastAttack = now; damagePlayer(2); }
    for (const w of worshippers) { if (!w.alive) continue; const d = bp.distanceTo(w.group.position); if (d < 4) { w.alive = false; scene.remove(w.group); updateWorshippersUI(); } }
    for (const ally of allies) { if (!ally.alive) continue; const d = bp.distanceTo(ally.group.position); if (d < 4) { ally.alive = false; scene.remove(ally.group); } }
    if (boss.hitTimer > 0) { boss.hitTimer -= dt; boss.group.rotation.z = Math.sin(now * 30) * 0.05; }
    else boss.group.rotation.z *= 0.9;
}

function updateMiniBoss(dt, now) {
    if (!miniBoss || !miniBoss.alive) return;
    const bp = miniBoss.group.position;
    const toPlayer = new THREE.Vector3().subVectors(player.pos, bp); toPlayer.y = 0;
    const dist = toPlayer.length(); toPlayer.normalize();
    const ta = Math.atan2(toPlayer.x, toPlayer.z);
    let ad = ta - miniBoss.group.rotation.y;
    while (ad > Math.PI) ad -= Math.PI * 2;
    while (ad < -Math.PI) ad += Math.PI * 2;
    miniBoss.group.rotation.y += ad * dt * 2;
    const ms = miniBoss.speed * dt;
    bp.x += toPlayer.x * ms; bp.z += toPlayer.z * ms; bp.y = groundHeight(bp.x, bp.z);
    if (dist < 2.5 && now - miniBoss.lastAttack > miniBoss.attackCooldown && !playerInCar) { miniBoss.lastAttack = now; damagePlayer(1); }

function updateCarTurrets(dt, now) {
    for (const car of cars) {
        if (!car.isBlackTurret || car.exploded || car.occupied) continue;
        const carPos = new THREE.Vector3(car.x, groundHeight(car.x, car.z) + 3.55, car.z);
        let nearestEnemy = null, nearestDist = 40;
        for (const enemy of enemies) { if (!enemy.alive || enemy.dying) continue; const d = carPos.distanceTo(enemy.group.position); if (d < nearestDist) { nearestDist = d; nearestEnemy = enemy; } }
        if (nearestEnemy && now - car.turretCooldown > 0.15) {
            car.turretCooldown = now;
            const turretBody = car.group.userData.turretBody;
            if (turretBody) { const dir = new THREE.Vector3().subVectors(nearestEnemy.group.position, carPos).normalize(); turretBody.rotation.y = Math.atan2(dir.x, dir.z); }
            const light = car.group.userData.turretLight;
